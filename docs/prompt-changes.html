<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepCommit Prompt Changes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: file list on the left, one file's diff or full text on the right; stacks to one column on a phone. */
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --fg: #19212d;
  --muted: #5a6575;
  --line: #dde2ea;
  --accent: #2c5bc4;
  --accent-soft: #e5ecfb;
  --add-bg: #e7f6ec;
  --add-strong: #b9e6c8;
  --add-fg: #14612f;
  --del-bg: #fcebea;
  --del-strong: #f4c4c1;
  --del-fg: #8f2420;
  --wd-add: #7fd39d;
  --wd-del: #ee9d98;
  --ctx-fg: #2b3544;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161d;
    --panel: #181e27;
    --fg: #e3e8f0;
    --muted: #9aa5b5;
    --line: #2a3340;
    --accent: #7aa2f7;
    --accent-soft: #1f2a42;
    --add-bg: #14301f;
    --add-strong: #1f5a35;
    --add-fg: #8fe0aa;
    --del-bg: #3a1b1b;
    --del-strong: #6a2a28;
    --del-fg: #f2a9a5;
    --wd-add: #2f8a53;
    --wd-del: #9a403c;
    --ctx-fg: #c9d2df;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--font-ui);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
a { color: var(--accent); }
.wrap { max-width: 1500px; margin: 0 auto; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; margin-bottom: 16px; }
header.top h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
header.top p { margin: 0; color: var(--muted); max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; }
.stats li { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-variant-numeric: tabular-nums; }
.stats b { font-weight: 600; }
.stats .a { color: var(--add-fg); }
.stats .d { color: var(--del-fg); }

.layout { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

nav.files { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
@media (max-width: 860px) { nav.files { position: static; max-height: none; } }
nav.files h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 12px 8px 4px; }
nav.files h2:first-child { margin-top: 4px; }
nav.files a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--fg); border: 1px solid transparent; }
nav.files a:hover { background: var(--accent-soft); }
nav.files a[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
nav.files a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
nav.files .nm { font-family: var(--font-code); font-size: 12.5px; overflow-wrap: anywhere; }
nav.files .cn { font-family: var(--font-code); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
nav.files .cn .a { color: var(--add-fg); }
nav.files .cn .d { color: var(--del-fg); }
nav.files .nt { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }

main.view { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.fh { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.fh .path { font-family: var(--font-code); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.fh h2 { margin: 2px 0 6px; font-size: 17px; font-weight: 600; font-family: var(--font-code); overflow-wrap: anywhere; }
.fh .note { margin: 0; color: var(--muted); max-width: 80ch; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); vertical-align: middle; margin-left: 8px; }
.pill.new { color: var(--add-fg); border-color: var(--add-strong); background: var(--add-bg); }
.pill.modified { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

.bar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; background: transparent; color: var(--fg); border: 0; padding: 5px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend .la { background: var(--add-strong); }
.legend .ld { background: var(--del-strong); }

.code { font-family: var(--font-code); font-size: 12.5px; line-height: 1.55; }
.row { display: grid; }
.row.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.row.uni { grid-template-columns: 3.4rem 3.4rem 1.4rem minmax(0, 1fr); }
.row.one { grid-template-columns: 3.4rem minmax(0, 1fr); }
.cell { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); min-width: 0; border-bottom: 1px solid transparent; }
.cell + .cell { border-left: 1px solid var(--line); }
.ln { text-align: right; padding: 0 8px; color: var(--muted); user-select: none; font-variant-numeric: tabular-nums; opacity: 0.8; }
.sg { text-align: center; color: var(--muted); user-select: none; }
.tx { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 10px 0 6px; min-width: 0; color: var(--ctx-fg); }
.tx:empty::after { content: " "; }
.add { background: var(--add-bg); }
.add .tx { color: var(--add-fg); }
.add .ln, .add .sg { background: var(--add-strong); color: var(--add-fg); opacity: 1; }
.del { background: var(--del-bg); }
.del .tx { color: var(--del-fg); }
.del .ln, .del .sg { background: var(--del-strong); color: var(--del-fg); opacity: 1; }
.void { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line) 6px 7px); opacity: 0.55; }
mark.w { background: var(--wd-add); color: inherit; border-radius: 2px; padding: 0 1px; }
.del mark.w { background: var(--wd-del); }
.chg { scroll-margin-top: 70px; }
.chg.cur { outline: 2px solid var(--accent); outline-offset: -2px; }
.pill.rewritten { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tag-nr { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; white-space: nowrap; }
nav.files a.ovl { grid-template-columns: minmax(0, 1fr); font-weight: 600; }
.what { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--accent-soft); }
.what h3 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.what ul { margin: 0 0 8px; padding-left: 20px; }
.what li { margin: 2px 0; }
.what p { margin: 0; }
.nav2 { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.nav2 button { font: inherit; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.nav2 button:hover { background: var(--accent-soft); }
.nav2 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav2 .ct { font-variant-numeric: tabular-nums; min-width: 8.5em; text-align: center; }
.ov { padding: 16px 18px 22px; max-width: 110ch; }
.ov h2 { font-size: 17px; margin: 0 0 8px; }
.ov h3 { font-size: 14px; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ov p { margin: 6px 0; }
.ov .tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.ov table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13px; }
.ov th, .ov td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.ov th { background: var(--accent-soft); font-weight: 600; }
.ov td:first-child { font-weight: 600; width: 18%; }
.ov dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; }
.ov dt { font-weight: 600; }
.ov dd { margin: 0; }
.ov ol { padding-left: 22px; }
.ov li { margin: 4px 0; }
.ov code { font-family: var(--font-code); font-size: 12.5px; }
@media (max-width: 700px) { .ov dl { grid-template-columns: minmax(0, 1fr); } .ov dd { margin-bottom: 6px; } }
.fold > button { display: block; width: 100%; font: 12px var(--font-ui); text-align: left; padding: 5px 14px; color: var(--accent); background: var(--accent-soft); border: 0; border-block: 1px solid var(--line); cursor: pointer; }
.fold > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.scroll { overflow-x: auto; }
.empty { padding: 28px 16px; color: var(--muted); }
.hint { padding: 10px 16px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }
@media (max-width: 700px) {
  .row.split { grid-template-columns: minmax(0, 1fr); }
  .cell + .cell { border-left: 0; border-top: 1px dashed var(--line); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>

<script type="application/json" id="data">{"files": [{"what": ["Added a workspace section: the table of repos, where each repo is checked out, and how to find a commit's repo.", "Seed target changed from fewer than 20 in total to about 20 per repo (soft).", "Every seed line now carries a repo field.", "A contract change and its first consumer in another repo should be able to end up in one milestone.", "git commands now name the repo folder: git -C repo_data/<repo>."], "why": "Single-repo runs are just a workspace with one repo, so one multi-repo prompt is enough.", "rewritten": true, "id": "seed-discovery-md", "path": "deepcommit/pipeline/prompts/stage_breakdown_v1/seed_discovery.md", "name": "seed_discovery.md", "group": "Phase 2: milestone stages", "note": "Stage 1. Rewritten multi-repo only: workspace table, git -C per repo, about 20 seeds per repo (soft), a repo field on every seed, contract change and first consumer kept together.", "status": "modified", "old": ["# Milestone Seed Discovery - LLM-as-Judge with DAG Statistics", "", "## Task Overview", "", "Analyze commits for {{repo_name}} (version {{version_range}}) and identify **milestone seeds** - commits that represent the starting points of major development milestones.", "", "You are an LLM judge with access to rich commit data including DAG topology statistics. Use your semantic understanding combined with structural metrics to identify milestone seeds (target: < 20). Ultrathink", "", "---", "", "## Critical Data Sources", "", "### 1. Main Commits with textual commit dependency DAG Statistics (ENTRY POINT - READ THIS COMPLETELY!)", "", "**File**: `{{main_commits}}`", "", "This is your PRIMARY data source. Each line contains a commit with complete information:", "", "```json", "{", "  \"sha\": \"1812eac7\",", "  \"message\": \"Add native Emscripten support\",", "  \"additions\": 1100,", "  \"deletions\": 2,", "  \"files_count\": 9,", "  \"dag\": {", "    \"layer\": 0,", "    \"in_degree\": 0,", "    \"out_degree\": 7,", "    \"ancestors_count\": 0,", "    \"descendants_count\": 16", "  }", "}", "```", "", "**Field Explanations**:", "", "- **sha**: Short commit hash for identification", "- **message**: Commit message (semantic signal)", "- **author.time**: Commit timestamp", "- **merged_via_pr**: Associated PR number (can cross-reference with pull_requests.jsonl)", "- **additions/deletions**: Code churn (magnitude of change)", "- **files_changed**: Detailed per-file changes (reveals scope and nature)", "- **dag.layer**: Topological layer within the constructed dependency DAG.", "  - `0` = Foundation (no dependencies)", "  - `1-2` = Early layers", "  - `3-5` = Later layers", "  - Layer indicates structural order only; a seed anchors a milestone phase and is not necessarily the earliest or lowest-layer commit", "- **dag.descendants_count**: Transitive number of commits that depend on this commit in the analysis DAG (impact).", "  - Higher count → broader impact → higher priority", "- **dag.ancestors_count**: Transitive number of commits this commit depends on in the analysis DAG (dependency depth).", "  - Lower count → more independent → higher priority", "- **dag.in_degree/out_degree**: Direct dependency relationships in the analysis DAG.", "  - Edge semantics: `source -> target` means the target depends on the source", "  - `in_degree` = direct dependencies; `out_degree` = direct dependents", "  - Definition & limits: dependencies are textual edit-overlap/ordering signals (commit B edits on top of A). They do not include semantic or symbolic relations (e.g., API/func call graph, type-level coupling). Inferred with `detection_fuzz=3`, scoped to `analysis_scope=[\"src/\"]`. Only node-level stats are provided (no full DAG). Use alongside semantics and evolutionary signals—they are complementary.", "", "**🔥 YOU MUST READ THIS FILE COMPLETELY - IT'S YOUR CORE DATA**", "", "---", "", "### 2. Code Maat Analysis (Pre-computed)", "", "**File**: `{{codemaat_analysis}}`", "", " - Prepare helper sets/maps if useful (e.g., hotspots, high-churn files).", "", "### Step 2: Use Multi-Dimensional Signals", "", "You have access to rich signals across **3 dimensions**. Use your judgment to identify commits that represent milestone seeds.", "", "#### Available Signals", "", "**DAG Topology** (Structural Importance):", "- `layer`: Topological layer (lower = foundation)", "- `descendants_count`: How many commits depend on this", "- `ancestors_count`: How many commits this depends on", "- `in_degree`, `out_degree`: Direct dependency relationships", "", "**Semantics** (What Changed & Why):", "- Commit message (breaking changes, new features, platform support, security)", "- PR title/body (if available via `merged_via_pr`)", "- File changes (new directories, file status, paths)", "- Code churn (additions, deletions)", "", "**Evolutionary Patterns** (How It Evolved):", "- Entity churn (hotspots, cumulative file changes)", "- Coupling (files changing together)", "- Temporal patterns (activity spikes)", "", "Use these signals together—no single metric decides a seed.", "", "### Step 3: Select Seeds", "", "**Target**: < 20 seeds. Choose commits that open a new development theme for a phase (not incremental work). Aim for diversity across milestone types.", "", "---", "", "## Milestone Types", "", "Classify each seed into one of these types:", "", "- **breaking_change**: Removes support, breaks compatibility", "- **major_feature**: Adds significant new functionality", "- **platform_support**: Adds support for new platform/runtime", "- **security_fix**: Addresses security vulnerabilities", "- **architectural_refactor**: Major internal restructuring", "- **dependency_update**: Significant dependency changes", "", "---", "", "## Output Format", "", "**IMPORTANT**: Save all generated files to the `{{result_path}}` directory.", "", "**Primary Output**: `{{milestone_seeds}}`", "", "Each line should contain:", "", "```json", "{ \"sha\": \"1812eac7\", \"confidence_sc olutionary patterns** (churn, hotspots, coupling)", "", "Trust your judgment, but ground it in data. Good luck!"], "new": ["# Milestone Seed Discovery - LLM-as-Judge with DAG Statistics", "", "## Task Overview", "", "Analyze commits for the workspace repositories {{repo_name}} (version {{version_range}}) and identify **milestone seeds** - commits that represent the starting points of major development milestones.", "", "You are an LLM judge with access to rich commit data including DAG topology statistics. Use your semantic understanding combined with structural metrics to identify milestone seeds (target: about 20 per repository, soft). Ultrathink", "", "### Workspace `{{workspace_id}}`", "", "This run covers a workspace of one or more repositories that are developed together:", "", "{{workspace_repos_table}}", "", "- Inspect code with `git -C repo_data/<repo> ...` (the `repo dir` column of the table; for a one-repo workspace that is `repo_data` itself). The MCP git tools route to the correct repository automatically.", "- Commit ids are bare 7-character SHAs, unique inside the workspace. A commit's repository is its `repo` field in the commit records or its entry in `commit_repos` (`commit_repos.json`). Never guess it from the SHA and never run `git` against the wrong repository.", "- With more than one repository, every file path in merged data is prefixed `<repo>/<path-in-repo>`; strip the prefix before passing a path to `git -C repo_data/<repo>`.", "- Edges in `commit_dag.json` come in two groups. `edges_dag` holds per-repository textual edges plus HARD cross-repo edges (`\"xrepo\": true`, `edge_types` such as `xrepo_contract`, `xrepo_pin`, `xrepo_pr_link`). `edges_soft` holds heuristic hints (for example time proximity): never enforced, and you may cut them.", "", "**Seed rules**:", "- The seed pool spans all repositories. Soft target: about 20 seeds **per repository**, not 20 in total.", "- A contract change (for example a `.proto` or OpenAPI change) and its depth).", "  - Lower count → more independent → higher priority", "- **dag.in_degree/out_degree**: Direct dependency relationships in the analysis DAG.", "  - Edge semantics: `source -> target` means the target depends on the source", "  - `in_degree` = direct dependencies; `out_degree` = direct dependents", "  - Definition & limits: dependencies are textual edit-overlap/ordering signals (commit B edits on top of A). They do not include semantic or symbolic relations (e.g., API/func call graph, type-level coupling). Inferred with `detection_fuzz=3`, scoped to `analysis_scope=[\"src/\"]`. Only node-level stats are provided (no full DAG). Use alongside semantics and evolutionary signals—they are complementary.", "", "**🔥 YOU MUST READ THIS FILE COMPLETELY - IT'S YOUR CORE DATA**", "", "---", "", "### 2. Code Maat Analysis (Pre-computed)", "", "**File**: `{{codemaat_analysis}}`", "", "Contains pre-computed evolutionary metrics. Structure:", "", "```json", "{", "  \"hotspots\": { \"top_20\": [{\"entity\": \"src/urllib3/response.py\"}] },", "  \"coupling\": { \"threshold_40\": [{\"entity\": \"src/urllib3/connection.py\", \"coupled\": \"src/urllib3/response.py\"}] },", "  \"entity_churn\": { \"top_20\": [{\"entity\": \"src/urllib3/contrib/emscripten/fetch.py\", \"added\": \"725\", \"deleted\": \"17\"}] },", "  \"temporal_churn\": { \"all\": [{\"date\": \"2023-11-25\", \"added\": \"1100\", \"deleted\": \"2\"}] }", "}", "```", "", "**How to Use**:", "", "- **hotspots**: Frequently modified files indicate core modules. Seeds touching hotspots are often architectural.", "- **coupling**: Files changing together suggest related functionality. Seeds affecting coupled files may represent cross-cutting changes.", "- **entity_churn**:", "  - `additions >> deletions` → New feature/module", "  - `additions ≈ deletions` → Refactoring", "  - High churn in few commits → Concentrated development (likely seed)", "- **temporal_churn**: Spikes in activity indicate major development periods", "", "**Use this to validate and enrich your judgment, but don't rely on it exclusively.**", "", "---", "", "### 3. Additional Reference Data (Query as Needed)", "", "- **Pull Requests**: `{{pull_requests}}`", "  - Cross-reference `merged_via_pr` to get PR title/body for semantic context", "  - Look for labels like \"breaking\", \"security\", \"enhancement\"", "  - Potentially large, do not read the entire file, query as needed", "", "- **Releases**: `{{releases}}`", "  - Understand release milestones", "  - Commits near releases may be important", "", "- **Original Repositories** (via git CLI): one checkout per row of the repository table above", "  - You can use git commands to explore each repository", "  - Example: `git -C repo_data/<repo> show <sha>`", "", "---", "", "## LLM-as-Judge Analysis Process", "", "### Step 1: Load and Explore Data", "", "- Load `{{main_commits}}` and `{{codemaat_analysis}}` into memory.", "- Prepare helper sets/maps if useful (e.g., hotspots, high-churn files).", "", "### Step 2: Use Multi-Dimensional Signals", "", "You have access to rich signals across **3 dimensions**. Use your judgment to identify commits that represent milestone seeds.", "", "#### Available Signals", "", "**DAG Topology** (Structural Importance):", "- `layer`: Topological layer (lower = foundation)", "- `descendants_count`: How many commits depend on this", "- `ancestors_count`: How many commits this depends on", "- `in_degree`, `out_degree`: Direct dependency relationships", "", "**Semantics** (What Changed & Why):", "- Commit message (breaking changes, new features, platform support, security)", "- PR title/body (if available via `merged_via_pr`)", "- File changes (new directories, file status, paths)", "- Code churn (additions, deletions)", "", "**Evolutionary Patterns** (How It Evolved):", "- Entity churn (hotspots, cumulative file changes)", "- Coupling (files changing together)", "- Temporal patterns (activity spikes)", "", "Use these signals together—no single metric decides a seed.", "", "### Step 3: Select Seeds", "", "**Target**: about 20 seeds per repository (soft). Choose commits that open a new development theme for a phase (not incremental work). Aim for diversity across milestone types.", "", "---", "", "## Milestone Types", "", "Classify each seed into one of these types:", "", "- **breaking_change**: Removes support, breaks compatibility", "- **major_feature**: Adds significant new functionality", "- **platform_support**: Adds support for new platform/runtime", "- **security_fix**: Addresses security vulnerabilities", "- **architectural_refactor**: Major internal restructuring", "- **dependency_update**: Significant dependency changes", "", "---", "", "## Output Format", "", "**IMPORTANT**: Save all generated files to the `{{result_path}}` directory.", "", "**Primary Output**: `{{milestone_seeds}}`", "", "Each line should contain:", "", "```json", "{ \"sha\": \"1812eac7\", \"repo\": \"urllib3\", \"confidence_score\": 0.95, \"milestone_type\": \"platform_support\", \"title\": \"Add Native Emscripten/WebAssembly Support\", \"churn_context\": \"+1100 lines, multiple new files in contrib/emscripten/. High entity churn concentrated in few commits.\", \"rationale\": \"Anchors the Emscripten milestone phase. Layer 0, 16 descendants; strong impact despite node-level DAG scope.\" }", "```", "", "**Required Fields**:", "- **sha**: Short SHA (7 chars)", "- **repo**: Repository name (the `name` column of the repository table) that the seed commit belongs to", "- **confidence_score**: 0.0-1.0 (how confident you are this is a seed)", "- **milestone_type**: One of the types listed above", "- **title**: Concise milestone title (what this milestone delivers)", "- **churn_context**: 1-2 sentences describing relevant churn patterns", "- **rationale**: 2-3 sentences explaining why this is a seed, mentioning DAG metrics", "", "---", "", "## Success Criteria", "", "Your analysis should:", "", "1. Read all commits from `{{main_commits}}`", "2. Use DAG stats, semantics, and evolutionary patterns together", "3. Identify about 20 seeds per repository; provide clear rationales", "4. Cover diverse milestone types", "5. Save outputs to `{{result_path}}` (primary: `{{milestone_seeds}}`)", "", "---", "", "## Key Principles", "", "1) Use signals, not rules. Combine DAG, semantics, and churn; avoid rigid thresholds.", "2) Quality over quantity: a seed opens a phase/theme; incremental commits are not seeds.", "3) Signals are complementary, not decisive in isolation.", "", "---", "", "## Example Decision Process", "", "**Commit**: `1812eac7` \"Add native Emscripten support\"", "", "Data: additions=1100, files=9, layer=0, descendants=16, ancestors=0. Decision: high-confidence seed for the Emscripten phase.", "", "---", "", "## Final Note", "", "This is **true LLM-as-Judge enhanced with structural data**. You're not running an algorithm - you're making informed judgments by combining:", "- **Your semantic understanding** (what changed, why, what it means)", "- **DAG topology** (structural importance, impact, dependencies)", "- **Evolutionary patterns** (churn, hotspots, coupling)", "", "Trust your judgment, but ground it in data. Good luck!"], "ops": [["equal", 0, 4, 0, 4], ["replace", 4, 5, 4, 5], ["equal", 5, 6, 5, 6], ["replace", 6, 7, 6, 7], ["equal", 7, 8, 7, 8], ["insert", 8, 8, 8, 26], ["equal", 8, 101, 26, 119], ["replace", 101, 104, 119, 122], ["equal", 104, 141, 122, 159], ["replace", 141, 142, 159, 160], ["equal", 142, 167, 160, 185], ["replace", 167, 168, 185, 186], ["equal", 168, 172, 186, 190], ["insert", 172, 172, 190, 191], ["equal", 172, 186, 191, 205], ["replace", 186, 187, 205, 206], ["equal", 187, 216, 206, 235]], "add": 27, "del": 8}, {"what": ["Added the workspace section and a short list of hard rules that apply everywhere.", "Coverage and overlap are checked over all repos together and reported per repo.", "Path completeness counts normal edits and hard cross-repo links only; soft links may be cut.", "Seeds joined by a hard link must be in the same group. The milestone CSV always has a repos column.", "A milestone that spans repos must change at least 2 repos, and no single repo's part may be a full feature."], "why": "Single-repo runs are just a workspace with one repo, so one multi-repo prompt is enough.", "rewritten": true, "id": "milestone-consolidate-md", "path": "deepcommit/pipeline/prompts/stage_breakdown_v1/milestone_consolidate.md", "name": "milestone_consolidate.md", "group": "Phase 2: milestone stages", "note": "Stage 2 main agent. Rewritten multi-repo only: coverage and overlap over the union (reported per repo), path completeness on textual and hard xrepo edges only, linked seeds share a group, repos column always filled.", "status": "modified", "old": ["# Milestone Consolidation - Three-Stage Pipeline Main Agent", "", "## [System] Role & Goal", "", "You are the milestone consolidation main agent orchestrating a three-stage pipeline with **three distinct operational phases**:", "", "**Phase 1 — Seed Grouping & Orchestration**: Cluster related milestone seeds into groups (2-5 seeds each) based on semantic similarity, file overlap, and commit DAG topology. Launch sub-agents to perform batch seed expansion on each group in parallel.", "", "**Phase 2 — Streaming Batch Integration**: As sub-agents complete batch expansion, immediately integrate their proposals into the global milestone set. Resolve conflicts, merge small milestones, maintain partition validity.", "", "**Phase 3 — Validation & Iterative Refinement**: Validate commit coverage (100%), partition validity (no overlap), and path completeness (no incomplete chains). Iteratively fix issues until all criteria pass.", "", "**Your challenges**:", "- Phase 1: Group seeds intelligently using LLM-as-Judge to minimize overlap and maximize coverage", "- Phase 2: Integrate batches incrementally, resolve conflicts using code evidence and semantic alignment", "- Phase 3: Achieve 100% coverage and path completeness through iterative refinement", "", "**Your approach**: Evidence-driven, iterative improvement with LLM-as-Judge reasoning to synthesize multiple signals (DAG topology, semantic themes, code evidence) and make informed decisions.", "", "---", "", "## PHASE 1: SEED GROUPING & ORCHESTRATION", "", "### Goal", "", "Partition all milestone seeds into semantically coherent groups to enable efficient batch expansion with minimal overlap and maximum commit coverage.", "", "### Grouping Process", "", "#### Step 1: Load All Seed Evidence", "", "Load complete information for all seeds (typically <20 seeds total):", "", "**1. Core seed information (Required)**:", "   - **File**: `{{milestone_seeds}}`", "   - **Contains**:", "     - Basic info: commit SHA, title, milestone_type, confidence_score", "     - File changes: `files_changed` (file paths, additions, deletions) for overlap analysis", "     - DAG statistics: `commit_dag_stat` (layer, in_degree, out_degree, ancestors/descendants counts)", "     - Semantic context: commit messages, churn context, rationale", "", "**2. DAG co-occurrence relationships (Required)**:", "   - **File**: `{{seed_group_analysis}}`", "   - **Purpose**: Pre-computed co-occurrence patterns showing which seeds appear in each other's commit subgraphs", "   - Seeds with mutual subgraph presence are strongly related", "", "**3. Detailed dependency paths (Optional, query as needed)**:", "   - **File**: `{{commit_dag}}`", "   - **When to use**: If you need to verify specific dependency paths between seeds beyond the summary statistics", "", "**4. Rich semantic context (Optional, query as needed)**:", "   - **Files**: `{{pull_requests}}`, `{{issues}}`, `{{pr_conversations}}`", "   - **When to use**: If commit messages in `{{milestone_seeds}}` are insufficient to understand the feature theme", "", "#### Step 2: LLM-as-Judge Grouping", "", "**Do not use predefined heuristics algorithms**. Instead, read all seed evidence into context and use LLM reasoning to form groups.", "", "**Your task**:", "- Partition seeds into groups (2-5 seeds per group)", "- Consider all evidence types, prioritizing:", "  - **DAG co-occurrence** (strongest signal - seeds appearing in mutual subgraphs)", "  - **File overlap** (high overlap indicates shared module/feature)", "  - **Semantic coherence** (same feature theme, platform, or problem domain)", "", "**Grouping principles**:", "- Each group should have a unified semantic theme", "- Seeds with low affinity to others can form a \"singletons group\"", "- Balance group sizes - avoid one huge group with many tiny groups", "", "**Output for each group**:", "- `group_id`: G01, G02, etc.", "- `seeds`: list of seed commit SHAs", "- `rationale`: explain WHY these seeds belong together (which evidence drove this decision)", "- `semantic_theme`: concise label (e.g., \"http2_protocol\", \"platform_support\")", "", "#### Step 3: Validate Groups", "", "Check the generated groups:", "- **No seed overlap**: Each seed appears in exactly one group", "- **Size constraints**: 2-5 seeds per group (singletons group can exceed this)", "- **Semantic coherence**: Verify each group has a clear unified theme (singletons groups can violate this)", "", "If validation fails, refine the grouping and re-validate.", "", "#### Step 4: Output Seed Groups", "", "**Output File**: `{{seed_groups}}`", "", "**Format**:", "```json", "{", "  \"metadata\": {\"total_seeds\": 15, \"total_groups\": 4},", "  \"groups\": [", "    {", "      \"group_id\": \"G01\",", "      \"seeds\": [\"1812eac7\", \"8b2474d3\"],", "      \"rationale\": \"Both implement Emscripten platform support with high file overlap and mutual DAG co-occurrence\",", "      \"semantic_theme\": \"platform_support\"", "    },", "    ...,", "    {", "      \"group_id\": \"G0N_singletons\",", "      \"seeds\": [\"ae06688f\", \"7a3f8d1e\", \"9c4b2e5f\"],", "      \"rationale\": \"Low-affinity seeds grouped for batch processing efficiency\",", "      \"semantic_theme\": \"mixed\"", "    }", "  ]", "}", "```", "", "#### Step 5: Launch Sub-Agents in Parallel", "", "**Launch all sub-agents in parallel** - one sub-agent per group:", "", "1. For each group in `{{seed_groups}}`, launch a sub-agent using the prompt from `{{subagent_prompt_file}}`", "2. Pass the seed group and grouping rationale as input", "3. Instruct each sub-agent to produce batch milestone proposals with **zero intra-batch commit overlap**", "4. Each sub-agent outputs to `{{result_path}}/batch_{group_id}_milestone_proposals.csv`", "", "---", "", "## PHASE 2: STREAMING BATCH INTEGRATION", "", "### Goal", "", "**Streaming consolidation**: As each sub-agent completes its batch expansion, immediately integrate its proposals into the global milestone set. Do not wait for all sub-agents to finish. Process completed batches sequentially in the order they arrive.", "", "For each completed batch:", "1. Load the batch proposals", "2. Resolve conflicts with existing milestones", "3. Merge small milestones if needed", "4. Update the global milestone set", "", "After all batches are integrated, proceed to Phase 3 validation.", "", "### Critical Data Sources for Phase 2", "", "#### 1. Batch Milestone Proposals (Streaming)", "", "**Files**: `{{result_path}}/batch_{group_id}_milestone_proposals.csv` (one per group)", "", "Load each batch proposal file as it becomes available from completed sub-agents. Process batches sequentially in arrival order.", "", "Each row contains:", "- `proposed_milestone_id`, `title`, `category`, `commits` (semicolon-separated), `mini_srs`, `confidence_score`, `expansion_rationale` (why these commits were selected), `merge_suggestion` (optional, this proposal is suggested to be merge into other ones)", "", "#### 2. Commit Dependency DAG", "", "**File**: `{{commit_dag}}`", "", "Use to verify textual dependencies and detect cycles.", "", "#### 3. Code-Level Analysis (Query as needed)", "", "**Patches**: `{{patches}}/{sha}.patch` - Read patches to understand commit changes for conflict resolution", "", "**Repository**: `{{repo_path}}` - Use git commands for deeper code analysis if needed", "", "#### 4. Semantic Context (Query as needed)", "", "**Files**: `{{pull_requests}}`, `{{pr_conversations}}`, `{{issues}}`, `{{releases}}`", "", "Query minimally when commit messages and patches are insufficient.", "", "---", "", "### Consolidation Process", "", "#### Step 1: Initialize Global State", "", "1. Create empty `{{milestone_csv}}` with headers: `id`, `title`, `category`, `commits`, `mini_srs`, `confidence_score`", "2. Initialize tracking structures:", "   - `commit_to_milestone`: Map tracking which commits are assigned to which milestone", "   - `processed_batches`: Track which batch groups have been integrated", "", "**Note**: `{{milestone_csv}}` serves as the global state. Each batch integration appends to or modifies this file.", "", "---", "", "#### Step 2: Streaming Batch Integration", "", "**Goal**: Incrementally integrate each completed batch into the global milestone set, resolving conflicts and maintaining partition validity.", "", "**Process**: For each batch that completes (in arrival order):", "", "##### Step 2.1: Load and Categorize Batch Proposals", "", "When a sub-agent completes (i.e., `batch_{group_id}_milestone_proposals.csv` appears):", "", "1. **Load current state**: Read existing milestones from `{{milestone_csv}}` (if any) and update `commit_to_milestone` map", "", "2. **Load new proposals** and categorize each as:", "   - **Clean integration**: No commit overlap with existing milestones → can integrate directly", "   - **Conflicting**: Has commits already assigned in `commit_to_milestone` → needs conflict resolution", "   - **Too small**: refer to `merge_suggestion` (if exist) → candidate for merging with similar milestones", "", "##### Step 2.2: Resolve Conflicts", "", "For each conflicting commit, decide ownership using:", "", "**Decision Criteria**:", "1. **Code evidence**: Read `{{patch_dir}}/{sha}.patch` to understand what the commit actually does", "2. **Semantic alignment**: Which milestone's theme better matches the commit's purpose?", "3. **Milestone completeness**: Which assignment maintains better path completeness and DAG coherence?", "", "**Resolution Actions**:", "- Keep in existing milestone, or", "- Move to new batch proposal, or", "- Create separate milestone if poor fit for both", "", "##### Step 2.3: Merge Small Milestones", "", "For proposals with < 3 commits:", "- Merge with semantically similar existing milestones if possible", "- Exception: Keep distinct if merging dilutes coherence", "", "##### Step 2.4: Append to Milestones CSV", "", "1. Append clean and resolved proposals to `{{milestone_csv}}` with corresponding fields", "2. Update `commit_to_milestone` mapping", "", "##### Step 2.5: Record High-Confidence Dependencies", "", "After integrating this batch, identify and record milestone dependencies with high confidence:", "", "1. Analyze commit DAG relationships between milestones in the current global set", "2. For dependencies with strong evidence (e.g., clear commit dependencies, semantic flow, architectural layering), append to `{{dependency_proposals_csv}}`", "3. **Format**: `prerequisite_id`, `dependant_id`, `rationale`", "   - `source -> target` means target depends on source", "   - Only record high-confidence dependencies (skip uncertain cases)", "   - `rationale`: Brief explanation of why this dependency exists", "", "**Repeat** Step 2.1-2.5 until all batches are processed.", "", "---", "", "## PHASE 3: VALIDATION AND ITERATIVE REFINEMENT", "", "**Goal**: Ensure all milestones satisfy success criteria through iterative validation and refinement. Iterate until all checks pass.", "", "---", "", "#### Step 1: Iterative Validation and Fixing", "", "**Process**: Run validations → if any fail, fix issues → repeat until all pass (max 5 iterations, flag if exceeded).", "", "**Run these three validations** (all must pass):", "", "Note: use params with absolute paths", "", "| Validation | Tool | Success Criteria |", "|------------|------|------------------|", "| **Coverage & Partition** | `{{analyze_commit_coverage}}({{milestone_csv}})` | `main_coverage = 100%`<br>`overlapping_commits = []`<br>`invalid_commits = []` |", "| **Path Completeness** | `{{analyze_milestone_conflicts}}({{milestone_csv}})` | All milestones: `conflict_count = 0`, `invalid_commits = []`<br>*Concept: If A, B in same milestone, all commits on any A↔B path must be included* |", "| **No Cycles** | `{{validate_milestone_partitioning}}({{milestone_csv}})` | `is_valid_partitioning = true`<br>`cycles_count = 0`<br>*Concept: Milestones must form valid DAG* |", "", "**If validation fails**, fix using these strategies (update `{{milestone_csv}}` after each fix):", "", "| Issue | Fix Strategy |", "|-------|--------------|", "| **Coverage < 100%** | • Assign to existing milestones (verify with patches if semantically related)<br>• Create **standalone cleanup/maintenance milestones** for commits that don't fit existing themes (typo fixes, version bumps, CI config, code formatting, deprecation removals, etc.) — use category `Maintenance` and keep for traceability; filter in post-processing if needed<br>• Extract new seeds → re-run Phase 1+2 (if substantial features) |", "| **Overlapping commits** | Apply Phase 2 criteria (code evidence, semantic alignment, path completeness) → assign to exactly one |", "| **Path incomplete** | • Add missing commits from incomplete paths<br>• Move boundary commits to other milestones<br>• Split milestone if paths too divergent |", "| **Cycles detected** | • Analyze with `{{check_dependency}}(M1, M2)` for cycle details<br>• Merge milestones with bidirectional dependencies<br>• Re-assign boundary commits to break cycles |", "", "---", "", "#### Step 2: Generate Final Outputs", "", "**Output Directory**: `{{result_path}}/`", "", "1. **{{milestone_csv}}**: Final validated milestones with fields: `id`, `title`, `category`, `commits`, `mini_srs`, `confidence_score`", "2. **{{dependency_proposals_csv}}**: High-confidence milestone dependencies with fields: `prerequisite_id`, `dependant_id`, `rationale`", "3. **consolidation_report.md**: Summary of grouping decisions, conflict resolutions, validation results", "", "---", "", "## Success Criteria", "", "**Final Deliverables**:", "- `{{milestone_csv}}` with all milestones (fields: `id`, `title`, `category`, `commits`, `mini_srs`, `confidence_score`)", "- `{{dependency_proposals_csv}}` with dependencies (fields: `prerequisite_id`, `dependant_id`, `rationale`)", "- `consolidation_report.md` with execution summary", "", "**All Three Validations Pass**:", "- `{{analyze_commit_coverage}}`: `main_coverage = 100%`, `overlapping_commits = []`, `invalid_commits = []`", "- `{{analyze_milestone_conflicts}}`: All milestones have `conflict_count = 0`, `invalid_commits = []`", "- `{{validate_milestone_partitioning}}`: `is_valid_partitioning = true`, `cycles_count = 0`", "", "---", "", "## Key Principles", "", "1. **LLM-as-Judge**: Synthesize multiple signals (DAG topology, semantic themes, code evidence) to make informed decisions - trust your reasoning but ground it in evidence", "", "2. **Evidence-driven**: Read patches to understand commits; query PRs/issues/conversations for context; analyze DAG structure for dependencies - never guess", "", "3. **Iterative refinement**: Validate rigorously, fix issues immediately, repeat until perfect", "", "---", "", "## Final Note", "", "Your role as main agent is to:", "- **Phase 1**: Orchestrate intelligently - group seeds using LLM-as-Judge", "- **Phase 2**: Integrate incrementally - process batches as they arrive, resolve conflicts", "- **Phase 3**: Refine iteratively - validate thoroughly, fix issues, repeat until perfect", "", "Use all available evidence, apply rigorous validation, and produce a clean, complete milestone partition.", "", "**Trust your judgment. Ground it in evidence. Validate rigorously. Ultrathink.**"], "new": ["# Milestone Consolidation - Three-Stage Pipeline Main Agent", "", "## [System] Role & Goal", "", "You are the milestone consolidation main agent orchestrating a three-stage pipeline with **three distinct operational phases**:", "", "**Phase 1 — Seed Grouping & Orchestration**: Cluster related milestone seeds into groups (2-5 seeds each) based on semantic similarity, file overlap, and commit DAG topology. Launch sub-agents to perform batch seed expansion on each group in parallel.", "", "**Phase 2 — Streaming Batch Integration**: As sub-agents complete batch expansion, immediately integrate their proposals into the global milestone set. Resolve conflicts, merge small milestones, maintain partition validity.", "", "**Phase 3 — Validation & Iterative Refinement**: Validate commit coverage (100%), partition validity (no overlap), and path completeness (no incomplete chains). Iteratively fix issues until all criteria pass.", "", "**Your challenges**:", "- Phase 1: Group seeds intelligently using LLM-as-Judge to minimize overlap and maximize coverage", "- Phase 2: Integrate batches incrementally, resolve conflicts using code evidence and semantic alignment", "- Phase 3: Achieve 100% coverage and path completeness through iterative refinement", "", "**Your approach**: Evidence-driven, iterative improvement with LLM-as-Judge reasoning to synthesize multiple signals (DAG topology, semantic themes, code evidence) and make informed decisions.", "", "### Workspace `{{workspace_id}}`", "", "This run covers a workspace of one or more repositories that are developed together:", "", "{{workspace_repos_table}}", "", "- Inspect code with `git -C repo_data/<repo> ...` (the `repo dir` column of the table; for a one-repo workspace that is `repo_data` itself). The MCP git tools route to the correct repository automatically.", "- Commit ids are bare 7-character SHAs, unique inside the workspace. A commit's repository is its `repo` field in the commit records or its entry in `commit_repos` (`commit_repos.json`). Never guess it from the SHA and never run `git` against the wrong repository.", "- With more than one repository, every file path in merged data is prefixed `<repo>/<path-in-repo>`; strip the prefix before passing a path to `git -C repo_data/<repo>`.", "- Edges in `commit_dag.json` come in two groups. `edges_dag` holds per-repository textual edges plus HARD cross-repo edges (`\"xrepo\": true`, `edge_types` such as `xrepo_contract`, `xrepo_pin`, `xrepo_pr_link`). `edges_soft` holds heuristic hints (for example time proximity): never enforced, and you may cut them.", "", "**Hard rules** (they apply everywhere below):", "1. **Coverage and partition**: 100% coverage, zero overlap and zero invalid commits are measured over the UNION of all commits of all repositories, and reported per repository as well as overall.", "2. **Path completeness**: enforced on textual edges inside each repository and on HARD cross-repo edges (`\"xrepo\": true` in `edges_dag`) only. Soft edges (`edges_soft`) are hints: you may cut them, and they never require extra commits in a milestone.", "3. **Seed grouping**: seeds linked by a hard xrepo edge MUST be placed in the same group, so a group may contain seeds of several repositories (still 2-5 seeds per group).", "4. **Cross-repo milestones**: a milestone MAY contain commits from several repositories, and should whenever hard xrepo edges connect them (for example a contract change plus its first consumer). Never split a contract change from its first consumer. The `repos` column of the milestone CSV holds the semicolon-separated repository names of the milestone's commits (for example `contract;sdk`; one name for a single-repo milestone).", "5. **Validity of a cross-repo milestone**: it must change at least 2 repositories, and no single repository's part ALONE may be a complete feature. If one repository's part is already a complete feature, split the milestone per repository.", "6. **Dependencies**: a milestone dependency that follows a hard xrepo edge is a cross-repo (`XREPO`) dependency; name the edge in its `rationale`.", "---", "", "## PHASE 1: SEED GROUPING & ORCHESTRATION", "", "### Goal", "", "Partition all milestone seeds into semantically coherent groups to enable efficient batch expansion with minimal overlap and maximum commit coverage.", "", "### Grouping Process", "", "#### Step 1: Load All Seed Evidence", "", "Load complete information for all seeds (typically about 20 seeds per repository):", "", "**1. Core seed information (Required)**:", "   - **File**: `{{milestone_seeds}}`", "   - **Contains**:", "     - Basic info: commit SHA, title, milestone_type, confidence_score", "     - File changes: `files_changed` (file paths, additions, deletions) for overlap analysis", "     - DAG statistics: `commit_dag_stat` (layer, in_degree, out_degree, ancestors/descendants counts)", "     - Semantic context: commit messages, churn context, rationale", "", "**2. DAG co-occurrence relationships (Required)**:", "   - **File**: `{{seed_group_analysis}}`", "   - **Purpose**: Pre-computed co-occurrence patterns showing which seeds appear in each other's commit subgraphs", "   - Seeds with mutual subgraph presence are strongly related", "", "**3. Detailed dependency paths (Optional, query as needed)**:", "   - **File**: `{{commit_dag}}`", "   - **When to use**: If you need to verify specific dependency paths between seeds beyond the summary statistics", "", "**4. Rich semantic context (Optional, query as needed)**:", "   - **Files**: `{{pull_requests}}`, `{{issues}}`, `{{pr_conversations}}`", "   - **When to use**: If commit messages in `{{milestone_seeds}}` are insufficient to understand the feature theme", "", "#### Step 2: LLM-as-Judge Grouping", "", "**Do not use predefined heuristics algorithms**. Instead, read all seed evidence into context and use LLM reasoning to form groups.", "", "**Your task**:", "- Partition seeds into groups (2-5 seeds per group)", "- Consider all evidence types, prioritizing:", "  - **DAG co-occurrence** (strongest signal - seeds appearing in mutual subgraphs)", "  - **File overlap** (high overlap indicates shared module/feature)", "  - **Semantic coherence** (same feature theme, platform, or problem domain)", "", "**Grouping principles**:", "- Each group should have a unified semantic theme", "- Seeds with low affinity to others can form a \"singletons group\"", "- Balance group sizes - avoid one huge group with many tiny groups", "", "**Output for each group**:", "- `group_id`: G01, G02, etc.", "- `seeds`: list of seed commit SHAs", "- `rationale`: explain WHY these seeds belong together (which evidence drove this decision)", "- `semantic_theme`: concise label (e.g., \"http2_protocol\", \"platform_support\")", "", "#### Step 3: Validate Groups", "", "Check the generated groups:", "- **No seed overlap**: Each seed appears in exactly one group", "- **Size constraints**: 2-5 seeds per group (singletons group can exceed this)", "- **Semantic coherence**: Verify each group has a clear unified theme (singletons groups can violate this)", "", "If validation fails, refine the grouping and re-validate.", "", "#### Step 4: Output Seed Groups", "", "**Output File**: `{{seed_groups}}`", "", "**Format**:", "```json", "{", "  \"metadata\": {\"total_seeds\": 15, \"total_groups\": 4},", "  \"groups\": [", "    {", "      \"group_id\": \"G01\",", "      \"seeds\": [\"1812eac7\", \"8b2474d3\"],", "      \"rationale\": \"Both implement Emscripten platform support with high file overlap and mutual DAG co-occurrence\",", "      \"semantic_theme\": \"platform_support\"", "    },", "    ...,", "    {", "      \"group_id\": \"G0N_singletons\",", "      \"seeds\": [\"ae06688f\", \"7a3f8d1e\", \"9c4b2e5f\"],", "      \"rationale\": \"Low-affinity seeds grouped for batch processing efficiency\",", "      \"semantic_theme\": \"mixed\"", "    }", "  ]", "}", "```", "", "#### Step 5: Launch Sub-Agents in Parallel", "", "**Launch all sub-agents in parallel** - one sub-agent per group:", "", "1. For each group in `{{seed_groups}}`, launch a sub-agent using the prompt from `{{subagent_prompt_file}}`", "2. Pass the seed group and grouping rationale as input", "3. Instruct each sub-agent to produce batch milestone proposals with **zero intra-batch commit overlap**", "4. Each sub-agent outputs to `{{result_path}}/batch_{group_id}_milestone_proposals.csv`", "", "---", "", "## PHASE 2: STREAMING BATCH INTEGRATION", "", "### Goal", "", "**Streaming consolidation**: As each sub-agent completes its batch expansion, immediately integrate its proposals into the global milestone set. Do not wait for all sub-agents to finish. Process completed batches sequentially in the order they arrive.", "", "For each completed batch:", "1. Load the batch proposals", "2. Resolve conflicts with existing milestones", "3. Merge small milestones if needed", "4. Update the global milestone set", "", "After all batches are integrated, proceed to Phase 3 validation.", "", "### Critical Data Sources for Phase 2", "", "#### 1. Batch Milestone Proposals (Streaming)", "", "**Files**: `{{result_path}}/batch_{group_id}_milestone_proposals.csv` (one per group)", "", "Load each batch proposal file as it becomes available from completed sub-agents. Process batches sequentially in arrival order.", "", "Each row contains:", "- `proposed_milestone_id`, `title`, `category`, `commits` (semicolon-separated), `mini_srs`, `confidence_score`, `expansion_rationale` (why these commits were selected), `merge_suggestion` (optional, this proposal is suggested to be merge into other ones)", "", "#### 2. Commit Dependency DAG", "", "**File**: `{{commit_dag}}`", "", "Use to verify textual dependencies and detect cycles.", "", "#### 3. Code-Level Analysis (Query as needed)", "", "**Patches**: `{{patches}}/{sha}.patch` - Read patches to understand commit changes for conflict resolution", "", "**Repositories**: one checkout per row of the repository table above (`git -C repo_data/<repo> ...`) - Use git commands for deeper code analysis if needed", "", "#### 4. Semantic Context (Query as needed)", "", "**Files**: `{{pull_requests}}`, `{{pr_conversations}}`, `{{issues}}`, `{{releases}}`", "", "Query minimally when commit messages and patches are insufficient.", "", "---", "", "### Consolidation Process", "", "#### Step 1: Initialize Global State", "", "1. Create empty `{{milestone_csv}}` with headers: `id`, `title`, `category`, `commits`, `mini_srs`, `confidence_score`, `repos`", "2. Initialize tracking structures:", "   - `commit_to_milestone`: Map tracking which commits are assigned to which milestone", "   - `processed_batches`: Track which batch groups have been integrated", "", "**Note**: `{{milestone_csv}}` serves as the global state. Each batch integration appends to or modifies this file.", "", "---", "", "#### Step 2: Streaming Batch Integration", "", "**Goal**: Incrementally integrate each completed batch into the global milestone set, resolving conflicts and maintaining partition validity.", "", "**Process**: For each batch that completes (in arrival order):", "", "##### Step 2.1: Load and Categorize Batch Proposals", "", "When a sub-agent completes (i.e., `batch_{group_id}_milestone_proposals.csv` appears):", "", "1. **Load current state**: Read existing milestones from `{{milestone_csv}}` (if any) and update `commit_to_milestone` map", "", "2. **Load new proposals** and categorize each as:", "   - **Clean integration**: No commit overlap with existing milestones → can integrate directly", "   - **Conflicting**: Has commits already assigned in `commit_to_milestone` → needs conflict resolution", "   - **Too small**: refer to `merge_suggestion` (if exist) → candidate for merging with similar milestones", "", "##### Step 2.2: Resolve Conflicts", "", "For each conflicting commit, decide ownership using:", "", "**Decision Criteria**:", "1. **Code evidence**: Read `{{patch_dir}}/{sha}.patch` to understand what the commit actually does", "2. **Semantic alignment**: Which milestone's theme better matches the commit's purpose?", "3. **Milestone completeness**: Which assignment maintains better path completeness and DAG coherence?", "", "**Resolution Actions**:", "- Keep in existing milestone, or", "- Move to new batch proposal, or", "- Create separate milestone if poor fit for both", "", "##### Step 2.3: Merge Small Milestones", "", "For proposals with < 3 commits:", "- Merge with semantically similar existing milestones if possible", "- Exception: Keep distinct if merging dilutes coherence", "", "##### Step 2.4: Append to Milestones CSV", "", "1. Append clean and resolved proposals to `{{milestone_csv}}` with corresponding fields", "2. Update `commit_to_milestone` mapping", "", "##### Step 2.5: Record High-Confidence Dependencies", "", "After integrating this batch, identify and record milestone dependencies with high confidence:", "", "1. Analyze commit DAG relationships between milestones in the current global set", "2. For dependencies with strong evidence (e.g., clear commit dependencies, semantic flow, architectural layering), append to `{{dependency_proposals_csv}}`", "3. **Format**: `prerequisite_id`, `dependant_id`, `rationale`", "   - `source -> target` means target depends on source", "   - Only record high-confidence dependencies (skip uncertain cases)", "   - `rationale`: Brief explanation of why this dependency exists", "", "**Repeat** Step 2.1-2.5 until all batches are processed.", "", "---", "", "## PHASE 3: VALIDATION AND ITERATIVE REFINEMENT", "", "**Goal**: Ensure all milestones satisfy success criteria through iterative validation and refinement. Iterate until all checks pass.", "", "---", "", "#### Step 1: Iterative Validation and Fixing", "", "**Process**: Run validations → if any fail, fix issues → repeat until all pass (max 5 iterations, flag if exceeded).", "", "**Run these three validations** (all must pass):", "", "Note: use params with absolute paths", "", "| Validation | Tool | Success Criteria |", "|------------|------|------------------|", "| **Coverage & Partition** | `{{analyze_commit_coverage}}({{milestone_csv}})` | `main_coverage = 100%`<br>`overlapping_commits = []`<br>`invalid_commits = []` |", "| **Path Completeness** | `{{analyze_milestone_conflicts}}({{milestone_csv}})` | All milestones: `conflict_count = 0`, `invalid_commits = []`<br>*Concept: If A, B in same milestone, all commits on any A↔B path must be included* |", "| **No Cycles** | `{{validate_milestone_partitioning}}({{milestone_csv}})` | `is_valid_partitioning = true`<br>`cycles_count = 0`<br>*Concept: Milestones must form valid DAG* |", "", "The three validations are evaluated over the union of all repositories; read `main_coverage`, `overlapping_commits` and `invalid_commits` per repository as well as overall. A path-completeness conflict that exists only because of a soft xrepo edge is not a failure: cut that edge instead of adding commits. Also check that every milestone listing 2 or more repositories in `repos` satisfies the cross-repo validity rule.", "", "**If validation fails**, fix using these strategies (update `{{milestone_csv}}` after each fix):", "", "| Issue | Fix Strategy |", "|-------|--------------|", "| **Coverage < 100%** | • Assign to existing milestones (verify with patches if semantically related)<br>• Create **standalone cleanup/maintenance milestones** for commits that don't fit existing themes (typo fixes, version bumps, CI config, code formatting, deprecation removals, etc.) — use category `Maintenance` and keep for traceability; filter in post-processing if needed<br>• Extract new seeds → re-run Phase 1+2 (if substantial features) |", "| **Overlapping commits** | Apply Phase 2 criteria (code evidence, semantic alignment, path completeness) → assign to exactly one |", "| **Path incomplete** | • Add missing commits from incomplete paths<br>• Move boundary commits to other milestones<br>• Split milestone if paths too divergent |", "| **Cycles detected** | • Analyze with `{{check_dependency}}(M1, M2)` for cycle details<br>• Merge milestones with bidirectional dependencies<br>• Re-assign boundary commits to break cycles |", "", "---", "", "#### Step 2: Generate Final Outputs", "", "**Output Directory**: `{{result_path}}/`", "", "1. **{{milestone_csv}}**: Final validated milestones with fields: `id`, `title`, `category`, `commits`, `mini_srs`, `confidence_score`, `repos`", "2. **{{dependency_proposals_csv}}**: High-confidence milestone dependencies with fields: `prerequisite_id`, `dependant_id`, `rationale`", "3. **consolidation_report.md**: Summary of grouping decisions, conflict resolutions, validation results", "", "---", "", "## Success Criteria", "", "**Final Deliverables**:", "- `{{milestone_csv}}` with all milestones (fields: `id`, `title`, `category`, `commits`, `mini_srs`, `confidence_score`, `repos`)", "- `{{dependency_proposals_csv}}` with dependencies (fields: `prerequisite_id`, `dependant_id`, `rationale`)", "- `consolidation_report.md` with execution summary", "", "**All Three Validations Pass**:", "- `{{analyze_commit_coverage}}`: `main_coverage = 100%`, `overlapping_commits = []`, `invalid_commits = []`", "- `{{analyze_milestone_conflicts}}`: All milestones have `conflict_count = 0`, `invalid_commits = []`", "- `{{validate_milestone_partitioning}}`: `is_valid_partitioning = true`, `cycles_count = 0`", "", "---", "", "## Key Principles", "", "1. **LLM-as-Judge**: Synthesize multiple signals (DAG topology, semantic themes, code evidence) to make informed decisions - trust your reasoning but ground it in evidence", "", "2. **Evidence-driven**: Read patches to understand commits; query PRs/issues/conversations for context; analyze DAG structure for dependencies - never guess", "", "3. **Iterative refinement**: Validate rigorously, fix issues immediately, repeat until perfect", "", "---", "", "## Final Note", "", "Your role as main agent is to:", "- **Phase 1**: Orchestrate intelligently - group seeds using LLM-as-Judge", "- **Phase 2**: Integrate incrementally - process batches as they arrive, resolve conflicts", "- **Phase 3**: Refine iteratively - validate thoroughly, fix issues, repeat until perfect", "", "Use all available evidence, apply rigorous validation, and produce a clean, complete milestone partition.", "", "**Trust your judgment. Ground it in evidence. Validate rigorously. Ultrathink.**"], "ops": [["equal", 0, 19, 0, 19], ["insert", 19, 19, 19, 37], ["equal", 19, 31, 37, 49], ["replace", 31, 32, 49, 50], ["equal", 32, 157, 50, 175], ["replace", 157, 158, 175, 176], ["equal", 158, 171, 176, 189], ["replace", 171, 172, 189, 190], ["equal", 172, 257, 190, 275], ["insert", 257, 257, 275, 277], ["equal", 257, 272, 277, 292], ["replace", 272, 273, 292, 293], ["equal", 273, 281, 293, 301], ["replace", 281, 282, 301, 302], ["equal", 282, 312, 302, 332]], "add": 25, "del": 5}, {"what": ["Added the workspace section and cross-repo rules in place of the single-repo wording.", "Zero overlap is measured over the union of all repos' commits.", "The path completeness rule now says which edges count: normal edits and hard cross-repo links.", "CSV output has a repos column; the checklist checks it.", "Code lookups use git -C repo_data/<repo> instead of one repo path."], "why": "Single-repo runs are just a workspace with one repo, so one multi-repo prompt is enough.", "rewritten": true, "id": "seed-expansion-md", "path": "deepcommit/pipeline/prompts/stage_breakdown_v1/seed_expansion.md", "name": "seed_expansion.md", "group": "Phase 2: milestone stages", "note": "Stage 2 sub-agents. Rewritten multi-repo only: same rules as consolidation, git -C per repo, repos CSV column, cross-repo validity (at least 2 repos, no part alone a feature).", "status": "modified", "old": ["# Milestone Seed Expansion — Deep analysis for a batch of related seeds", "", "## [System] Role & Goal", "", "You are a milestone seed expansion agent. Your task is to analyze a **batch of related milestone seeds** (2-5 seeds per group) and construct detailed milestone proposals by expanding them into cohesive, non-overlapping sets of commits.", "", "**Your scope**: Work collaboratively on your assigned seed group. Seeds in your batch were clustered together because they share semantic themes, file overlap, and/or commit DAG relationships. Your goal is to partition commits intelligently across milestones to **minimize intra-batch overlap** and **maximize commit coverage**.", "", "**Your responsibility**: Conduct thorough, evidence-based analysis. Read patch files, query PRs and issues when needed, and make informed judgments about which commits belong in which milestone. **Critical constraint**: Ensure that commits do not appear in multiple milestone proposals within your batch (zero intra-batch overlap).", "", "**Your approach**: You will combine multiple signal types—textual dependencies from the commit DAG, file-based clustering, semantic theme analysis, and code-level validation—to construct cohesive milestones. Think of this as synthesis across structural data (DAG topology), semantic understanding (commit messages, PRs, issues), and code evidence (patches). Use your judgment to weigh these signals, reason about logical relationships between commits, and make explicit ownership decisions for commits that could belong to multiple seeds.", "", "---", "", "## Batch Coordination Strategy", "", "Your seed group contains related seeds that were clustered together because they:", "- **Share significant file overlap** (>40% common files modified)", "- **Address the same feature/module** (semantic theme similarity)", "- **Have textual dependencies** in the commit DAG (appear in each other's seed-rooted subgraphs)", "", "**Your batch expansion goals**:", "1. **Minimize intra-batch overlap**: Ensure milestone proposals don't claim the same commits (**ZERO overlap required**)", "2. **Maximize commit coverage**: Expand aggressively to cover as much related work as possible within the theme", "3. **Maintain semantic coherence**: Each proposal should still represent a cohesive, independently deployable milestone", "", "**Coordination approach**:", "- **Analyze ALL seeds in your batch together** before making expansion decisions", "- Identify the **union of candidate commits** across all seeds (using strategies A-D from Step 1)", "- **Partition candidates into distinct milestones** based on:", "  - **Primary seed affinity**: Which seed is the best \"anchor\" for each commit?", "  - **Semantic sub-themes**: Can the batch theme split into coherent sub-themes? (e.g., HTTP/2 → protocol implementation, refactoring, request body handling)", "  - **DAG structure**: Respect path completeness within each milestone", "  - **Code evidence**: Read patches to understand actual relationships", "- **Make explicit ownership decisions** for shared candidates: for each commit that appears in multiple seed subgraphs or has affinity to multiple seeds, decide **exactly one milestone** to assign it to", "- **Validate partition**: Before finalizing, verify that no commit appears in multiple proposals", "", "**Example**: If your batch contains three HTTP/2-related seeds:", "- Seed A: HTTP/2 protocol implementation (core connection/stream)", "- Seed B: HTTP/2 refactoring (cleanup/reorganization)", "- Seed C: HTTP/2 request body handling (specific feature)", "", "Then your proposals should partition commits such that:", "- Proposal A gets core protocol commits", "- Proposal B gets refactoring commits", "- Proposal C gets request body commits", "- **No commit appears in both A and B, or B and C, or A and C** (zero overlap)", "- If a commit could belong to multiple proposals, assign it based on strongest code evidence", "", "---", "", "## Critical Data Sources", "", "### 1. Your Seed Batch (Entry Points)", "", "**File**: `{{milestone_seeds}}`", "", "**Input**: `{{result_path}}/seed_groups.json` (contains your assigned group)", "", "You will be assigned a **seed group** (2-5 related seeds) from the grouping phase.", "", "**These are your starting points.** Your goal is to expand this batch of seeds into **distinct, non-overlapping milestone proposals** (one or more proposals per seed, depending on analysis).", "", "---", "", "### 2. Commit Info List", "", "**File**: `{{main_commits}}`", "", "Read this entire file into context before you start—it's your pool of candidate commits.", "", "Commit Info:", "- Basic metadata (sha, message, author, time, merged_via_pr)", "- **`files_changed`**: File modifications with paths and LoC changes", "- **`commit_dag_stat`**: Node properties in the commit DAG (layer, degrees, ancestor/descendant counts)", "", "**Usage**: This is your pool of candidate commits for expansion. Use `files_changed` to identify module/file overlap, and `commit_dag_stat` to understand dependency relationships.", "", "---", "", "### 3. Textual Commit Dependency DAG (Hard Constraint Source)", "", "**Full DAG**: `{{commit_dag}}`", "**Your Seed's Subgraph** (Must Read): `{{subgraphs}}/subgraph_{seed_sha}.json`", "", "**What it represents**: Textual commit dependency DAG where **`source → target`** means **target depends on source**.", "", "Dependencies are detected with a **3-line context tolerance**: if commit B modifies code within 3 lines of code changed by commit A, an edge A→B is created.", "", "**Subgraph contains**: metadata, nodes, layers, and `edges_dag` with:", "- `files_ref`: File paths that triggered this dependency", "- `edge_types`: Dependency types (can be multiple): `modify_overlap`, `extend`, `delete`, `rename_dependency`", "", "**DAG limitations**:", "- This DAG captures necessary but not sufficient relationships", "- Edges represent textual overlap, not semantic/logical dependencies", "- False positives: Unrelated changes to same file region may create spurious edges", "- False negatives: Semantic dependencies without textual overlap are missed", "- Always validate with semantic analysis and code analysis (e.g., PRs, issues, patches)", "", "**Path completeness constraint**:", "", "If commits A and B are both included in your milestone, then **all commits on any path between A and B in the commit DAG must also be included**.", "", "This is a **hard constraint**—violations invalidate the proposal.", "", "**Usage**:", "- Start by reading your seed's subgraph (`subgraph_{seed_sha}.json`) into context", "- Use it to identify potential candidates (descendants, ancestors)", "- Query the full DAG only if needed for broader analysis", "- Validate path completeness before finalizing: use `{{analyze_milestone_conflicts}}` with absolute path params", "", "---", "", "### 4. Semantic & Logical Dependency Signals (Query Strategically)", "", "Milestone construction requires understanding semantic and logical relationships beyond textual dependencies. Query resources strategically to build understanding while avoiding context explosion.", "", "**Available Resources**:", "- **PR Metadata**: `{{pull_requests}}` - PR titles, descriptions, labels", "- **Issue Context**: `{{issues}}` - Issue descriptions and discussion", "- **PR Conversations**: `{{pr_conversations}}` - Full discussion threads (can be large)", "- **Releases**: `{{releases}}` - Release milestone associations", "", "**Query Strategy**:", "Start with lightweight signals and drill down only when needed. Begin with commit metadata from `{{main_commits}}` (already in context). When you need deeper understanding, consult PR metadata first, then issues, and finally PR conversations if semantic relationships remain unclear. Query by specific IDs (pr_number, issue_number) rather than reading entire files.", "  ", "---", "", "### 5. Code-Level Analysis: Patches & Repository Access", "", "**Principle**: Semantic signals (PRs, issues) tell you *what* and *why*. Code analysis tells you *how* and validates actual relationships.", "", "#### 5.1 Patch Files (Code Changes - Must Read)", "", "**Directory**: `{{patches}}/{sha}.patch`", "", "**Format**: Output of `git show {sha}` containing full diff with context", "", "**When to Read**: For every candidate commit you consider including in your milestone.", "", "**What to Look For**:", "- Which functions/classes are modified", "- Scope and impact of changes", "- Whether the change truly aligns with your seed's theme", "- Code-level dependencies (function calls, imports, class inheritance)", "", "**Limitation**: Patches show only what changed, not the full context of the file.", "", "#### 5.2 Original Repository Access (Full Context — Use When Needed)", "", "**Repository Path**: `{{repo_path}}`", "", "**When to Use**:", "- When patch alone is insufficient (need to understand full file structure)", "- To check architecture/design at the time of a commit", "- To verify cross-file relationships not visible in patch", "", "**Recommend Commands** (read-only, concurrency-safe):", "```bash", "# View entire file at specific commit", "git -C {{repo_path}} show <sha>:<filepath>", "", "# Search for function/class definition at specific commit", "git -C {{repo_path}} grep -n \"def function_name\" <sha>", "", "# Show file history", "git -C {{repo_path}} log --oneline -- <filepath>", "", "# Compare file between commits", "git -C {{repo_path}} diff <sha1> <sha2> -- <filepath>", "```", "", "**Restrictions**:", "- Only use read-only commands (show, log, grep, diff, ls-tree)", "- All commands must be concurrency-safe", "---", "", "## Analysis Process", "", "### Step 1: Build Unified Candidate Commit Set for Batch", "", "**Goal**: Construct a comprehensive candidate set for the **ENTIRE seed batch**, then partition it into distinct milestones.", "", "Use four complementary strategies to build candidate sets, but **apply them across all seeds in your batch** to identify the full scope of related work.", "", "**Process**:", "1. **For each seed in your batch**, apply all four strategies (A-D) to build per-seed candidate sets", "2. **Compute the union** of all candidate sets → this is your batch's candidate pool", "3. **Identify overlapping candidates** (commits that appear in multiple per-seed sets)", "4. **Prepare for partitioning** in Step 2 (don't assign ownership yet)", "", "**Recommended Approach**:", "Start with Strategy A (DAG neighbors) for each seed as your foundation, since these commits have direct textual dependencies. Then expand using Strategies B and C to catch semantically related commits that may not have textual overlap. Use Strategy D as a supporting filter when other strategies yield ambiguous results.", "", "#### Strategy A: Textual Dependency Exploration (Primary Filter)", "", "Traverse your seed's subgraph to find commits with DAG paths to/from your seed (descendants and ancestors). These commits have verified textual dependencies. Filter ancestors carefully to ensure they share the same theme.", "", "#### Strategy B: File-Based Clustering (Scope Expansion)", "", "Search `{{main_commits}}` for commits modifying the same files or modules as your seed. Use `files_changed` to identify file overlap and module families. This catches commits that work on the same code areas but may not have direct textual overlap.", "", "#### Strategy C: Semantic Theme Matching (Problem Alignment)", "", "Scan `{{main_commits}}` for commits whose messages suggest they address similar problems or features as your seed. Look for shared concepts, problem domains, or functional areas. This catches logically related work that touches different files.", "", "#### Strategy D: Authorship & Temporal Patterns (Supporting Signal)", "", "Find commits from the same author in nearby timeframes that modify related modules. This is a weaker signal—use it to validate candidates found through other strategies, not as a primary filter.", "", "### Step 2: Validate Candidates and Partition into Milestones", "", "**Goal**: Validate each candidate from Step 1 and partition the validated set into distinct, non-overlapping milestones.", "", "**Part A: Validate Candidates with Code Analysis**", "", "For each candidate in the unified set, validate the relationship by examining actual code changes.", "", "**Validation Principles**:", "", "Start by reading the patch file to understand what code actually changed. Look at which functions and classes are modified, and whether the scope aligns with any of your seeds' scopes. Check for code-level dependencies like function calls, imports, or inheritance relationships.", "", "For semantic validation, understand what problem the commit solves—not just keyword matching, but the logical flow. Use the query strategy from Section 4 when commit metadata alone is insufficient. Does this commit solve part of the same problem as the seed? Do the commits form a coherent solution to a unified problem?", "", "**Resolving Conflicting Signals**:", "", "When signals conflict, use this hierarchy to make decisions:", "", "1. **Code evidence trumps metadata**: If patch analysis contradicts DAG edges or semantic signals, trust the code. The DAG has false positives, and commit messages can be misleading.", "", "2. **DAG edge + weak semantic signal**: If there's a DAG dependency but the semantic theme seems unrelated, read the patch carefully. The edge might be incidental (e.g., touching nearby lines in the same file for unrelated reasons). Exclude if code confirms they're truly unrelated.", "", "3. **Strong semantic signal + no DAG edge**: This could be a false negative or coincidental similarity. Check commit timestamps for temporal proximity, but rely primarily on code evidence. Include only if patches confirm they implement complementary parts of the same logical solution.", "", "4. **Mixed file overlap signals**: If a commit touches both related and unrelated files, evaluate the relative LoC and importance. Include if the majority of meaningful changes align with your seed's theme.", "", "When truly uncertain after examining all evidence, err on the side of exclusion. It's better to have a tight, coherent milestone than one diluted with questionable commits.", "", "**Decision Framework**:", "- **Include in some milestone**: Code changes clearly support the same feature/fix as one or more seeds", "- **Exclude from batch**: Changes are incidental, unrelated, or belong to a different theme entirely", "- **Assign to specific milestone**: Determine which seed/milestone has the strongest affinity (do this in Part B)", "", "Track your decisions for each candidate: record whether you included or excluded it; cite specific evidence (patch files, PR/issue numbers, DAG edges); and provide a brief rationale explaining why it belongs or doesn't belong to the batch.", "", "---", "", "**Part B: Partition Validated Commits into Milestones**", "", "Now that you have a validated candidate set, partition it into distinct milestones with **zero overlap**.", "", "**Partitioning Principles**:", "", "1. **Identify semantic sub-themes**: Can your batch's overall theme split into coherent sub-themes?", "   - Example: HTTP/2 batch → protocol implementation, refactoring, request body handling", "   - Each sub-theme becomes a milestone", "", "2. **Assign primary seed affinity**: For each validated commit, determine which seed is the best \"anchor\":", "   - Strongest textual DAG relationship (most edges to/from seed)", "   - Best semantic alignment (commit message matches seed's theme)", "   - Most file overlap (commit touches files central to seed's module)", "", "3. **Resolve ownership conflicts**: For commits with affinity to multiple seeds:", "   purpose", "   - Check DAG path completeness: which milestone assignment preserves path completeness?", "   - Prioritize semantic coherence: which milestone tells a more cohesive story with this commit?", "   - **Make explicit decision**: Assign to exactly ONE milestone", "", "4. **Group commits into milestone proposals**: Cluster commits by primary see
