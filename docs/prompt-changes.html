 ⭐⭐⭐ **Size signal**: Significantly exceeds mean (not barely over threshold)", "- ⭐⭐ **Functional complexity**: Multiple independent feature themes", "- ⭐ **CV impact**: Splitting would meaningfully reduce variance", "", "**Selection process**:", "- Analyze each candidate milestone", "- Prioritize clear functional boundaries", "- Select top candidates (typically 3-5, not all candidates)", "", "**Step 1.5: Deep Dependency Analysis (Required for Complex Milestones)**", "", "**Trigger condition** - Launch subagent analysis for ANY milestone with:", "- \\> 50 commits, OR", "- \\> 5x mean src_loc, OR", "- \\> 30% of total repository src_loc", "", "**MANDATORY**: Do NOT skip this step for complex milestones. The subagent provides critical dependency analysis that determines splitting feasibility.", "", "**Subagent prompt**: `{{deep_analysis_subagent_prompt}}`", "", "**Subagent parameters**:", "- `milestone_id`: Target milestone ID", "- `commits`: Semicolon-separated commit list", "- `src_loc`: Milestone's total src_loc", "- `mean_src_loc`: Global mean from statistics", "- `commit_dag_path`: `{{commit_dag}}`", "- `milestone_csv`: `{{milestone_csv}}`", "- `dependencies_csv`: `{{dependencies_csv}}`", "- `get_commit_context`: `{{get_commit_context}}`", "- `analyze_dag_conflicts`: `{{analyze_dag_conflicts}}`", "", "**Subagent output**: JSON with recommendation:", "- `SPLIT_RECOMMENDED`: Proceed with suggested grouping strategy", "- `PARTIAL_SPLIT`: Extract what's possible, keep coupled core together", "- `SPLIT_NOT_RECOMMENDED`: With specific blocking analysis (not just \"cycles exist\")", "", "**Key principle**: Do NOT conclude \"cannot split\" without:", "1. Identifying SPECIFIC commits causing cycles", "2. Evaluating if moving 1-3 boundary commits would break cycles", "3. Considering PARTIAL splits (extract what you can)", "", "**Use subagent result** to inform Step 2 decisions:", "- If `SPLIT_RECOMMENDED`: Use suggested grouping for commit splitting", "- If `PARTIAL_SPLIT`: Only process extractable commits in Stage 2", "- If `SPLIT_NOT_RECOMMENDED`: Check FORCE_SPLIT thresholds below", "", "**⚠️ FORCE_SPLIT (Mandatory for Extreme Milestones)**:", "", "If milestone exceeds ANY threshold: **>80 commits OR >10,000 src_loc OR >40% total src_loc** → splitting is MANDATORY regardless of subagent recommendation.", "", "**Fallback strategies** when functional splitting fails (try in order):", "1. **Topological/Dependency-based**: Group commits by code dependency relationships (imports, function calls, shared data structures). This preserves semantic coherence - related commits stay together.", "2. **Directory clustering**: Group by primary module/directory touched", "3. **Hybrid topological + size**: Topological grouping with size-balancing adjustments", "4. **Chronological** (LAST RESORT): Split into ~25-commit chunks by timestamp. ⚠️ WARNING: This often fragments semantically related commits across time slices, producing sub-milestones with generic descriptions like \"maint, fix, enh changes\" instead of clear functional themes. Only use when other strategies fail.", "", "Cycles from FORCE_SPLIT must be resolved by adjusting chunk boundaries.", "", "**Step 2: LLM identify large commits within selected milestones**", "", "For each selected milestone, analyze commits using:", "- Script's commit_src_locs data", "- Commit details from `{{get_commit_context}}` (message, diff, files)", "", "**Split criteria**:", "- ⭐⭐⭐ **Functional independence**: Multiple independent features/modules", "- ⭐⭐ **Size anomaly**: Significantly larger than milestone's other commits", "- ⭐⭐ **Split feasibility**: Clear boundaries (module/feature/file groups)", "- ⭐ **Squash merge signal**: Originally comessed from multiple commits", "", "**Do NOT split**:", "- Small single-function commits", "- Tightly coupled refactoring", "- Atomic bug fixes", "- Binary/auto-generated files", "", "**Determine `num_commits`**:", "- Based on src_loc and functional complexity", "- Typical: 3-5 feature commits + optional 1 test commit", "- Aim for balanced splits", "", "**Final output**: `large_commits_to_split` list:", "```", "{", "  \"milestone_id\": \"M2\",", "  \"commit_sha\": \"1812eac\",", "  \"src_loc\": 1601,", "  \"num_commits\": 4,", "  \"split_reason\": \"Squash merge with multiple independent modules\",", "  \"functional_themes\": [\"infrastructure\", \"connection\", \"fetch\"]", "}", "```", "", "---", "", "## Stage 2: Parallel Commit Splitting", "", "**Objective**: Split identified large commits into smaller logical commits using Subagents", "", "### 2.1 Invoke Subagents in Parallel", "", "**Subagent prompt**: `{{subagent_prompt_file}}`", "", "**Batch processing** (max 5 subagents concurrently):", "", "Process `large_commits_to_split` in batches of up to 5 commits:", "- For each batch, launch subagents in parallel", "- Each subagent receives a single commit to split", "", "**Subagent parameters** (dynamic, to be filled by Main Agent):", "- `target_commit`: Commit SHA to split", "- `num_commits`: Target number of feature commits (from Stage 1.2)", "- `working_branch`: \"split-{commit_sha[:7]}\"", "", "**Note**: The following are pre-injected into subagent prompt (no need to pass):", "- `repo_path`, `repo_src_dirs`, `exclude_patterns`, `base_image_name`, `build_command`", "", "**Note**: Output path and metadata script are hardcoded in the subagent prompt:", "- Output: `WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{working_branch}/`", "- Script: `WORKSPACE_ROOT/deepcommit/tools/milestone_balancing/generate_split_metadata.py`", "", "**Execution requirements**:", "- Wait for all subagents in a batch to complete before processing next batch", "- Validate subagent output integrity (METADATA.json exists and valid)", "- If a subagent fails, mark the commit as \"split failed, keep original\"", "", "### 2.2 Collect and Parse Subagent Output", "", "**For each successfully split commit**, collect:", "", "**Output directory structure**:", "```", "{output_base_path}/split-{commit_sha}/", "├── METADATA.json", "└── patches/", "    ├── {split_sha_1}.patch", "    ├── {split_sha_2}.patch", "    └── ...", "```", "", "**Parse METADATA.json** to extract:", "", "⚠️ **IMPORTANT**: METADATA.json MUST use `split_result.src_commits` format, NOT top-level `commits` or `split_commits`.", "", "```json", "{", "  \"original_commit\": {", "    \"sha\": \"1812eac36019be19cb02f181aa21d133ba9fe219\",", "    \"short_sha\": \"1812eac\",", "    \"message\": \"Original commit message\"", "  },", "  \"split_result\": {", "    \"src_commits\": [", "      {", "        \"sha\": \"abc123d...\",", "        \"short_sha\": \"abc123d\",", "        \"message\": \"feat: ...\",", "        \"src_stats\": {\"total_loc\": 401},", "        \"patch_file\": \"patches/abc123d.patch\",", "        \"files\": [\"src/module/file1.py\"]", "      },", "      {", "        \"sha\": \"def456e...\",", "        \"short_sha\": \"def456e\",", "        \"message\": \"feat: ...\",", "        \"src_stats\": {\"total_loc\": 389},", "        \"patch_file\": \"patches/def456e.patch\",", "        \"files\": [\"src/module/file2.py\"]", "      }", "    ],", "    \"integration_test_commit\": {", "      \"short_sha\": \"test123\",", "      \"message\": \"test: ...\",", "      \"src_stats\": {\"total_loc\": 0},", "      \"patch_file\": \"patches/test123.patch\"", "    },", "    \"dependency_edges\": []", "  }", "}", "```", "", "**Field explanations**:", "- Use `sha` for full hash, `short_sha` for 7-char hash (consistent naming)", "- `src_commits` MUST be inside `split_result`, never at top level", "- `src_loc` is `src_stats.total_loc` (additions + deletions in `REPO_SRC_DIRS` only)", "- `integration_test_commit`: May be null; at most ONE per original commit", "- `dependency_edges`: Array of `[source, target]` pairs where target depends on source. May be empty if commits are independent.", "", "**Build split commits mapping**:", "```", "split_commits_map = {", "  \"1812eac\": {", "    \"src_commits\": [\"abc123d\", \"def456e\"],", "    \"integration_test_commit\": \"test123\",  // or null", "    \"dependencies\": [...]  // from dependency_edges, may be empty", "  },", "  ...", "}", "```", "", "**Verification**:", "- Confirm all splits' total src_loc ≈ original commit's src_loc", "- Validate patch files exist for all split commits", "- If dependency_edges is non-empty, ensure edges form a valid DAG (no cycles within split commits)", "", "**Output**: Complete `split_commits_map` for all successfully split commits", "", "---", "", "## Stage 3: Global Reorganization and Balancing", "", "**Objective**: Split oversized milestones, merge undersized milestones, and achieve CV < 1.0", "", "### 3.1 Split Oversized Milestones", "", "**⚠️ MANDATORY SPLIT PRINCIPLE**: Every oversized milestone MUST be split into at least 2 sub-milestones (if find necessary). Do NOT give up easily.", "", "**Iterative Approach**: If one grouping strategy causes cycles, try alternative approaches:", "- If cycles detected, reorder commits between groups to break cycles rather than abandoning the split", "- Continue iterating until a valid split is found", "", "**Process each oversized milestone sequentially**:", "", "#### Step 1: Prepare Updated Commit List", "", "For milestone M1 with commits [A (split), B (kept), C (split)]:", "- Replace split commits with their split results from `split_commits_map`", "- Keep unsplit commits as-is", "- Result: new_commits = [A.1, A.2, A.3, B, C.1, C.2]", "", "#### Step 2: Group Commits by Functional Coherence", "", "**⚠️ BALANCE CV AND SEMANTIC COHERENCE**: Both metrics matter equally. Each sub-milestone should represent a clear functional theme (e.g., \"Tags System Revamp\", \"Testing Framework Modernization\") rather than a generic time-based slice (e.g., \"maint, fix, enh changes May-Jun\"). Aim for CV < 1.0 while maintaining meaningful functional groupings—avoid sacrificing one for the other.", "", "Group commits based on (priority order):", "1. **Functional relevance**: Related features belong together (highest priority)", "2. **Code dependencies**: Commits with import/call relationships stay together", "3. **Module structure**: Group commits touching same modules/files", "4. **Size balance**: Aim for balanced groups (lowest priority - don't sacrifice coherence for balance)", "", "**Example**:", "```", "M1 commits: [A.1, A.2, A.3, B, C.1, C.2]", "Dependencies (from METADATA.json): A.1 → A.3, C.1 → C.2  // may be partial or empty", "", "Groups:", "- Group 1: [A.1, A.2] - \"Infrastructure foundation\"", "- Group 2: [A.3, C.1] - \"Connection layer\"", "- Group 3: [B, C.2] - \"Fetch layer and utilities\"", "```", "", "#### Step 3: Generate Sub-Milestones and Update milestones.csv", "", "**For each group**, create a sub-milestone:", "- **ID**: `{parent_id}_sub-{seq:02d}` (e.g., M1_sub-01, M1_sub-02, M1_sub-03). **No nested splits allowed** - sub-milestones cannot be split further.", "- **Fields**: Generate `title`, `mini_srs`; preserve other columns", "", "**⚠️ CRITICAL: integration_test_commit Column Handling**:", "", "When a commit was split and METADATA.json contains `integration_test_commit`:", "", "1. **Read** the `integration_test_commit.short_sha` from METADATA.json (e.g., `4b2505f`)", "2. **Write** this SHA to the `integration_test_commit` column of the **FIRST sub-milestone ONLY** (e.g., M1_sub-01)", "3. **Do NOT** include this SHA in the `commits` column of any milestone", "4. **Leave empty** the `integration_test_commit` column for all other sub-milestones (M1_sub-02, M1_sub-03, ...)", "", "**Example**:", "```", "METADATA.json: {\"split_result\": {\"integration_test_commit\": {\"short_sha\": \"4b2505f\"}}}", "", "milestones.csv:", "| id    | commits           | integration_test_commit |", "|-------|-------------------|-------------------------|", "| M1_sub-01 | 5d488;0e2dc   | 4b2505f                 |  ← FIRST sub-milestone gets the SHA", "| M1_sub-02 | 24901;6f503   |                         |  ← Empty", "| M1_sub-03 | a5eb7         |                         |  ← Empty", "```", "", "**Common mistakes to avoid**:", "- ❌ Putting integration_test_commit SHA in `commits` column", "- ❌ Assigning integration_test_commit to multiple sub-milestones", "- ❌ Forgetting to populate the `integration_test_commit` column entirely", "", "**Write to milestones.csv**: Insert sub-milestones, delete parent M1", "", "**Validate and iterate**:", "```", "{{validate_milestone_partitioning}}({{milestone_csv}}, split_metadata_dir={{commit_splits}})", "```", "", "Key outputs: `inferred_dependencies`, `cycles`, `cycle_edge_details`", "", "**If cycles detected**:", "- Use `cycle_edge_details` to identify which commits cause the cycle", "- Reorder commits: move boundary commits between groups to break cycles", "- Try different grouping strategies if reordering doesn't work", "- Re-validate after each adjustment", "", "**Output**: Valid sub-milestones + `inferred_dependencies` for Step 4", "", "#### Step 4: Update Dependencies", "", "**Internal dependencies**: Add edges from `inferred_dependencies` between sub-milestones (default strength: Strong)", "", "**External dependencies**: Map original edges involving M1 to sub-milestones:", "- Incoming (X → M1): Map to M1_sub-01 (first)", "- Outgoing (M1 → Y): Map to M1_sub-{n} (last)", "", "**Write to dependencies.csv**:", "- PRESERVE edges not involving M1", "- REMOVE edges with M1", "- ADD internal + mapped external edges", "", "**Validate and iterate**:", "```", "{{analyze_dag_conflicts}}({{milestone_csv}}, {{dependencies_csv}}, split_metadata_dir={{commit_splits}})", "```", "", "**If cycles detected**:", "- For `existing_cycles`: remove or weaken the problematic edges", "- For `enriched_cycles`: adjust commit assignments between sub-milestones", "- Continue iterating until cycles are resolved", "", "**If current grouping strategy fails to produce a valid DAG**: Do NOT give up. Switch to a different grouping strategy (topological/dependency-based, directory-based, or size-based) and retry. Chronological splitting should only be used as a last resort due to poor semantic coherence. Only after exhausting all reasonable strategies should you consider keeping parent unsplit, and this must be documented with detailed justification.", "", "### **3.2 Merge Undersized Milestones**", "", "**After completing all splits**, identify and merge small milestones.", "", "#### Step 1: Identify Undersized Milestones", "", "Run `{{identify_imbalances}}` with `--small --k-value 0.5` to get candidates (src_loc < mean - 0.5*std)", "", "#### Step 2: Evaluate and Execute Merge", "", "**For each undersized milestone U**, find merge candidates from neighboring milestones (predecessors/successors in dependency graph).", "", "**Merge criteria**:", "- Functional relevance: Similar category or related functionality", "- Size compatibility: merged_src_loc < mean + std", "- No cycles introduced", "", "**If merging U into N**:", "- Combine commits (maintain temporal order)", "- Update `title`, `mini_srs` to reflect merged content", "- Merge other fields as appropriate (union for lists, min/max for timestamps)", "", "**If no good candidate found**: Keep U as-is", "", "#### Step 3: Update CSV Files", "", "**milestones.csv**: Modify N's row with merged data, delete U's row", "", "**dependencies.csv**:", "- Remove edges between N and U", "- Redirect edges referencing U to N", "- Deduplicate (prefer Strong over Weak)", "", "Validate with `{{analyze_dag_conflicts}}` to ensure no cycles.", "", "### 3.3 Validate CV and Decide Iteration", "", "**After completing all splits and merges**:", "", "#### Step 1: Final DAG Validation", "", "Run both validations and ensure they pass before proceeding:", "", "```", "{{validate_milestone_partitioning}}({{milestone_csv}}, split_metadata_dir={{commit_splits}})", "{{analyze_dag_conflicts}}({{milestone_csv}}, {{dependencies_csv}}, split_metadata_dir={{commit_splits}})", "```", "", "- Required: `cycles_count = 0`, `existing_cycles = []`, `enriched_cycles = []`", "- If fails: Fix issues before continuing; do not proceed with invalid DAG", "", "#### Step 2: Recalculate Global CV", "", "- Read updated milestones.csv", "- Calculate new CV = std(src_loc) / mean(src_loc)", "", "#### Step 3: Check Termination Conditions", "", "**Evaluate in order**:", "", "1. **Target achieved**: CV < 1.0 → Output \"SUCCESS\", exit", "", "2. **Maximum iterations reached**: iteration_count >= MAX_ITERATIONS → Output \"WARNING\", exit", "", "3. **No improvement**: new_cv >= old_cv → Output \"WARNING\", exit", "", "4. **Continue iterating**: CV improved but not < 1.0 → Return to Stage 1", "", "#### Step 4: Iteration State Management", "", "**Track across iterations**:", "- Iteration count", "- CV history: [initial_cv, cv_after_iter1, cv_after_iter2, ...]", "- Milestones split/merged per iteration", "- Best CV achieved (for potential rollback): If an iteration regresses CV or creates invalid output, rollback to the best-known state before exiting", "", "---", "", "## Output Format", "", "### Updated CSV Files", "", "**milestones.csv**: Update in-place (add sub-milestones, remove split parents, modify merged rows)", "", "**dependencies.csv**: Update in-place", "", "### Optimization Report", "", "**File**: `{{balancing_report}}`", "", "**Structure**:", "```json", "{", "  \"task\": \"milestone_dag_balancing\",", "  \"status\": \"SUCCESS\" | \"WARNING\",", "  \"initial_cv\": 1.45,", "  \"final_cv\": 0.87,", "  \"target_cv\": 1.0,", "  \"total_iterations\": 3,", "  \"iteration_history\": [", "    {", "      \"iteration\": 1,", "      \"cv_before\": 1.45,", "      \"cv_after\": 1.12,", "      \"milestones_split\": [\"M2\", \"M5\"],", "      \"milestones_merged\": [],", "      \"commits_split\": [\"1812eac\", \"abc123d\"]", "    },", "    ...", "  ],", "  \"final_statistics\": {", "    \"total_milestones\": 45,", "    \"mean_src_loc\": 423.5,", "    \"std_src_loc\": 368.2,", "    \"cv\": 0.87", "  },", "  \"warnings\": [],", "  \"notes\": \"Successfully balanced milestone DAG in 3 iterations\"", "}", "```", "", "---", "", "## Important Notes", "", "- **PRIORITIZE SPLITTING over MERGING**: The primary goal is to split oversized milestones into smaller sub-milestones. Merging undersized milestones is OPTIONAL and secondary. Focus your effort on splitting large milestones first.", "- **PERSIST UNTIL SUCCESS**: If a split attempt fails (due to cycles or other issues), do NOT give up. Try different grouping strategies (functional → topological/dependency-based → directory-based → size-based → chronological as last resort), reorder commits between groups, or adjust boundaries. Keep iterating until you find a valid split. Only mark as failed after exhausting ALL reasonable approaches.", "- **DAG Integrity**: Validate acyclic after each modification; abort operation if cycle detected", "- **Balance Both Goals**: Achieve CV < 1.0 while maintaining semantic coherence—both are important targets, not just one or the other", "- **Test Commits**: At most ONE `integration_test_commit` per milestone. When splitting: (1) write SHA to `integration_test_commit` column of FIRST sub-milestone only, (2) do NOT put this SHA in any `commits` column, (3) leave other sub-milestones' `integration_test_commit` empty", "- **External Dependency Mapping**: Do NOT blindly inherit to all entry/exit; analyze patches to find true relationships (typically 1-2 sub-milestones per edge)", "- **FORCE_SPLIT is MANDATORY**: Milestones exceeding force thresholds (>80 commits, >10K src_loc, >40% total) MUST be decomposed using fallback strategies if needed.", "- **Dependency Preservation**: When updating dependencies.csv, only modify edges directly involving the milestone(s) being split or merged. All other existing dependency edges MUST be preserved exactly as-is. This is an incremental update, NOT a reconstruction—the output should contain all original edges minus those explicitly replaced/removed, plus any new edges added."], "new": ["# Milestone DAG Balancing", "", "## Task Overview", "", "Your task is to optimize the global milestone DAG by balancing milestone sizes through an iterative three-stage process. The goal is to achieve a coefficient of variation (CV) of src_loc across all milestones below 1.0.", "", "**Core Strategy: Three-Stage Iterative Optimization**", "", "- **Stage 1**: Global analysis and targeting (Main Agent)", "- **Stage 2**: Parallel commit splitting (Subagents)", "- **Stage 3**: Global reorganization and balancing (Main Agent)", "", "**Target**: Reduce milestone `src_loc` CV; report **SUCCESS** if CV < 1.0, otherwise **WARNING** (but do not regress CV vs the input).", "", "**Key Principles**:", "- Global optimization over local perfection", "- Iterative refinement with CV-guided convergence", "- Intelligent LLM-based decisions (treat script thresholds as signals, not rules)", "- Parallel processing where possible (Stage 2)", "- Skip documentary milestones that do not contain any source code changes.", "", "### Workspace `{{workspace_id}}`", "", "This run covers a workspace of one or more repositories that are developed together:", "", "{{workspace_repos_table}}", "", "- Inspect code with `git -C repo_data/<repo> ...` (the `repo dir` column of the table; for a one-repo workspace that is `repo_data` itself). The MCP git tools route to the correct repository automatically.", "- Commit ids are bare 7-character SHAs, unique inside the workspace. A commit's repository is its `repo` field in the commit records or its entry in `commit_repos` (`commit_repos.json`). Never guess it from the SHA and never run `git` against the wrong repository.", "- With more than one repository, every file path in merged data is prefixed `<repo>/<path-in-repo>`; strip the prefix before passing a path to `git -C repo_data/<repo>`.", "- Edges in `commit_dag.json` come in two groups. `edges_dag` holds per-repository textual edges plus HARD cross-repo edges (`\"xrepo\": true`, `edge_types` such as `xrepo_contract`, `xrepo_pin`, `xrepo_pr_link`). `edges_soft` holds heuristic hints (for example time proximity): never enforced, and you may cut them.", "", "**Workspace rules**:", "1. **src_loc per repository**: compute `src_loc` per repository with that repository's own source prefixes (the `src dirs` column above) and sum the per-repo values for the milestone `src_loc`. The CV is computed on the sum. The \"do not regress CV vs the input\" guard applies.", "2. **Thresholds are per workspace**: the commit-count and src_loc thresholds below (50 commits / 5x mean / 30% of total; FORCE_SPLIT at 80 commits / 10,000 src_loc / 40% of total) are measured against the workspace totals, as signals rather than exact rules.", "3. **Never split a contract change from its first consumer.** Chunk boundaries must keep HARD cross-repo edges (`\"xrepo\": true`) inside one sub-milestone.", "4. **Cross-repo validity**: a milestone that lists 2 or more repositories in `repos` must still change at least 2 repositories after splitting, and no single repository's part may be a complete feature on its own. If a split would violate this, merge or re-cut instead.", "5. **integration_test_commit**: one per repository (a SHA belongs to its own repository); never more than one per repository per milestone.", "6. **`repos` column**: preserve it, and recompute it (semicolon-separated repository names) for every sub-milestone you create.", "---", "", "## Input Data", "", "### 1. Milestones Collection", "", "**File path**: `{{milestone_csv}}`", "", "**CSV format**: Preserve the existing header and any extra columns. At minimum, ensure these columns exist and are populated:", "- `id`, `title`, `category`, `commits`, `mini_srs`, `confidence_score`", "- `src_loc` (computed and added by this stage via the analysis script; used for balancing)", "", "**Key fields**:", "- **id**: Milestone identifier (parent like `M003`, sub-milestone like `M003_sub-01`)", "- **commits**: Semicolon-separated commit SHAs (short or full; keep the input style consistent)", "- **mini_srs**: Short functional description (keep the input style consistent)", "- **src_loc** (used for balancing): Total additions + deletions for files under each repository's source dirs (`REPO_SRC_DIRS`) only, summed over repositories (respecting `exclude_patterns`)", "- **repos**: Semicolon-separated repository names of the milestone's commits", "- **integration_test_commit** (optional, if present): Empty or one SHA per repository (semicolon-separated); never more than one per repository per milestone", "", "### 2. Dependencies", "", "**File path**: `{{dependencies_csv}}`", "", "**CSV format**:", "```csv", "prerequisite_id,dependant_id,type,strength,rationale,confidence_score", "M2,M1,FUNC,Strong,\"M1 depends on M2's infrastructure\",0.9", "```", "", "**Semantics**: ", "- Direction: Edge `[prerequisite_id, dependant_id]` means `dependant_id` **depends on** `prerequisite_id`", "- Execution order: source should complete before target starts (Weak = recommended, Strong = required)", "", "**Dependency fields**:", "- **type** (MUST be one of):", "  - `FUNC`: Functional dependency - code/API dependency between milestones", "  - `NFR`: Non-functional requirement - performance, security, reliability dependency", "  - `TEXT`: Textual/documentation dependency", "- **strength** (MUST be exactly `Strong` or `Weak` - NO other values allowed):", "  - `Weak`: Downstream milestone can still build/test without upstream, but with degraded accuracy/robustness/experience or higher failure rate", "  - `Strong`: Upstream absence blocks build/test/pass entirely", "", "**⚠️ IMPORTANT**: The `strength` field accepts ONLY two values: `Strong` or `Weak`.", "", "### 3. Original Repositories", "", "**Repository root**: `{{repo_path}}` (each repository is checked out at `repo_data/<repo>`, see the table above)", "", "The original Git repositories containing all commits and source code for analysis and commit splitting operations.", "", "### 4. Main Branch Commits Metadata", "", "**File path**: `{{main_commits}}`", "", "JSONL file containing metadata for all commits on the main branch, including:", "- Commit SHA, message, author, timestamp", "- File changes and statistics", "- Source code modifications", "", "Used for commit analysis and understanding development history.", "", "### 5. Available Tools", "", "**Statistical analysis script**:", "```bash", "python {{identify_imbalances}} \\", "  --repo-path {{repo_path}} \\", "  --milestone-dir {{result_path}} \\", "  --repo-src-dirs {{repo_src_dirs}} \\", "  --exclude-patterns \"{{exclude_patterns}}\" \\", "  [--small]  # For undersized milestones", "  [--k-value K]  # Std deviation multiplier", "  [--output-json PATH]  # Optional JSON output for machine parsing", "```", "", "**Output**:", "- Updates `src_loc` in the active `milestones.csv` (in-place)", "- Prints global stats and candidates to stdout", "- If `--output-json` is provided, writes `{\"statistics\": ..., \"extreme_milestones\": [...]}` for machine parsing", "", "**MCP tools**:", "- `{{get_commit_context}}(sha, expand=['files', 'stats', 'diff'])` - Get commit details", "- `{{calculate_commits_src_loc_tool}}(commits)` - Calculate src_loc for commits (additions + deletions in REPO_SRC_DIRS path only)", "- `{{validate_milestone_partitioning}}(milestone_csv, split_metadata_dir=None)` - Check milestone-level cycles; pass `split_metadata_dir` to include split commit dependencies", "- `{{analyze_dag_conflicts}}(milestone_csv_path, dependencies_csv_path, split_metadata_dir=None)` - Check DAG validity; pass `split_metadata_dir` to include split commit dependencies", "", "**Configuration**:", "- `REPO_SRC_DIRS`: Source directory prefixes (e.g., \"src/\"; repo-prefixed when the workspace has several repositories) for src_loc calculation", "- `MAX_ITERATIONS`: Maximum iteration cycles (default: 5)", "", "---", "", "## Stage 1: Global Analysis and Targeting", "", "**Objective**: Identify which milestones and commits need splitting to improve global CV", "", "### 1.1 Identify Oversized Milestones and Large Commits", "", "**Call the statistical analysis script** `{{identify_imbalances}}` to obtain candidate oversized milestones and commits:", "", "**Script output** (from stdout or `--output-json`):", "- **Global statistics**: mean/std and milestone-level CV (`statistics.cv_milestones`)", "- **Candidate milestones**: `extreme_milestones` (oversized if `--small` not set; undersized if `--small` set)", "- **Commit-level details**: For each milestone, `commit_src_locs` mapping commit SHA → `src_loc`", "", "**Check termination**:", "- If CV < 1.0: Output \"Already balanced\" and exit", "- If CV >= 1.0: Continue to intelligent filtering", "", "**Step 1: LLM filter oversized milestones**", "", "Review script output and select milestones to split:", "", "**Selection criteria**:", "- ⭐⭐⭐ **Size signal**: Significantly exceeds mean (not barely over threshold)", "- ⭐⭐ **Functional complexity**: Multiple independent feature themes", "- ⭐ **CV impact**: Splitting would meaningfully reduce variance", "", "**Selection process**:", "- Analyze each candidate milestone", "- Prioritize clear functional boundaries", "- Select top candidates (typically 3-5, not all candidates)", "", "**Step 1.5: Deep Dependency Analysis (Required for Complex Milestones)**", "", "**Trigger condition** - Launch subagent analysis for ANY milestone with:", "- \\> 50 commits, OR", "- \\> 5x mean src_loc, OR", "- \\> 30% of total workspace src_loc", "", "**MANDATORY**: Do NOT skip this step for complex milestones. The subagent provides critical dependency analysis that determines splitting feasibility.", "", "**Subagent prompt**: `{{deep_analysis_subagent_prompt}}`", "", "**Subagent parameters**:", "- `milestone_id`: Target milestone ID", "- `commits`: Semicolon-separated commit list", "- `src_loc`: Milestone's total src_loc", "- `mean_src_loc`: Global mean from statistics", "- `commit_dag_path`: `{{commit_dag}}`", "- `milestone_csv`: `{{milestone_csv}}`", "- `dependencies_csv`: `{{dependencies_csv}}`", "- `get_commit_context`: `{{get_commit_context}}`", "- `analyze_dag_conflicts`: `{{analyze_dag_conflicts}}`", "", "**Subagent output**: JSON with recommendation:", "- `SPLIT_RECOMMENDED`: Proceed with suggested grouping strategy", "- `PARTIAL_SPLIT`: Extract what's possible, keep coupled core together", "- `SPLIT_NOT_RECOMMENDED`: With specific blocking analysis (not just \"cycles exist\")", "", "**Key principle**: Do NOT conclude \"cannot split\" without:", "1. Identifying SPECIFIC commits causing cycles", "2. Evaluating if moving 1-3 boundary commits would break cycles", "3. Considering PARTIAL splits (extract what you can)", "", "**Use subagent result** to inform Step 2 decisions:", "- If `SPLIT_RECOMMENDED`: Use suggested grouping for commit splitting", "- If `PARTIAL_SPLIT`: Only process extractable commits in Stage 2", "- If `SPLIT_NOT_RECOMMENDED`: Check FORCE_SPLIT thresholds below", "", "**⚠️ FORCE_SPLIT (Mandatory for Extreme Milestones)**:", "", "If milestone exceeds ANY threshold: **>80 commits OR >10,000 src_loc OR >40% total src_loc** → splitting is MANDATORY regardless of subagent recommendation.", "", "**Fallback strategies** when functional splitting fails (try in order):", "1. **Topological/Dependency-based**: Group commits by code dependency relationships (imports, function calls, shared data structures). This preserves semantic coherence - related commits stay together.", "2. **Directory clustering**: Group by primary module/directory touched", "3. **Hybrid topological + size**: Topological grouping with size-balancing adjustments", "4. **Chronological** (LAST RESORT): Split into ~25-commit chunks by timestamp. ⚠️ WARNING: This often fragments semantically related commits across time slices, producing sub-milestones with generic descriptions like \"maint, fix, enh changes\" instead of clear functional themes. Only use when other strategies fail.", "", "Cycles from FORCE_SPLIT must be resolved by adjusting chunk boundaries.", "", "**Step 2: LLM identify large commits within selected milestones**", "", "For each selected milestone, analyze commits using:", "- Script's commit_src_locs data", "- Commit details from `{{get_commit_context}}` (message, diff, files)", "", "**Split criteria**:", "- ⭐⭐⭐ **Functional independence**: Multiple independent features/modules", "- ⭐⭐ **Size anomaly**: Significantly larger than milestone's other commits", "- ⭐⭐ **Split feasibility**: Clear boundaries (module/feature/file groups)", "- ⭐ **Squash merge signal**: Originally comessed from multiple commits", "", "**Do NOT split**:", "- Small single-function commits", "- Tightly coupled refactoring", "- Atomic bug fixes", "- Binary/auto-generated files", "", "**Determine `num_commits`**:", "- Based on src_loc and functional complexity", "- Typical: 3-5 feature commits + optional 1 test commit", "- Aim for balanced splits", "", "**Final output**: `large_commits_to_split` list:", "```", "{", "  \"milestone_id\": \"M2\",", "  \"commit_sha\": \"1812eac\",", "  \"src_loc\": 1601,", "  \"num_commits\": 4,", "  \"split_reason\": \"Squash merge with multiple independent modules\",", "  \"functional_themes\": [\"infrastructure\", \"connection\", \"fetch\"]", "}", "```", "", "---", "", "## Stage 2: Parallel Commit Splitting", "", "**Objective**: Split identified large commits into smaller logical commits using Subagents", "", "### 2.1 Invoke Subagents in Parallel", "", "**Subagent prompt**: `{{subagent_prompt_file}}`", "", "**Batch processing** (max 5 subagents concurrently):", "", "Process `large_commits_to_split` in batches of up to 5 commits:", "- For each batch, launch subagents in parallel", "- Each subagent receives a single commit to split", "", "**Subagent parameters** (dynamic, to be filled by Main Agent):", "- `target_commit`: Commit SHA to split", "- `num_commits`: Target number of feature commits (from Stage 1.2)", "- `working_branch`: \"split-{commit_sha[:7]}\"", "", "**Note**: The following are pre-injected into subagent prompt (no need to pass):", "- `repo_path`, `repo_src_dirs`, `exclude_patterns`, `base_image_name`, `build_command`", "", "**Note**: Output path and metadata script are hardcoded in the subagent prompt:", "- Output: `WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{working_branch}/`", "- Script: `WORKSPACE_ROOT/deepcommit/tools/milestone_balancing/generate_split_metadata.py`", "", "**Execution requirements**:", "- Wait for all subagents in a batch to complete before processing next batch", "- Validate subagent output integrity (METADATA.json exists and valid)", "- If a subagent fails, mark the commit as \"split failed, keep original\"", "", "### 2.2 Collect and Parse Subagent Output", "", "**For each successfully split commit**, collect:", "", "**Output directory structure**:", "```", "{output_base_path}/split-{commit_sha}/", "├── METADATA.json", "└── patches/", "    ├── {split_sha_1}.patch", "    ├── {split_sha_2}.patch", "    └── ...", "```", "", "**Parse METADATA.json** to extract:", "", "⚠️ **IMPORTANT**: METADATA.json MUST use `split_result.src_commits` format, NOT top-level `commits` or `split_commits`.", "", "```json", "{", "  \"original_commit\": {", "    \"sha\": \"1812eac36019be19cb02f181aa21d133ba9fe219\",", "    \"short_sha\": \"1812eac\",", "    \"message\": \"Original commit message\"", "  },", "  \"split_result\": {", "    \"src_commits\": [", "      {", "        \"sha\": \"abc123d...\",", "        \"short_sha\": \"abc123d\",", "        \"message\": \"feat: ...\",", "        \"src_stats\": {\"total_loc\": 401},", "        \"patch_file\": \"patches/abc123d.patch\",", "        \"files\": [\"src/module/file1.py\"]", "      },", "      {", "        \"sha\": \"def456e...\",", "        \"short_sha\": \"def456e\",", "        \"message\": \"feat: ...\",", "        \"src_stats\": {\"total_loc\": 389},", "        \"patch_file\": \"patches/def456e.patch\",", "        \"files\": [\"src/module/file2.py\"]", "      }", "    ],", "    \"integration_test_commit\": {", "      \"short_sha\": \"test123\",", "      \"message\": \"test: ...\",", "      \"src_stats\": {\"total_loc\": 0},", "      \"patch_file\": \"patches/test123.patch\"", "    },", "    \"dependency_edges\": []", "  }", "}", "```", "", "**Field explanations**:", "- Use `sha` for full hash, `short_sha` for 7-char hash (consistent naming)", "- `src_commits` MUST be inside `split_result`, never at top level", "- `src_loc` is `src_stats.total_loc` (additions + deletions in `REPO_SRC_DIRS` only)", "- `integration_test_commit`: May be null; at most ONE per original commit (a commit belongs to one repository)", "- `dependency_edges`: Array of `[source, target]` pairs where target depends on source. May be empty if commits are independent.", "", "**Build split commits mapping**:", "```", "split_commits_map = {", "  \"1812eac\": {", "    \"src_commits\": [\"abc123d\", \"def456e\"],", "    \"integration_test_commit\": \"test123\",  // or null", "    \"dependencies\": [...]  // from dependency_edges, may be empty", "  },", "  ...", "}", "```", "", "**Verification**:", "- Confirm all splits' total src_loc ≈ original commit's src_loc", "- Validate patch files exist for all split commits", "- If dependency_edges is non-empty, ensure edges form a valid DAG (no cycles within split commits)", "", "**Output**: Complete `split_commits_map` for all successfully split commits", "", "---", "", "## Stage 3: Global Reorganization and Balancing", "", "**Objective**: Split oversized milestones, merge undersized milestones, and achieve CV < 1.0", "", "### 3.1 Split Oversized Milestones", "", "**⚠️ MANDATORY SPLIT PRINCIPLE**: Every oversized milestone MUST be split into at least 2 sub-milestones (if find necessary). Do NOT give up easily.", "", "**Iterative Approach**: If one grouping strategy causes cycles, try alternative approaches:", "- If cycles detected, reorder commits between groups to break cycles rather than abandoning the split", "- Continue iterating until a valid split is found", "", "**Process each oversized milestone sequentially**:", "", "#### Step 1: Prepare Updated Commit List", "", "For milestone M1 with commits [A (split), B (kept), C (split)]:", "- Replace split commits with their split results from `split_commits_map`", "- Keep unsplit commits as-is", "- Result: new_commits = [A.1, A.2, A.3, B, C.1, C.2]", "", "#### Step 2: Group Commits by Functional Coherence", "", "**⚠️ BALANCE CV AND SEMANTIC COHERENCE**: Both metrics matter equally. Each sub-milestone should represent a clear functional theme (e.g., \"Tags System Revamp\", \"Testing Framework Modernization\") rather than a generic time-based slice (e.g., \"maint, fix, enh changes May-Jun\"). Aim for CV < 1.0 while maintaining meaningful functional groupings—avoid sacrificing one for the other.", "", "Group commits based on (priority order):", "1. **Functional relevance**: Related features belong together (highest priority)", "2. **Code dependencies**: Commits with import/call relationships stay together", "3. **Module structure**: Group commits touching same modules/files", "4. **Size balance**: Aim for balanced groups (lowest priority - don't sacrifice coherence for balance)", "", "**Example**:", "```", "M1 commits: [A.1, A.2, A.3, B, C.1, C.2]", "Dependencies (from METADATA.json): A.1 → A.3, C.1 → C.2  // may be partial or empty", "", "Groups:", "- Group 1: [A.1, A.2] - \"Infrastructure foundation\"", "- Group 2: [A.3, C.1] - \"Connection layer\"", "- Group 3: [B, C.2] - \"Fetch layer and utilities\"", "```", "", "#### Step 3: Generate Sub-Milestones and Update milestones.csv", "", "**For each group**, create a sub-milestone:", "- **ID**: `{parent_id}_sub-{seq:02d}` (e.g., M1_sub-01, M1_sub-02, M1_sub-03). **No nested splits allowed** - sub-milestones cannot be split further.", "- **Fields**: Generate `title`, `mini_srs`; preserve other columns", "", "**⚠️ CRITICAL: integration_test_commit Column Handling**:", "", "When a commit was split and METADATA.json contains `integration_test_commit`:", "", "1. **Read** the `integration_test_commit.short_sha` from METADATA.json (e.g., `4b2505f`)", "2. **Write** this SHA to the `integration_test_commit` column of the **FIRST sub-milestone ONLY** (e.g., M1_sub-01)", "3. **Do NOT** include this SHA in the `commits` column of any milestone", "4. **Leave empty** the `integration_test_commit` column for all other sub-milestones (M1_sub-02, M1_sub-03, ...)", "", "**Example**:", "```", "METADATA.json: {\"split_result\": {\"integration_test_commit\": {\"short_sha\": \"4b2505f\"}}}", "", "milestones.csv:", "| id    | commits           | integration_test_commit |", "|-------|-------------------|-------------------------|", "| M1_sub-01 | 5d488;0e2dc   | 4b2505f                 |  ← FIRST sub-milestone gets the SHA", "| M1_sub-02 | 24901;6f503   |                         |  ← Empty", "| M1_sub-03 | a5eb7         |                         |  ← Empty", "```", "", "**Common mistakes to avoid**:", "- ❌ Putting integration_test_commit SHA in `commits` column", "- ❌ Assigning integration_test_commit to multiple sub-milestones", "- ❌ Forgetting to populate the `integration_test_commit` column entirely", "", "**Write to milestones.csv**: Insert sub-milestones, delete parent M1", "", "**Validate and iterate**:", "```", "{{validate_milestone_partitioning}}({{milestone_csv}}, split_metadata_dir={{commit_splits}})", "```", "", "Key outputs: `inferred_dependencies`, `cycles`, `cycle_edge_details`", "", "**If cycles detected**:", "- Use `cycle_edge_details` to identify which commits cause the cycle", "- Reorder commits: move boundary commits between groups to break cycles", "- Try different grouping strategies if reordering doesn't work", "- Re-validate after each adjustment", "", "**Output**: Valid sub-milestones + `inferred_dependencies` for Step 4", "", "#### Step 4: Update Dependencies", "", "**Internal dependencies**: Add edges from `inferred_dependencies` between sub-milestones (default strength: Strong)", "", "**External dependencies**: Map original edges involving M1 to sub-milestones:", "- Incoming (X → M1): Map to M1_sub-01 (first)", "- Outgoing (M1 → Y): Map to M1_sub-{n} (last)", "", "**Write to dependencies.csv**:", "- PRESERVE edges not involving M1", "- REMOVE edges with M1", "- ADD internal + mapped external edges", "", "**Validate and iterate**:", "```", "{{analyze_dag_conflicts}}({{milestone_csv}}, {{dependencies_csv}}, split_metadata_dir={{commit_splits}})", "```", "", "**If cycles detected**:", "- For `existing_cycles`: remove or weaken the problematic edges", "- For `enriched_cycles`: adjust commit assignments between sub-milestones", "- Continue iterating until cycles are resolved", "", "**If current grouping strategy fails to produce a valid DAG**: Do NOT give up. Switch to a different grouping strategy (topological/dependency-based, directory-based, or size-based) and retry. Chronological splitting should only be used as a last resort due to poor semantic coherence. Only after exhausting all reasonable strategies should you consider keeping parent unsplit, and this must be documented with detailed justification.", "", "### **3.2 Merge Undersized Milestones**", "", "**After completing all splits**, identify and merge small milestones.", "", "#### Step 1: Identify Undersized Milestones", "", "Run `{{identify_imbalances}}` with `--small --k-value 0.5` to get candidates (src_loc < mean - 0.5*std)", "", "#### Step 2: Evaluate and Execute Merge", "", "**For each undersized milestone U**, find merge candidates from neighboring milestones (predecessors/successors in dependency graph).", "", "**Merge criteria**:", "- Functional relevance: Similar category or related functionality", "- Size compatibility: merged_src_loc < mean + std", "- No cycles introduced", "", "**If merging U into N**:", "- Combine commits (maintain temporal order)", "- Update `title`, `mini_srs` to reflect merged content", "- Merge other fields as appropriate (union for lists, min/max for timestamps)", "", "**If no good candidate found**: Keep U as-is", "", "#### Step 3: Update CSV Files", "", "**milestones.csv**: Modify N's row with merged data, delete U's row", "", "**dependencies.csv**:", "- Remove edges between N and U", "- Redirect edges referencing U to N", "- Deduplicate (prefer Strong over Weak)", "", "Validate with `{{analyze_dag_conflicts}}` to ensure no cycles.", "", "### 3.3 Validate CV and Decide Iteration", "", "**After completing all splits and merges**:", "", "#### Step 1: Final DAG Validation", "", "Run both validations and ensure they pass before proceeding:", "", "```", "{{validate_milestone_partitioning}}({{milestone_csv}}, split_metadata_dir={{commit_splits}})", "{{analyze_dag_conflicts}}({{milestone_csv}}, {{dependencies_csv}}, split_metadata_dir={{commit_splits}})", "```", "", "- Required: `cycles_count = 0`, `existing_cycles = []`, `enriched_cycles = []`", "- If fails: Fix issues before continuing; do not proceed with invalid DAG", "", "#### Step 2: Recalculate Global CV", "", "- Read updated milestones.csv", "- Calculate new CV = std(src_loc) / mean(src_loc)", "", "#### Step 3: Check Termination Conditions", "", "**Evaluate in order**:", "", "1. **Target achieved**: CV < 1.0 → Output \"SUCCESS\", exit", "", "2. **Maximum iterations reached**: iteration_count >= MAX_ITERATIONS → Output \"WARNING\", exit", "", "3. **No improvement**: new_cv >= old_cv → Output \"WARNING\", exit", "", "4. **Continue iterating**: CV improved but not < 1.0 → Return to Stage 1", "", "#### Step 4: Iteration State Management", "", "**Track across iterations**:", "- Iteration count", "- CV history: [initial_cv, cv_after_iter1, cv_after_iter2, ...]", "- Milestones split/merged per iteration", "- Best CV achieved (for potential rollback): If an iteration regresses CV or creates invalid output, rollback to the best-known state before exiting", "", "---", "", "## Output Format", "", "### Updated CSV Files", "", "**milestones.csv**: Update in-place (add sub-milestones, remove split parents, modify merged rows)", "", "**dependencies.csv**: Update in-place", "", "### Optimization Report", "", "**File**: `{{balancing_report}}`", "", "**Structure**:", "```json", "{", "  \"task\": \"milestone_dag_balancing\",", "  \"status\": \"SUCCESS\" | \"WARNING\",", "  \"initial_cv\": 1.45,", "  \"final_cv\": 0.87,", "  \"target_cv\": 1.0,", "  \"total_iterations\": 3,", "  \"iteration_history\": [", "    {", "      \"iteration\": 1,", "      \"cv_before\": 1.45,", "      \"cv_after\": 1.12,", "      \"milestones_split\": [\"M2\", \"M5\"],", "      \"milestones_merged\": [],", "      \"commits_split\": [\"1812eac\", \"abc123d\"]", "    },", "    ...", "  ],", "  \"final_statistics\": {", "    \"total_milestones\": 45,", "    \"mean_src_loc\": 423.5,", "    \"std_src_loc\": 368.2,", "    \"cv\": 0.87", "  },", "  \"warnings\": [],", "  \"notes\": \"Successfully balanced milestone DAG in 3 iterations\"", "}", "```", "", "---", "", "## Important Notes", "", "- **PRIORITIZE SPLITTING over MERGING**: The primary goal is to split oversized milestones into smaller sub-milestones. Merging undersized milestones is OPTIONAL and secondary. Focus your effort on splitting large milestones first.", "- **PERSIST UNTIL SUCCESS**: If a split attempt fails (due to cycles or other issues), do NOT give up. Try different grouping strategies (functional → topological/dependency-based → directory-based → size-based → chronological as last resort), reorder commits between groups, or adjust boundaries. Keep iterating until you find a valid split. Only mark as failed after exhausting ALL reasonable approaches.", "- **DAG Integrity**: Validate acyclic after each modification; abort operation if cycle detected", "- **Balance Both Goals**: Achieve CV < 1.0 while maintaining semantic coherence—both are important targets, not just one or the other", "- **Test Commits**: At most ONE `integration_test_commit` per repository per milestone. When splitting: (1) write SHA to `integration_test_commit` column of FIRST sub-milestone only, (2) do NOT put this SHA in any `commits` column, (3) leave other sub-milestones' `integration_test_commit` empty", "- **External Dependency Mapping**: Do NOT blindly inherit to all entry/exit; analyze patches to find true relationships (typically 1-2 sub-milestones per edge)", "- **FORCE_SPLIT is MANDATORY**: Milestones exceeding force thresholds (>80 commits, >10K src_loc, >40% total) MUST be decomposed using fallback strategies if needed.", "- **Dependency Preservation**: When updating dependencies.csv, only modify edges directly involving the milestone(s) being split or merged. All other existing dependency edges MUST be preserved exactly as-is. This is an incremental update, NOT a reconstruction—the output should contain all original edges minus those explicitly replaced/removed, plus any new edges added."], "ops": [["equal", 0, 21, 0, 21], ["insert", 21, 21, 21, 39], ["equal", 21, 37, 39, 55], ["replace", 37, 39, 55, 58], ["equal", 39, 65, 58, 84], ["replace", 65, 66, 84, 85], ["equal", 66, 67, 85, 86], ["replace", 67, 68, 86, 87], ["equal", 68, 69, 87, 88], ["replace", 69, 70, 88, 89], ["equal", 70, 108, 89, 127], ["replace", 108, 109, 127, 128], ["equal", 109, 149, 128, 168], ["replace", 149, 150, 168, 169], ["equal", 150, 320, 169, 339], ["replace", 320, 321, 339, 340], ["equal", 321, 589, 340, 608], ["replace", 589, 590, 608, 609], ["equal", 590, 593, 609, 612]], "add": 28, "del": 9}, {"what": ["Added the workspace section: the commit being split lives in one repo, and all git work happens in that repo's folder.", "Source dirs are repo-prefixed with several repos; the prompt says to strip the prefix.", "The integration test commit stays in the same repo as the split commit.", "Compile check (Phase 5) applies only to a one-repo workspace; otherwise skipped and noted."], "why": "Single-repo runs are just a workspace with one repo, so one multi-repo prompt is enough.", "rewritten": true, "id": "milestone-decompose-subagent-md", "path": "deepcommit/pipeline/prompts/stage_breakdown_v1/milestone_decompose_subagent.md", "name": "milestone_decompose_subagent.md", "group": "Phase 2: milestone stages", "note": "Stage 4 sub-agent. Rewritten multi-repo only: works in the split commit's repo dir, integration test commit stays in that repo, compile check only for a one-repo workspace.", "status": "modified", "old": ["**Start of Subagent Prompt Template**", "", "---", "", "#### Subagent Prompt: Git Commit Split", "", "##### Purpose", "This prompt is designed for an autonomous agent to split a large squashed git commit into multiple smaller, logically organized commits. The agent should analyze the commit content, create a splitting plan, and execute the split operation independently.", "", "---", "", "##### Task Overview", "", "You are tasked with splitting a large git commit into multiple smaller, logical commits that are easier to review and understand.", "", "---", "", "##### Input Parameters", "", "The following parameters will be provided when this prompt is invoked:", "", "- **Repository Path**: `{{repo_path}}` - The git repository location (e.g., `/path/to/trial_space/project/repo_data`)", "- **Target Commit**: `{{target_commit}}` - The commit SHA to be split (7-char or full SHA)", "- **Number of Commits**: `{{num_commits}}` - Target number of feature commits to create from src/ directory (e.g., 3-5)", "- **Src Directories**: `{{repo_src_dirs}}` - Comma-separated source directories to include (e.g., \"src,lib\")", "- **Exclude Patterns**: `{{exclude_patterns}}` - Comma-separated glob patterns for files to exclude (e.g., \"tests/**,**/test_*.py\")", "- **Working Branch**: `{{working_branch}}` - The branch name for split commits (**MUST be `split-<commit_sha>`**, e.g., `split-5b9adb0`)", "- **Base Image Name**: `{{base_image_name}}` - Docker image with compilation environment (e.g., `navidrome-test:v0.57.0`)", "- **Build Command**: `{{build_command}}` - Command to compile the project (e.g., `go build ./cmd/...`, `npm run build`)", "", "**Output Location** (hardcoded, NOT a parameter):", "- Output directory: `WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}/`", "- Where `WORKSPACE_ROOT = $(dirname \"{{repo_path}}\")` (parent of repo_data)", "- Example: If `{{repo_path}}` is `/path/trial_space/project/repo_data`, output goes to `/path/trial_space/project/stage4_decomp/output/commit_splits/split-xxx/`", "", "---", "", "##### Task Requirements", "", "###### 1. Analysis Phase", "", "Before splitting, thoroughly analyze the target commit:", "", "**a) Examine commit metadata and calculate LOC breakdown**:", "   ```bash", "   # Overall stats", "   git show --stat {{target_commit}}", "", "   # Src directory LOC (primary splitting basis)", "   # Note: Replace {{repo_src_dirs}} with actual directories; for multiple dirs, sum each separately", "   git show {{target_commit}} --numstat -- {{repo_src_dirs}} | awk '{sum+=$1+$2} END {print sum}'", "", "   # Test LOC", "   git show {{target_commit}} --numstat -- test/ | awk '{sum+=$1+$2} END {print sum}'", "", "   # Config/infrastructure LOC", "   git show {{target_commit}} --numstat -- '*.yml' '*.yaml' 'noxfile.py' | awk '{sum+=$1+$2} END {print sum}'", "   ```", "", "**b) Identify file categories**:", "   - **Src files** ({{repo_src_dirs}}): Primary splitting target (may span multiple directories)", "   - **Test infrastructure** (conftest.py, fixtures): Shared test foundation", "   - **Unit tests**: Test single modules/classes", "   - **Integration tests**: Test complete feature workflows", "   - **Configuration files** (CI, linting, dependencies)", "   - **Documentation** (README, changelog)", "", "**c) Calculate splitting target for src/ directory**:", "   ```bash", "   # Target LOC per feature commit", "   target_loc_per_commit = src_total_loc / {{num_commits}}", "", "   # Example: 1102 LOC / 3 commits ≈ 367 LOC per commit", "   ```", "", "**d) Analyze test file structure**:", "   - **Identify test types**:", "     - Unit tests: Test single class/function (e.g., `test_request_validation()`)", "     - Integration tests: Test complete workflows (e.g., `test_http_request_response_cycle()`)", "   - **Map test-to-code relationships**:", "     - Example: `test_connection.py` contains:", "       - `TestHTTPConnection` (unit test for `HTTPConnection`) → C2", "       - `TestHTTPSConnection` (unit test for `HTTPSConnection`) → C2", "       - `test_full_request()` (integration test) → CN+1 (separate test commit)", "   - **Identify shared test infrastructure**:", "     - `conftest.py`, pytest fixtures → Commit 1", "     - Test server setup, mock objects → Commit 1", "", "**e) Analyze src/ code structure**:", "   - Use `git show {{target_commit}}:<file_path>` to examine file structure", "   - Identify logical boundaries (classes, functions, modules)", "   - Group related functionality for balanced commits", "", "###### 2. Planning Phase", "", "Create a detailed splitting plan based on src/ directory LOC balance:", "", "**a) Standard commit structure** ({{num_commits}} feature commits + optional 1 test commit):", "", "   **IMPORTANT**: At most ONE integration test commit allowed per original commit.", "", "   ```", "   Commit 1: Infrastructure + Test Infrastructure + First Feature Layer", "     ├─ Config files (CI, build, linting)", "     ├─ Test infrastructure (conftest.py, fixtures)", "     ├─ Src code: ~target_loc_per_commit", "     └─ Unit tests for this layer (if exist)", "", "   Commit 2 to N: Feature Layers (balanced by src/ LOC)", "     ├─ Src code: ~target_loc_per_commit each", "     └─ Unit tests for this layer (if exist)", "", "   Commit N+1: Integration Test Suite (if exists, at most ONE)", "     └─ All integration tests that require complete feature stack", "   ```", "", "**b) Test file allocation strategy**:", "", "   **CRITICAL PRINCIPLE**: Tests should follow the code they test whenever possible. A pure test commit should NEVER become a standalone milestone.", "", "   | Test Type | Allocation | Condition | Example |", "   |-----------|-----------|-----------|---------|", "   | **Test infrastructure** | Commit 1 | Always with first feature | `conftest.py`, fixtures |", "   | **Unit tests** | Same commit as src | Tests compile & run with that commit's code | `test_request.py` → with `request.py` |", "   | **Feature tests** | Same commit as src | Tests only need code from this commit | `test_connection.py` → with `connection.py` |", "   | **Integration tests** | `integration_test_commit` | Tests require code from multiple commits | Cross-module workflow tests |", "", "   **Decision flowchart for each test file**:", "   ```", "   For each test file:", "   1. Does it ONLY test code from a single feature commit?", "      YES → Include in that feature commit", "      NO → Continue to step 2", "", "   2. Can it compile and run with just one feature commit's code?", "      YES → Include in that feature commit", "      NO → Goes to integration_test_commit", "", "   3. Does it test cross-cutting functionality across multiple commits?", "      YES → Goes to integration_test_commit", "   ```", "", "   **How to verify test allocation**:", "   ```bash", "   # After creating feature commit N, verify its tests can run:", "   docker exec verify-split bash -c \"cd /testbed && \\", "     go test ./path/to/module/... -run TestXxx\"  # or pytest for Python", "", "   # If tests pass → correct allocation", "   # If tests fail due to missing code → move to integration_test_commit", "   ```", "", "   **How to identify test type**:", "   - Unit/Feature test (include with code): Tests single module, can run independently", "     ```python", "     from src.foo import FooClass", "     def test_foo_method(): ...  # Only tests FooClass, include with foo.py", "     ```", "   - Integration test (separate commit): Tests workflow across multiple modules", "     ```python", "     from src.connection import HTTPConnection  # From commit 2", "     from src.response import Response           # From commit 1", "     from src.fetch import fetch                 # From commit 3", "     def test_full_http_request(): ...  # Needs all commits, → integration_test_commit", "     ```", "", "**c) Src/ directory splitting plan**:", "   - Target: ~<target_loc_per_commit> LOC per commit", "   - Group by logical layers or features", "   - Example for 1102 LOC / 3 commits:", "     - Commit 1: Infrastructure + Core types + Response (330 LOC)", "     - Commit 2: Connection layer (359 LOC)", "     - Commit 3: Fetch layer (413 LOC)", "     - Commit 4: Integration tests (948 LOC)", "", "**d) Document your plan** including:", "   - Total commits to create (feature + test)", "   - Each commit's purpose and message", "   - Src LOC distribution", "   - Test allocation (unit vs integration)", "   - Which files need partial staging (`git add -p`)", "", "###### 3. Execution Phase", "", "Execute the split operation carefully:", "", "**a) Setup**:", "   ```bash", "   cd {{repo_path}}", "   git checkout {{target_commit}}", "   git checkout -b {{working_branch}}", "   ```", "", "**b) Prepare for splitting**:", "   ```bash", "   # Soft reset to parent (keeps all changes staged)", "   git reset --soft HEAD^", "", "   # Unstage all files", "   git reset", "   ```", "", "**c) Create Commit 1 (Infrastructure + Test Infrastructure + First Feature)**:", "   ```bash", "   # Add config/infrastructure files", "   git add .github/workflows/*.yml noxfile.py *.txt .eslintrc.yml", "", "   # Add test infrastructure", "   git add test/**/conftest.py", "", "   # Add first src/ layer", "   git add src/module/__init__.py src/module/core.py", "", "   # Add unit tests for first layer (if exist)", "   git add test/test_core.py", "", "   # Commit with detailed message", "   git commit -m \"$(cat <<'EOF'", "feat: add infrastructure, test setup, and core module", "", "Src changes:", "- Core module initialization and base classes (XXX LOC)", "- Response handling infrastructure (YYY LOC)", "", "Tests:", "- Test infrastructure (conftest.py with fixtures)", "- Unit tests for core module (if applicable)", "EOF", ")\"", "   ```", "", "**d) Create Commits 2-N (Feature Layers)**:", "   ```bash", "   # For each subsequent feature layer", "", "   # Add src/ files for this layer (complete or partial)", "   git add src/module/feature.py", "   # OR use git add -p for large files", "   git add -p src/module/large_file.py", "", "   # Add unit tests for this layer (if exist)", "   # If test file only contains tests for this layer:", "   git add test/test_feature.py", "", "   # If test file contains multiple test classes, use git add -p:", "   git add -p test/test_multiple.py  # Select only relevant test class", "", "   # Commit with detailed message", "   git commit -m \"$(cat <<'EOF'", "feat: implement feature layer X", "", "Src changes:", "- Feature X implementation (XXX LOC)", "- Helper utilities for feature X (YYY LOC)", "", "Tests:", "- Unit tests for feature X", "EOF", ")\"", "   ```", "", "**e) Create Commit N+1 (Integration Tests, if exist)**:", "", "   **IMPORTANT RULES**:", "   - ✅ **ONLY ONE** integration test commit allowed per original commit - this is a critical constraint", "   - ✅ **MUST be the LAST commit** on the branch", "   - ✅ Message must be self-contained (see format below)", "   - ✅ Integration test commit typically has **src_loc=0** (tests are outside source directories)", "", "   ```bash", "   # Add all integration test files", "   git add test/test_integration.py test/test_e2e.py", "", "   # Commit with detailed message", "   git commit -m \"$(cat <<'EOF'", "test: add comprehensive integration test suite", "", "Tests:", "- 29 integration tests covering complete workflows", "- HTTP/HTTPS requests, streaming, timeouts, error handling", "- Requires all feature commits (1-3) to run", "EOF", ")\"", "   ```", "", "**f) Tips for partial file staging**:", "   - Use `git add -p` to interactively select hunks", "   - Split at logical boundaries (function/class boundaries)", "   - When `git add -p` doesn't show good boundaries, use `git add -e` to manually edit", "   - Example: Split `test_connection.py` by test classes", "     ```bash", "     git add -p test/test_connection.py", "     # Select: TestHTTPConnection class → Commit 2", "     # Skip: TestHTTPSConnection class → Commit 3", "     ```", "", "**g) Commit Message Format Requirements**:", "", "   **CRITICAL**: Each commit message MUST be self-contained and follow this format:", "", "   **For feature commits**:", "   ```", "   feat: <concise summary>", "", "   Src changes:", "   - <Key feature 1> (<LOC count>)", "   - <Key feature 2> (<LOC count>)", "   - <Key classes/functions added>", "", "   Tests:", "   - <Unit tests included, if any>", "   - OR \"No unit tests (<reason>)\"", "   ```", "", "   **For integration test commit**:", "   ```", "   test: add comprehensive integration test suite", "", "   Tests:", "   - <Number> integration tests covering <scope>", "   - <Key test scenarios>", "   - Requires all feature commits (<range>) to run", "   ```", "", "**h) Verification after each commit**:", "   ```bash", "   git show --stat", "   git log --oneline -5", "", "   # Verify message format", "   git log -1 --format=%B", "   ```", "", "###### 4. Validation Phase", "", "After completing all commits, validate the results:", "", "**a) Verify tree SHA match (MOST IMPORTANT)**:", "", "   This is the **strongest validation** - if tree SHAs match, the splits are 100% identical to the original.", "", "   ```bash", "   # Compare tree objects", "   ORIG_TREE=$(git rev-parse {{target_commit}}^{tree})", "   SPLIT_TREE=$(git rev-parse {{working_branch}}^{tree})", "", "   if [ \"$ORIG_TREE\" = \"$SPLIT_TREE\" ]; then", "       echo \"✅ PERFECT MATCH - Tree SHA is identical\"", "   else", "       echo \"❌ Trees differ - investigation needed\"", "   fi", "   ```", "", "   **Note**: Tree SHA represents the entire working directory state. If they match, every file has exactly the same content, permissions, and path.", "", "**b) Check working tree is clean**:", "   ```bash", "   git status", "   ```", "", "###### 5. Compilation Verification Phase", "", "After validating tree SHA match, verify that each split commit s successfully when patches are applied sequentially.", "", "**a) Setup container (once)**:", "   ```bash", "   WORKSPACE_ROOT=\"$(dirname \"{{repo_path}}\")\"", "   OUTPUT_DIR=\"$WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}\"", "", "   # Start container", "   docker run -d --name verify-split-{{target_commit}} {{base_image_name}} tail -f /dev/null", "", "   # Copy repository", "   docker exec verify-split-{{target_commit}} rm -rf /testbed", "   docker cp {{repo_path}} verify-split-{{target_commit}}:/testbed", "   docker exec verify-split-{{target_commit}} git config --global --add safe.directory /testbed", "   docker exec verify-split-{{target_commit}} git config --global user.email \"verify@test.local\"", "   docker exec verify-split-{{target_commit}} git config --global user.name \"Verify Bot\"", "", "   # Verify parent compiles (environment check)", "   docker exec verify-split-{{target_commit}} bash -c \"cd /testbed && \\", "     git checkout {{target_commit}}^ && \\", "     {{build_command}}\"", "   ```", "   If parent fails to compile, the environment is misconfigured - fix before proceeding.", "", "**b) Generate patches and verify** (repeat until success):", "   ```bash", "   # Define paths (in case running separately from step a)", "   WORKSPACE_ROOT=\"$(dirname \"{{repo_path}}\")\"", "   OUTPUT_DIR=\"$WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}\"", "", "   # Generate patches from host", "   mkdir -p \"$OUTPUT_DIR/patches\"", "   cd \"{{repo_path}}\"", "   COMMITS=($(git rev-list --reverse {{target_commit}}^..{{working_branch}}))", "   for commit in \"${COMMITS[@]}\"; do", "       commit_short=$(git rev-parse --short \"$commit\")", "       git format-patch -1 \"$commit\" --stdout > \"$OUTPUT_DIR/patches/${commit_short}.patch\"", "   done", "", "   # Reset container state and copy new patches", "   docker exec verify-split-{{target_commit}} bash -c \"cd /testbed && \\", "     git checkout {{target_commit}}^ && \\", "     git clean -fd && \\", "     git checkout -B verify-split\"", "   docker exec verify-split-{{target_commit}} rm -rf /tmp/patches", "   docker cp \"$OUTPUT_DIR/patches\" verify-split-{{target_commit}}:/tmp/patches", "", "   # Apply each patch in commit order (IMPORTANT: not alphabetical!)", "   for commit in \"${COMMITS[@]}\"; do", "     sha=$(git rev-parse --short \"$commit\")", "     patch_name=\"${sha}.patch\"", "", "     echo \"Testing patch $sha...\"", "     docker exec verify-split-{{target_commit}} bash -c \"cd /testbed && \\", "       git apply /tmp/patches/$patch_name && \\", "       {{build_command}} && \\", "       git add -A && git commit -m 'Applied $sha'\"", "", "     if [ $? -ne 0 ]; then", "       echo \"❌ Patch $sha failed - see 'Handling Failures' below\"", "       break", "     fi", "   done", "   ```", "", "**c) Verify final result**:", "   ```bash", "   docker exec verify-split-{{target_commit}} bash -c \"cd /testbed && git diff {{target_commit}} .\"", "   # Should produce empty output", "   ```", "", "**d) Cleanup container** (only after all verification passes):", "   ```bash", "   docker stop verify-split-{{target_commit}} && docker rm verify-split-{{target_commit}}", "   ```", "", "**Handling Compilation Failures**:", "", "Container stays running for fast iteration. When a patch fails:", "", "1. **Note the error** - record which patch failed and the compilation error", "2. **Fix on host** - return to `{{repo_path}}` and modify commits on `{{working_branch}}`:", "   - **Re-partition code** between commits to resolve dependencies", "   - **Merge commits** that have tightly coupled changes (`git rebase -i`)", "   - **Reorder commits** to ensure definitions appear before usages", "3. **Re-run Phase 4** - verify tree SHA still matches", "4. **Re-run step (b)** - container resets to parent and applies new patches", "", "The container is reused across iterations - only `git reset` + copy new patches, no container recreation.", "", "---", "", "##### Important Guidelines", "", "###### Technical Best Practices", "", "- **Use `git add -p` for partial file staging**: When a single file contains multiple logical changes", "- **Preserve atomic functionality**: Each commit should represent a complete, logical unit of change", "- **Handle binary files carefully**: Binary files cannot be partially staged", "- **Watch for ignored files**: Some files may need `git add -f` if they're in .gitignore", "", "###### Splitting Strategies", "", "**a) By layer/responsibility**:", "   - Infrastructure/configuration", "   - Type definitions/interfaces", "   - Core implementation", "   - Utilities/helpers", "   - Tests", "   - Documentation", "", "**b) By dependency order**:", "   - Base/foundation code first (with its tests)", "   - Dependent code later (with its tests)", "   - Test infrastructure (fixtures, conftest) can be separate if shared across modules", "", "**c) By feature components**:", "   - Each major feature or module as separate commits", "   - Shared/common code first", "", "###### Quality Checks", "", "- Each commit should be understandable independently", "- **Commit message requirements** (CRITICAL):", "  - ✅ Self-contained with \"Src changes\" and \"Tests\" sections", "  - ✅ Include LOC counts for major features", "  - ✅ Explain test status (unit tests included or not, and why)", "  - ✅ For test commit: state dependencies on feature commits", "  - ❌ No vague messages like \"feat: implement feature\"", "- Related file changes should stay together", "- Src/ LOC should be relatively balanced across feature commits", "- **Test commit rules** (CRITICAL):", "  - ✅ Maximum ONE integration test commit per original commit - strict constraint", "  - ✅ MUST be the LAST commit on branch", "  - ✅ Message must explain test coverage and dependencies", "  - ✅ Integration test commit typically has src_loc=0 (tests outside source directories)", "  - ❌ No multiple test commits", "  - ❌ No test commit in the middle of feature commits", "", "---", "", "##### Final Output:", "", "After completing the split and compilation verification, finalize the output artifacts.", "", "**Note**: Patches were already generated during Phase 5 (Compilation Verification). This section focuses on generating METADATA.json and analyzing dependencies.", "", "###### Output Directory Structure", "", "**IMPORTANT**: Output MUST be created at `WORKSPACE_ROOT/stage4_decomp/output/commit_splits/`, NOT inside `repo_data/`.", "", "- **Working Branch**: `{{working_branch}}` (e.g., `split-1812eac`)", "- **Output Directory**: `WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}/`", "", "Create the following directory structure:", "", "```", "WORKSPACE_ROOT/", "├── repo_data/                         # Git repository (DO NOT create output here!)", "└── stage4_decomp/", "    └── output/", "        └── commit_splits/", "            └── {{working_branch}}/    # e.g., split-1812eac/", "                ├── METADATA.json      # Machine-readable metadata", "                └── patches/           # Patch files directory", "                    ├── <sha_1>.patch  # Named by 7-char commit SHA", "                    ├── <sha_2>.patch", "                    └── ...", "```", "", "**Example**: For commit `1812eac` with `repo_path=/data/trial/project/repo_data`:", "- WORKSPACE_ROOT: `/data/trial/project`", "- Branch name: `split-1812eac`", "- Output path: `/data/trial/project/stage4_decomp/output/commit_splits/split-1812eac/`", "", "This is the minimal, essential output. No additional documentation or scripts needed.", "", "###### Required Steps", "", "**a) Verify patches exist** (generated in Phase 5):", "", "```bash", "WORKSPACE_ROOT=\"$(dirname \"{{repo_path}}\")\"", "OUTPUT_DIR=\"$WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}\"", "", "ls -la \"$OUTPUT_DIR/patches/\"", "# Should show all .patch files generated during Phase 5", "```", "", "**b) Generate METADATA.json**:", "", "Use the automated script to generate structured metadata:", "", "```bash", "# Use the same absolute path approach", "REPO_PATH=\"{{repo_path}}\"", "WORKSPACE_ROOT=\"$(dirname \"$REPO_PATH\")\"", "OUTPUT_DIR=\"$WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}\"", "", "cd \"$REPO_PATH\"", "git checkout {{working_branch}}", "", "# Run the metadata generation script with absolute paths", "python \"$WORKSPACE_ROOT/deepcommit/tools/milestone_balancing/generate_split_metadata.py\" \\", "    --repo-path \"$REPO_PATH\" \\", "    --branch-name {{working_branch}} \\", "    --repo-src-dirs {{repo_src_dirs}} \\", "    --exclude-patterns \"{{exclude_patterns}}\" \\", "    --output-dir \"$OUTPUT_DIR\"", "", "# Verify output was created in correct location", "if [[ -f \"$OUTPUT_DIR/METADATA.json\" ]]; then", "    echo \"✅ METADATA.json created at: $OUTPUT_DIR/METADATA.json\"", "else", "    echo \"❌ ERROR: METADATA.json not found at expected location!\"", "    exit 1", "fi", "```", "", "The script will automatically:", "- Analyze all commits on the branch", "- Separate src commits from integration test commit (at most ONE)", "- Calculate source directory LOC statistics for each commit (respecting exclude patterns)", "- Generate METADATA.json in the format expected by Main Agent (see Main Agent prompt for complete schema)", "", "**METADATA.json format** (MUST follow this exact structure - Main Agent expects `split_result.src_commits`):", "", "⚠️ **IMPORTANT**: Always use `split_result.src_commits`, NOT top-level `commits` or `split_commits`. This is the standardized format.", "", "```json", "{", "  \"original_commit\": {", "    \"sha\": \"1812eac36019be19cb02f181aa21d133ba9fe219\",", "    \"short_sha\": \"1812eac\",", "    \"message\": \"Original commit message\",", "    \"...\": \"...\"", "  },", "  \"split_result\": {", "    \"src_commits\": [", "      {", "        \"sha\": \"abc123d...\",", "        \"short_sha\": \"abc123d\",", "        \"message\": \"feat: ...\",", "        \"src_stats\": {\"total_loc\": 401},", "        \"patch_file\": \"patches/abc123d.patch\",", "        \"files\": [\"src/module/file1.py\", \"src/module/file2.py\"]", "      }", "    ],", "    \"integration_test_commit\": {", "      \"sha\": \"test123...\",", "      \"short_sha\": \"test123\",", "      \"message\": \"test: ...\",", "      \"src_stats\": {\"total_loc\": 0},", "      \"patch_file\": \"patches/test123.patch\"", "    },", "    \"dependency_edges\": [", "      [\"abc123d\", \"def456e\"]", "    ]", "  }", "}", "```", "", "**Field naming conventions** (use consistently):", "- Use `sha` for full commit hash, `short_sha` for 7-char hash", "- `src_commits` MUST be inside `split_result`, never at top level", "- `integration_test_commit`: May be null; at most ONE per original commit", "- `dependency_edges`: Format [source, target] means target depends on source", "", "**Field explanations**:", "- Commit `src_loc` is `src_stats.total_loc` (additions + deletions in source directories only), excluding files matching exclude patterns. Calculated by the metadata script respecting `{{repo_src_dirs}}` and `{{exclude_patterns}}` parameters.", "- Integration test commit typically has `src_loc=0` since tests are outside source directories", "- `dependency_edges`: **Format [source, target] means target depends on source**. Edge direction: source → target (target depends on source).", "", "Output:", "```", "✅ Generated metadata: $OUTPUT_DIR/METADATA.json", "   - Src commits: N", "   - Integration test commit: Yes/No", "```", "", "The script generates METADATA.json with an empty `dependency_edges` array.", "", "**c) Analyze and populate dependency_edges**:", "", "After generating METADATA.json, analyze actual code dependencies between split commits and populate `split_result.dependency_edges[]`:", "", "**Add a dependency edge [A, B] (B depends on A) ONLY when**:", "- Commit B imports/calls symbols (classes, functions, constants) newly defined in commit A", "- Commit B modifies code regions that commit A also modifies (overlapping hunks)", "- Commit B's functionality logically requires commit A's changes to exist first", "", "**Do NOT add edge when**:", "- Commits modify different files with no code relationship", "- The only reason is \"A was created before B\" (generation order ≠ code dependency)", "- Commits are functionally independent (e.g., A adds `auth.py`, B adds `cache.py` with no shared code)", "", "```bash", "# Edit METADATA.json to add actual dependencies", "vim \"$OUTPUT_DIR/METADATA.json\"", "", "# Format: [source_sha, target_sha] means target depends on source", "# Example: [\"abc123d\", \"def456e\"] means commit def456e depends on commit abc123d", "# Edge direction: source -> target (target depends on source)", "```", "", "**Analysis steps**:", "1. For each pair of commits, check if later commit imports/uses symbols from earlier commit", "2. Check for overlapping file modifications", "3. Only add edges where real code dependency exists", "4. Result may be: linear chain, partial dependencies, or no dependencies (all independent)", "", "---", "", "##### Notes", "", "- **Safety**: Always work on a new branch, never modify the original commit directly", "- **Autonomy**: The agent should make intelligent decisions based on code analysis, not just follow rigid rules", "- **Flexibility**: Adjust the plan if unexpected issues arise during execution", "- **Documentation**: Provide clear rationale for all major decisions", "", "---", "", "##### Success Criteria", "", "✅ All changes from the original commit are preserved (tree SHA match)", "✅ All patches compile successfully when applied sequentially", "✅ Created {{num_commits}} feature commits with balanced src/ LOC", "✅ Each commit has clear, focused purpose (indicated in message)", "✅ Src/ directory LOC is relatively balanced across feature commits", "✅ Test infrastructure in Commit 1", "✅ Unit tests paired with corresponding src code", "✅ At most ONE integration test commit (if exists, must be last commit)", "✅ Working tree is clean after completion", "✅ No empty commits created", "", "---", "", "**End of Subagent Prompt Template**"], "new": ["**Start of Subagent Prompt Template**", "", "---", "", "#### Subagent Prompt: Git Commit Split", "", "##### Purpose", "This prompt is designed for an autonomous agent to split a large squashed git commit into multiple smaller, logically organized commits. The agent should analyze the commit content, create a splitting plan, and execute the split operation independently.", "", "---", "", "##### Task Overview", "", "You are tasked with splitting a large git commit into multiple smaller, logical commits that are easier to review and understand.", "", "### Workspace `{{workspace_id}}`", "", "This run covers a workspace of one or more repositories that are developed together:", "", "{{workspace_repos_table}}", "", "- Inspect code with `git -C repo_data/<repo> ...` (the `repo dir` column of the table; for a one-repo workspace that is `repo_data` itself). The MCP git tools route to the correct repository automatically.", "- Commit ids are bare 7-character SHAs, unique inside the workspace. A commit's repository is its `repo` field in the commit records or its entry in `commit_repos` (`commit_repos.json`). Never guess it from the SHA and never run `git` against the wrong repository.", "- With more than one repository, every file path in merged data is prefixed `<repo>/<path-in-repo>`; strip the prefix before passing a path to `git -C repo_data/<repo>`.", "- Edges in `commit_dag.json` come
