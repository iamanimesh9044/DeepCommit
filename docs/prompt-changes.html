in two groups. `edges_dag` holds per-repository textual edges plus HARD cross-repo edges (`\"xrepo\": true`, `edge_types` such as `xrepo_contract`, `xrepo_pin`, `xrepo_pr_link`). `edges_soft` holds heuristic hints (for example time proximity): never enforced, and you may cut them.", "", "**Workspace rules**:", "- The commit you split belongs to exactly one repository (its `repo` field or `commit_repos`): the **split repository**, checked out at `repo_data/<repo>`. All git work (`cd`, `git -C`, `docker cp`, script `--repo-path`) happens in that directory, so run the commands below from it; `<repo dir>` below means it.", "- Never split a contract change from what its first consumer uses: a commit that is the contract side of a HARD cross-repo edge must be split so that the contract change stays in one piece.", "- `integration_test_commit` belongs to the same repository as the split commit; there is at most one per split commit.", "- Compilation verification (Phase 5) applies only to a one-repo workspace with a configured base image and build command; with several repositories skip it and record `skipped (multi-repo workspace)` in the metadata notes.", "---", "", "##### Input Parameters", "", "The following parameters will be provided when this prompt is invoked:", "", "- **Repository Root**: `{{repo_path}}` - Directory holding the repository checkouts (e.g., `/path/to/trial_space/project/repo_data`); the split repository is `<repo dir>` as defined above", "- **Target Commit**: `{{target_commit}}` - The commit SHA to be split (7-char or full SHA)", "- **Number of Commits**: `{{num_commits}}` - Target number of feature commits to create from src/ directory (e.g., 3-5)", "- **Src Directories**: `{{repo_src_dirs}}` - Comma-separated source directories to include (e.g., \"src,lib\"); with several repositories they are prefixed `<repo>/`, so keep only the split repository's entries and strip the prefix before using them inside `<repo dir>`", "- **Exclude Patterns**: `{{exclude_patterns}}` - Comma-separated glob patterns for files to exclude (e.g., \"tests/**,**/test_*.py\")", "- **Working Branch**: `{{working_branch}}` - The branch name for split commits (**MUST be `split-<commit_sha>`**, e.g., `split-5b9adb0`)", "- **Base Image Name**: `{{base_image_name}}` (only set for a one-repo workspace) - Docker image with compilation environment (e.g., `navidrome-test:v0.57.0`)", "- **Build Command**: `{{build_command}}` (only set for a one-repo workspace) - Command to compile the project (e.g., `go build ./cmd/...`, `npm run build`)", "", "**Output Location** (hardcoded, NOT a parameter):", "- Output directory: `WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}/`", "- Where `WORKSPACE_ROOT = $(dirname \"{{repo_path}}\")` (parent of repo_data)", "- Example: If `{{repo_path}}` is `/path/trial_space/project/repo_data`, output goes to `/path/trial_space/project/stage4_decomp/output/commit_splits/split-xxx/`", "", "---", "", "##### Task Requirements", "", "###### 1. Analysis Phase", "", "Before splitting, thoroughly analyze the target commit:", "", "**a) Examine commit metadata and calculate LOC breakdown**:", "   ```bash", "   # Overall stats", "   git show --stat {{target_commit}}", "", "   # Src directory LOC (primary splitting basis)", "   # Note: Replace {{repo_src_dirs}} with actual directories; for multiple dirs, sum each separately", "   git show {{target_commit}} --numstat -- {{repo_src_dirs}} | awk '{sum+=$1+$2} END {print sum}'", "", "   # Test LOC", "   git show {{target_commit}} --numstat -- test/ | awk '{sum+=$1+$2} END {print sum}'", "", "   # Config/infrastructure LOC", "   git show {{target_commit}} --numstat -- '*.yml' '*.yaml' 'noxfile.py' | awk '{sum+=$1+$2} END {print sum}'", "   ```", "", "**b) Identify file categories**:", "   - **Src files** ({{repo_src_dirs}}): Primary splitting target (may span multiple directories)", "   - **Test infrastructure** (conftest.py, fixtures): Shared test foundation", "   - **Unit tests**: Test single modules/classes", "   - **Integration tests**: Test complete feature workflows", "   - **Configuration files** (CI, linting, dependencies)", "   - **Documentation** (README, changelog)", "", "**c) Calculate splitting target for src/ directory**:", "   ```bash", "   # Target LOC per feature commit", "   target_loc_per_commit = src_total_loc / {{num_commits}}", "", "   # Example: 1102 LOC / 3 commits ≈ 367 LOC per commit", "   ```", "", "**d) Analyze test file structure**:", "   - **Identify test types**:", "     - Unit tests: Test single class/function (e.g., `test_request_validation()`)", "     - Integration tests: Test complete workflows (e.g., `test_http_request_response_cycle()`)", "   - **Map test-to-code relationships**:", "     - Example: `test_connection.py` contains:", "       - `TestHTTPConnection` (unit test for `HTTPConnection`) → C2", "       - `TestHTTPSConnection` (unit test for `HTTPSConnection`) → C2", "       - `test_full_request()` (integration test) → CN+1 (separate test commit)", "   - **Identify shared test infrastructure**:", "     - `conftest.py`, pytest fixtures → Commit 1", "     - Test server setup, mock objects → Commit 1", "", "**e) Analyze src/ code structure**:", "   - Use `git show {{target_commit}}:<file_path>` to examine file structure", "   - Identify logical boundaries (classes, functions, modules)", "   - Group related functionality for balanced commits", "", "###### 2. Planning Phase", "", "Create a detailed splitting plan based on src/ directory LOC balance:", "", "**a) Standard commit structure** ({{num_commits}} feature commits + optional 1 test commit):", "", "   **IMPORTANT**: At most ONE integration test commit allowed per original commit.", "", "   ```", "   Commit 1: Infrastructure + Test Infrastructure + First Feature Layer", "     ├─ Config files (CI, build, linting)", "     ├─ Test infrastructure (conftest.py, fixtures)", "     ├─ Src code: ~target_loc_per_commit", "     └─ Unit tests for this layer (if exist)", "", "   Commit 2 to N: Feature Layers (balanced by src/ LOC)", "     ├─ Src code: ~target_loc_per_commit each", "     └─ Unit tests for this layer (if exist)", "", "   Commit N+1: Integration Test Suite (if exists, at most ONE)", "     └─ All integration tests that require complete feature stack", "   ```", "", "**b) Test file allocation strategy**:", "", "   **CRITICAL PRINCIPLE**: Tests should follow the code they test whenever possible. A pure test commit should NEVER become a standalone milestone.", "", "   | Test Type | Allocation | Condition | Example |", "   |-----------|-----------|-----------|---------|", "   | **Test infrastructure** | Commit 1 | Always with first feature | `conftest.py`, fixtures |", "   | **Unit tests** | Same commit as src | Tests compile & run with that commit's code | `test_request.py` → with `request.py` |", "   | **Feature tests** | Same commit as src | Tests only need code from this commit | `test_connection.py` → with `connection.py` |", "   | **Integration tests** | `integration_test_commit` | Tests require code from multiple commits | Cross-module workflow tests |", "", "   **Decision flowchart for each test file**:", "   ```", "   For each test file:", "   1. Does it ONLY test code from a single feature commit?", "      YES → Include in that feature commit", "      NO → Continue to step 2", "", "   2. Can it compile and run with just one feature commit's code?", "      YES → Include in that feature commit", "      NO → Goes to integration_test_commit", "", "   3. Does it test cross-cutting functionality across multiple commits?", "      YES → Goes to integration_test_commit", "   ```", "", "   **How to verify test allocation**:", "   ```bash", "   # After creating feature commit N, verify its tests can run:", "   docker exec verify-split bash -c \"cd /testbed && \\", "     go test ./path/to/module/... -run TestXxx\"  # or pytest for Python", "", "   # If tests pass → correct allocation", "   # If tests fail due to missing code → move to integration_test_commit", "   ```", "", "   **How to identify test type**:", "   - Unit/Feature test (include with code): Tests single module, can run independently", "     ```python", "     from src.foo import FooClass", "     def test_foo_method(): ...  # Only tests FooClass, include with foo.py", "     ```", "   - Integration test (separate commit): Tests workflow across multiple modules", "     ```python", "     from src.connection import HTTPConnection  # From commit 2", "     from src.response import Response           # From commit 1", "     from src.fetch import fetch                 # From commit 3", "     def test_full_http_request(): ...  # Needs all commits, → integration_test_commit", "     ```", "", "**c) Src/ directory splitting plan**:", "   - Target: ~<target_loc_per_commit> LOC per commit", "   - Group by logical layers or features", "   - Example for 1102 LOC / 3 commits:", "     - Commit 1: Infrastructure + Core types + Response (330 LOC)", "     - Commit 2: Connection layer (359 LOC)", "     - Commit 3: Fetch layer (413 LOC)", "     - Commit 4: Integration tests (948 LOC)", "", "**d) Document your plan** including:", "   - Total commits to create (feature + test)", "   - Each commit's purpose and message", "   - Src LOC distribution", "   - Test allocation (unit vs integration)", "   - Which files need partial staging (`git add -p`)", "", "###### 3. Execution Phase", "", "Execute the split operation carefully:", "", "**a) Setup**:", "   ```bash", "   cd <repo dir>", "   git checkout {{target_commit}}", "   git checkout -b {{working_branch}}", "   ```", "", "**b) Prepare for splitting**:", "   ```bash", "   # Soft reset to parent (keeps all changes staged)", "   git reset --soft HEAD^", "", "   # Unstage all files", "   git reset", "   ```", "", "**c) Create Commit 1 (Infrastructure + Test Infrastructure + First Feature)**:", "   ```bash", "   # Add config/infrastructure files", "   git add .github/workflows/*.yml noxfile.py *.txt .eslintrc.yml", "", "   # Add test infrastructure", "   git add test/**/conftest.py", "", "   # Add first src/ layer", "   git add src/module/__init__.py src/module/core.py", "", "   # Add unit tests for first layer (if exist)", "   git add test/test_core.py", "", "   # Commit with detailed message", "   git commit -m \"$(cat <<'EOF'", "feat: add infrastructure, test setup, and core module", "", "Src changes:", "- Core module initialization and base classes (XXX LOC)", "- Response handling infrastructure (YYY LOC)", "", "Tests:", "- Test infrastructure (conftest.py with fixtures)", "- Unit tests for core module (if applicable)", "EOF", ")\"", "   ```", "", "**d) Create Commits 2-N (Feature Layers)**:", "   ```bash", "   # For each subsequent feature layer", "", "   # Add src/ files for this layer (complete or partial)", "   git add src/module/feature.py", "   # OR use git add -p for large files", "   git add -p src/module/large_file.py", "", "   # Add unit tests for this layer (if exist)", "   # If test file only contains tests for this layer:", "   git add test/test_feature.py", "", "   # If test file contains multiple test classes, use git add -p:", "   git add -p test/test_multiple.py  # Select only relevant test class", "", "   # Commit with detailed message", "   git commit -m \"$(cat <<'EOF'", "feat: implement feature layer X", "", "Src changes:", "- Feature X implementation (XXX LOC)", "- Helper utilities for feature X (YYY LOC)", "", "Tests:", "- Unit tests for feature X", "EOF", ")\"", "   ```", "", "**e) Create Commit N+1 (Integration Tests, if exist)**:", "", "   **IMPORTANT RULES**:", "   - ✅ **ONLY ONE** integration test commit allowed per original commit - this is a critical constraint", "   - ✅ **MUST be the LAST commit** on the branch", "   - ✅ Message must be self-contained (see format below)", "   - ✅ Integration test commit typically has **src_loc=0** (tests are outside source directories)", "", "   ```bash", "   # Add all integration test files", "   git add test/test_integration.py test/test_e2e.py", "", "   # Commit with detailed message", "   git commit -m \"$(cat <<'EOF'", "test: add comprehensive integration test suite", "", "Tests:", "- 29 integration tests covering complete workflows", "- HTTP/HTTPS requests, streaming, timeouts, error handling", "- Requires all feature commits (1-3) to run", "EOF", ")\"", "   ```", "", "**f) Tips for partial file staging**:", "   - Use `git add -p` to interactively select hunks", "   - Split at logical boundaries (function/class boundaries)", "   - When `git add -p` doesn't show good boundaries, use `git add -e` to manually edit", "   - Example: Split `test_connection.py` by test classes", "     ```bash", "     git add -p test/test_connection.py", "     # Select: TestHTTPConnection class → Commit 2", "     # Skip: TestHTTPSConnection class → Commit 3", "     ```", "", "**g) Commit Message Format Requirements**:", "", "   **CRITICAL**: Each commit message MUST be self-contained and follow this format:", "", "   **For feature commits**:", "   ```", "   feat: <concise summary>", "", "   Src changes:", "   - <Key feature 1> (<LOC count>)", "   - <Key feature 2> (<LOC count>)", "   - <Key classes/functions added>", "", "   Tests:", "   - <Unit tests included, if any>", "   - OR \"No unit tests (<reason>)\"", "   ```", "", "   **For integration test commit**:", "   ```", "   test: add comprehensive integration test suite", "", "   Tests:", "   - <Number> integration tests covering <scope>", "   - <Key test scenarios>", "   - Requires all feature commits (<range>) to run", "   ```", "", "**h) Verification after each commit**:", "   ```bash", "   git show --stat", "   git log --oneline -5", "", "   # Verify message format", "   git log -1 --format=%B", "   ```", "", "###### 4. Validation Phase", "", "After completing all commits, validate the results:", "", "**a) Verify tree SHA match (MOST IMPORTANT)**:", "", "   This is the **strongest validation** - if tree SHAs match, the splits are 100% identical to the original.", "", "   ```bash", "   # Compare tree objects", "   ORIG_TREE=$(git rev-parse {{target_commit}}^{tree})", "   SPLIT_TREE=$(git rev-parse {{working_branch}}^{tree})", "", "   if [ \"$ORIG_TREE\" = \"$SPLIT_TREE\" ]; then", "       echo \"✅ PERFECT MATCH - Tree SHA is identical\"", "   else", "       echo \"❌ Trees differ - investigation needed\"", "   fi", "   ```", "", "   **Note**: Tree SHA represents the entire working directory state. If they match, every file has exactly the same content, permissions, and path.", "", "**b) Check working tree is clean**:", "   ```bash", "   git status", "   ```", "", "###### 5. Compilation Verification Phase", "", "Skipped when the workspace has several repositories (see the workspace rules). Otherwise, after validating tree SHA match, verify that each split commit s successfully when patches are applied sequentially.", "", "**a) Setup container (once)**:", "   ```bash", "   WORKSPACE_ROOT=\"$(dirname \"{{repo_path}}\")\"", "   OUTPUT_DIR=\"$WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}\"", "", "   # Start container", "   docker run -d --name verify-split-{{target_commit}} {{base_image_name}} tail -f /dev/null", "", "   # Copy repository", "   docker exec verify-split-{{target_commit}} rm -rf /testbed", "   docker cp <repo dir> verify-split-{{target_commit}}:/testbed", "   docker exec verify-split-{{target_commit}} git config --global --add safe.directory /testbed", "   docker exec verify-split-{{target_commit}} git config --global user.email \"verify@test.local\"", "   docker exec verify-split-{{target_commit}} git config --global user.name \"Verify Bot\"", "", "   # Verify parent compiles (environment check)", "   docker exec verify-split-{{target_commit}} bash -c \"cd /testbed && \\", "     git checkout {{target_commit}}^ && \\", "     {{build_command}}\"", "   ```", "   If parent fails to compile, the environment is misconfigured - fix before proceeding.", "", "**b) Generate patches and verify** (repeat until success):", "   ```bash", "   # Define paths (in case running separately from step a)", "   WORKSPACE_ROOT=\"$(dirname \"{{repo_path}}\")\"", "   OUTPUT_DIR=\"$WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}\"", "", "   # Generate patches from host", "   mkdir -p \"$OUTPUT_DIR/patches\"", "   cd \"<repo dir>\"", "   COMMITS=($(git rev-list --reverse {{target_commit}}^..{{working_branch}}))", "   for commit in \"${COMMITS[@]}\"; do", "       commit_short=$(git rev-parse --short \"$commit\")", "       git format-patch -1 \"$commit\" --stdout > \"$OUTPUT_DIR/patches/${commit_short}.patch\"", "   done", "", "   # Reset container state and copy new patches", "   docker exec verify-split-{{target_commit}} bash -c \"cd /testbed && \\", "     git checkout {{target_commit}}^ && \\", "     git clean -fd && \\", "     git checkout -B verify-split\"", "   docker exec verify-split-{{target_commit}} rm -rf /tmp/patches", "   docker cp \"$OUTPUT_DIR/patches\" verify-split-{{target_commit}}:/tmp/patches", "", "   # Apply each patch in commit order (IMPORTANT: not alphabetical!)", "   for commit in \"${COMMITS[@]}\"; do", "     sha=$(git rev-parse --short \"$commit\")", "     patch_name=\"${sha}.patch\"", "", "     echo \"Testing patch $sha...\"", "     docker exec verify-split-{{target_commit}} bash -c \"cd /testbed && \\", "       git apply /tmp/patches/$patch_name && \\", "       {{build_command}} && \\", "       git add -A && git commit -m 'Applied $sha'\"", "", "     if [ $? -ne 0 ]; then", "       echo \"❌ Patch $sha failed - see 'Handling Failures' below\"", "       break", "     fi", "   done", "   ```", "", "**c) Verify final result**:", "   ```bash", "   docker exec verify-split-{{target_commit}} bash -c \"cd /testbed && git diff {{target_commit}} .\"", "   # Should produce empty output", "   ```", "", "**d) Cleanup container** (only after all verification passes):", "   ```bash", "   docker stop verify-split-{{target_commit}} && docker rm verify-split-{{target_commit}}", "   ```", "", "**Handling Compilation Failures**:", "", "Container stays running for fast iteration. When a patch fails:", "", "1. **Note the error** - record which patch failed and the compilation error", "2. **Fix on host** - return to `<repo dir>` and modify commits on `{{working_branch}}`:", "   - **Re-partition code** between commits to resolve dependencies", "   - **Merge commits** that have tightly coupled changes (`git rebase -i`)", "   - **Reorder commits** to ensure definitions appear before usages", "3. **Re-run Phase 4** - verify tree SHA still matches", "4. **Re-run step (b)** - container resets to parent and applies new patches", "", "The container is reused across iterations - only `git reset` + copy new patches, no container recreation.", "", "---", "", "##### Important Guidelines", "", "###### Technical Best Practices", "", "- **Use `git add -p` for partial file staging**: When a single file contains multiple logical changes", "- **Preserve atomic functionality**: Each commit should represent a complete, logical unit of change", "- **Handle binary files carefully**: Binary files cannot be partially staged", "- **Watch for ignored files**: Some files may need `git add -f` if they're in .gitignore", "", "###### Splitting Strategies", "", "**a) By layer/responsibility**:", "   - Infrastructure/configuration", "   - Type definitions/interfaces", "   - Core implementation", "   - Utilities/helpers", "   - Tests", "   - Documentation", "", "**b) By dependency order**:", "   - Base/foundation code first (with its tests)", "   - Dependent code later (with its tests)", "   - Test infrastructure (fixtures, conftest) can be separate if shared across modules", "", "**c) By feature components**:", "   - Each major feature or module as separate commits", "   - Shared/common code first", "", "###### Quality Checks", "", "- Each commit should be understandable independently", "- **Commit message requirements** (CRITICAL):", "  - ✅ Self-contained with \"Src changes\" and \"Tests\" sections", "  - ✅ Include LOC counts for major features", "  - ✅ Explain test status (unit tests included or not, and why)", "  - ✅ For test commit: state dependencies on feature commits", "  - ❌ No vague messages like \"feat: implement feature\"", "- Related file changes should stay together", "- Src/ LOC should be relatively balanced across feature commits", "- **Test commit rules** (CRITICAL):", "  - ✅ Maximum ONE integration test commit per original commit - strict constraint", "  - ✅ MUST be the LAST commit on branch", "  - ✅ Message must explain test coverage and dependencies", "  - ✅ Integration test commit typically has src_loc=0 (tests outside source directories)", "  - ❌ No multiple test commits", "  - ❌ No test commit in the middle of feature commits", "", "---", "", "##### Final Output:", "", "After completing the split and compilation verification, finalize the output artifacts.", "", "**Note**: Patches were already generated during Phase 5 (Compilation Verification). This section focuses on generating METADATA.json and analyzing dependencies.", "", "###### Output Directory Structure", "", "**IMPORTANT**: Output MUST be created at `WORKSPACE_ROOT/stage4_decomp/output/commit_splits/`, NOT inside `repo_data/`.", "", "- **Working Branch**: `{{working_branch}}` (e.g., `split-1812eac`)", "- **Output Directory**: `WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}/`", "", "Create the following directory structure:", "", "```", "WORKSPACE_ROOT/", "├── repo_data/                         # Git repository (DO NOT create output here!)", "└── stage4_decomp/", "    └── output/", "        └── commit_splits/", "            └── {{working_branch}}/    # e.g., split-1812eac/", "                ├── METADATA.json      # Machine-readable metadata", "                └── patches/           # Patch files directory", "                    ├── <sha_1>.patch  # Named by 7-char commit SHA", "                    ├── <sha_2>.patch", "                    └── ...", "```", "", "**Example**: For commit `1812eac` with `repo_path=/data/trial/project/repo_data`:", "- WORKSPACE_ROOT: `/data/trial/project`", "- Branch name: `split-1812eac`", "- Output path: `/data/trial/project/stage4_decomp/output/commit_splits/split-1812eac/`", "", "This is the minimal, essential output. No additional documentation or scripts needed.", "", "###### Required Steps", "", "**a) Verify patches exist** (generated in Phase 5):", "", "```bash", "WORKSPACE_ROOT=\"$(dirname \"{{repo_path}}\")\"", "OUTPUT_DIR=\"$WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}\"", "", "ls -la \"$OUTPUT_DIR/patches/\"", "# Should show all .patch files generated during Phase 5", "```", "", "**b) Generate METADATA.json**:", "", "Use the automated script to generate structured metadata:", "", "```bash", "# Use the same absolute path approach", "WORKSPACE_ROOT=\"$(dirname \"{{repo_path}}\")\"", "REPO_PATH=\"<repo dir>\"   # the split repository", "OUTPUT_DIR=\"$WORKSPACE_ROOT/stage4_decomp/output/commit_splits/{{working_branch}}\"", "", "cd \"$REPO_PATH\"", "git checkout {{working_branch}}", "", "# Run the metadata generation script with absolute paths", "python \"$WORKSPACE_ROOT/deepcommit/tools/milestone_balancing/generate_split_metadata.py\" \\", "    --repo-path \"$REPO_PATH\" \\", "    --branch-name {{working_branch}} \\", "    --repo-src-dirs {{repo_src_dirs}} \\", "    --exclude-patterns \"{{exclude_patterns}}\" \\", "    --output-dir \"$OUTPUT_DIR\"", "", "# Verify output was created in correct location", "if [[ -f \"$OUTPUT_DIR/METADATA.json\" ]]; then", "    echo \"✅ METADATA.json created at: $OUTPUT_DIR/METADATA.json\"", "else", "    echo \"❌ ERROR: METADATA.json not found at expected location!\"", "    exit 1", "fi", "```", "", "The script will automatically:", "- Analyze all commits on the branch", "- Separate src commits from integration test commit (at most ONE)", "- Calculate source directory LOC statistics for each commit (respecting exclude patterns)", "- Generate METADATA.json in the format expected by Main Agent (see Main Agent prompt for complete schema)", "", "**METADATA.json format** (MUST follow this exact structure - Main Agent expects `split_result.src_commits`):", "", "⚠️ **IMPORTANT**: Always use `split_result.src_commits`, NOT top-level `commits` or `split_commits`. This is the standardized format.", "", "```json", "{", "  \"original_commit\": {", "    \"sha\": \"1812eac36019be19cb02f181aa21d133ba9fe219\",", "    \"short_sha\": \"1812eac\",", "    \"message\": \"Original commit message\",", "    \"...\": \"...\"", "  },", "  \"split_result\": {", "    \"src_commits\": [", "      {", "        \"sha\": \"abc123d...\",", "        \"short_sha\": \"abc123d\",", "        \"message\": \"feat: ...\",", "        \"src_stats\": {\"total_loc\": 401},", "        \"patch_file\": \"patches/abc123d.patch\",", "        \"files\": [\"src/module/file1.py\", \"src/module/file2.py\"]", "      }", "    ],", "    \"integration_test_commit\": {", "      \"sha\": \"test123...\",", "      \"short_sha\": \"test123\",", "      \"message\": \"test: ...\",", "      \"src_stats\": {\"total_loc\": 0},", "      \"patch_file\": \"patches/test123.patch\"", "    },", "    \"dependency_edges\": [", "      [\"abc123d\", \"def456e\"]", "    ]", "  }", "}", "```", "", "**Field naming conventions** (use consistently):", "- Use `sha` for full commit hash, `short_sha` for 7-char hash", "- `src_commits` MUST be inside `split_result`, never at top level", "- `integration_test_commit`: May be null; at most ONE per original commit", "- `dependency_edges`: Format [source, target] means target depends on source", "", "**Field explanations**:", "- Commit `src_loc` is `src_stats.total_loc` (additions + deletions in source directories only), excluding files matching exclude patterns. Calculated by the metadata script respecting `{{repo_src_dirs}}` and `{{exclude_patterns}}` parameters.", "- Integration test commit typically has `src_loc=0` since tests are outside source directories", "- `dependency_edges`: **Format [source, target] means target depends on source**. Edge direction: source → target (target depends on source).", "", "Output:", "```", "✅ Generated metadata: $OUTPUT_DIR/METADATA.json", "   - Src commits: N", "   - Integration test commit: Yes/No", "```", "", "The script generates METADATA.json with an empty `dependency_edges` array.", "", "**c) Analyze and populate dependency_edges**:", "", "After generating METADATA.json, analyze actual code dependencies between split commits and populate `split_result.dependency_edges[]`:", "", "**Add a dependency edge [A, B] (B depends on A) ONLY when**:", "- Commit B imports/calls symbols (classes, functions, constants) newly defined in commit A", "- Commit B modifies code regions that commit A also modifies (overlapping hunks)", "- Commit B's functionality logically requires commit A's changes to exist first", "", "**Do NOT add edge when**:", "- Commits modify different files with no code relationship", "- The only reason is \"A was created before B\" (generation order ≠ code dependency)", "- Commits are functionally independent (e.g., A adds `auth.py`, B adds `cache.py` with no shared code)", "", "```bash", "# Edit METADATA.json to add actual dependencies", "vim \"$OUTPUT_DIR/METADATA.json\"", "", "# Format: [source_sha, target_sha] means target depends on source", "# Example: [\"abc123d\", \"def456e\"] means commit def456e depends on commit abc123d", "# Edge direction: source -> target (target depends on source)", "```", "", "**Analysis steps**:", "1. For each pair of commits, check if later commit imports/uses symbols from earlier commit", "2. Check for overlapping file modifications", "3. Only add edges where real code dependency exists", "4. Result may be: linear chain, partial dependencies, or no dependencies (all independent)", "", "---", "", "##### Notes", "", "- **Safety**: Always work on a new branch, never modify the original commit directly", "- **Autonomy**: The agent should make intelligent decisions based on code analysis, not just follow rigid rules", "- **Flexibility**: Adjust the plan if unexpected issues arise during execution", "- **Documentation**: Provide clear rationale for all major decisions", "", "---", "", "##### Success Criteria", "", "✅ All changes from the original commit are preserved (tree SHA match)", "✅ All patches compile successfully when applied sequentially (when compilation verification applies)", "✅ Created {{num_commits}} feature commits with balanced src/ LOC", "✅ Each commit has clear, focused purpose (indicated in message)", "✅ Src/ directory LOC is relatively balanced across feature commits", "✅ Test infrastructure in Commit 1", "✅ Unit tests paired with corresponding src code", "✅ At most ONE integration test commit (if exists, must be last commit)", "✅ Working tree is clean after completion", "✅ No empty commits created", "", "---", "", "**End of Subagent Prompt Template**"], "ops": [["equal", 0, 15, 0, 15], ["insert", 15, 15, 15, 31], ["equal", 15, 21, 31, 37], ["replace", 21, 22, 37, 38], ["equal", 22, 24, 38, 40], ["replace", 24, 25, 40, 41], ["equal", 25, 27, 41, 43], ["replace", 27, 29, 43, 45], ["equal", 29, 188, 45, 204], ["replace", 188, 189, 204, 205], ["equal", 189, 362, 205, 378], ["replace", 362, 363, 378, 379], ["equal", 363, 374, 379, 390], ["replace", 374, 375, 390, 391], ["equal", 375, 394, 391, 410], ["replace", 394, 395, 410, 411], ["equal", 395, 443, 411, 459], ["replace", 443, 444, 459, 460], ["equal", 444, 557, 460, 573], ["replace", 557, 559, 573, 575], ["equal", 559, 687, 575, 703], ["replace", 687, 688, 703, 704], ["equal", 688, 700, 704, 716]], "add": 28, "del": 12}, {"what": ["Added the workspace section.", "Per-group src_loc is per repo, summed, and the size balance is judged on the sum.", "Candidate groups keep hard cross-repo links together; soft links may be cut.", "Each proposed group reports its repos and must meet the 2-repo rule."], "why": "Single-repo runs are just a workspace with one repo, so one multi-repo prompt is enough.", "rewritten": true, "id": "milestone-deep-analysis-subagent-md", "path": "deepcommit/pipeline/prompts/stage_breakdown_v1/milestone_deep_analysis_subagent.md", "name": "milestone_deep_analysis_subagent.md", "group": "Phase 2: milestone stages", "note": "Stage 4 deep-analysis sub-agent. Rewritten multi-repo only: per-repo src_loc summed, hard xrepo edges stay in one group, cross-repo validity, repos per group.", "status": "modified", "old": ["# Deep Dependency Analysis for Complex Milestone", "", "## Task", "", "Analyze milestone **{milestone_id}** for splitting feasibility. This milestone has **{num_commits} commits** and **{src_loc} src_loc**, making it a dominant contributor to CV imbalance.", "", "**Your goal**: Determine if and how this milestone can be split while maintaining DAG validity.", "", "## Input", "", "- **Milestone ID**: `{milestone_id}`", "- **Commits**: `{commits}` (semicolon-separated)", "- **Current src_loc**: `{src_loc}`", "- **Mean src_loc**: `{mean_src_loc}`", "- **Commit DAG path**: `{commit_dag_path}`", "- **Milestone CSV**: `{milestone_csv}`", "- **Dependencies CSV**: `{dependencies_csv}`", "", "## Analysis Steps", "", "### Step 1: Build Internal Dependency Graph", "", "Use the commit DAG to map all dependencies WITHIN this milestone:", "", "```", "For each commit pair (A, B) in milestone:", "  - Check if A is ancestor of B in commit DAG", "  - Check if A and B modify overlapping files", "  - Record: A -> B if dependency exists", "```", "", "**Output**: Internal dependency edges list", "", "### Step 2: Classify Commits by Functional Theme", "", "For each commit, determine its primary function:", "", "1. Read commit message and changed files via `{get_commit_context}(sha, expand=['files', 'diff'])`", "2. Classify into themes based on:", "   - **Module/directory**: Which source directories are touched", "   - **Feature type**: Infrastructure, API, UI, tests, refactoring, bugfix", "   - **Semantic purpose**: What the commit accomplishes", "", "**Output**: `commit_classifications` mapping each commit to theme(s)", "", "### Step 3: Identify Candidate Groupings", "", "Based on classifications, propose 2-4 grouping strategies:", "", "**Strategy A**: Group by primary module/directory", "**Strategy B**: Group by feature theme (PREFERRED - produces semantically coherent sub-milestones with clear functional descriptions like \"Tags System Revamp\" rather than generic \"maint, fix, enh changes\")", "**Strategy C**: Group by code dependency relationships (topological ordering - commits that share imports, function calls, or data structures stay together)", "**Strategy D**: Extract independent commits, keep coupled core", "", "⚠️ **AVOID chronological grouping** (splitting by timestamp) unless all other strategies fail. Chronological splitting fragments semantically related commits across time slices, producing sub-milestones with vague descriptions.", "", "For each strategy, define:", "```json", "{", "  \"strategy\": \"A\",", "  \"groups\": [", "    {\"name\": \"group_1\", \"commits\": [\"sha1\", \"sha2\"], \"src_loc\": 5000},", "    {\"name\": \"group_2\", \"commits\": [\"sha3\", \"sha4\"], \"src_loc\": 4500}", "  ]", "}", "```", "", "### Step 4: Validate Each Grouping for DAG Cycles", "", "For each proposed grouping, simulate the split and check for cycles:", "", "1. **Internal cycles**: Would sub-milestones have circular dependencies?", "   - If group_1 commit depends on group_2 commit AND group_2 commit depends on group_1 commit → CYCLE", "", "2. **External cycles (enriched)**: Would sub-milestones create cycles with OTHER milestones?", "   - Use `{analyze_dag_conflicts}` with simulated milestone/dependency CSVs", "   - Check `enriched_cycles` in result", "", "**For each grouping**, record:", "```json", "{", "  \"strategy\": \"A\",", "  \"internal_cycles\": [],", "  \"external_cycles\": [\"M1_sub-01 -> M2 -> M1_sub-02 -> M1_sub-01\"],", "  \"blocking_commits\": [\"sha5 in group_1 depends on sha6 in group_2\"],", "  \"is_valid\": false", "}", "```", "", "### Step 5: Attempt Cycle Resolution", "", "If a promising grouping has cycles, try to resolve:", "", "1. **Identify boundary commits**: Commits that cause cross-group dependencies", "2. **Evaluate moving boundary commits**:", "   - What if commit X moves from group_1 to group_2?", "   - Would this break the cycle without creating new ones?", "3. **Consider merging small groups**: If two groups are tightly coupled, merge them", "", "**Key insight**: Often 1-3 commits are the \"linchpin\" causing cycles. Moving them can unlock the split.", "", "### Step 6: Generate Recommendation", "", "Based on analysis, output ONE of:", "", "**SPLIT_RECOMMENDED**:", "```json", "{", "  \"recommendation\": \"SPLIT_RECOMMENDED\",", "  \"strategy\": \"A (modified)\",", "  \"sub_milestones\": [", "    {\"id\": \"{milestone_id}_sub-01\", \"commits\": [...], \"src_loc\": 5000, \"theme\": \"...\"},", "    {\"id\": \"{milestone_id}_sub-02\", \"commits\": [...], \"src_loc\": 4500, \"theme\": \"...\"}", "  ],", "  \"internal_dependencies\": [\"{milestone_id}_sub-01 -> {milestone_id}_sub-02\"],", "  \"confidence\": 0.85,", "  \"notes\": \"Clean split by module boundaries\"", "}", "```", "", "**PARTIAL_SPLIT**:", "```json", "{", "  \"recommendation\": \"PARTIAL_SPLIT\",", "  \"extractable_group\": {\"commits\": [...], \"src_loc\": 3000, \"theme\": \"...\"},", "  \"remaining_core\": {\"commits\": [...], \"src_loc\": 12000},", "  \"reason\": \"Core commits too coupled, but infrastructure can be extracted\",", "  \"confidence\": 0.7", "}", "```", "", "**SPLIT_NOT_RECOMMENDED**:", "```json", "{", "  \"recommendation\": \"SPLIT_NOT_RECOMMENDED\",", "  \"reason\": \"All 122 commits form a single tightly-coupled development chain\",", "  \"blocking_analysis\": {", "    \"primary_coupling\": \"Commits modify same 5 core files throughout\",", "    \"cycle_sources\": [\"Every grouping creates enriched cycles via commit DAG\"],", "    \"attempted_resolutions\": [\"Tried moving boundary commits - creates new cycles\"]", "  },", "  \"alternative_suggestion\": \"Consider merging with related small milestones instead\"", "}", "```", "", "## Output Format", "", "Return a single JSON object with your complete analysis:", "", "```json", "{", "  \"milestone_id\": \"{milestone_id}\",", "  \"analysis_summary\": {", "    \"total_commits\": 122,", "    \"total_src_loc\": 17702,", "    \"internal_dependencies_count\": 45,", "    \"functional_themes_identified\": [\"core\", \"api\", \"utils\"]", "  },", "  \"grouping_evaluations\": [", "    {\"strategy\": \"A\", \"is_valid\": false, \"blocking_reason\": \"...\"},", "    {\"strategy\": \"B\", \"is_valid\": true, \"groups\": [...]}", "  ],", "  \"recommendation\": { ... },", "  \"confidence\": 0.85", "}", "```", "", "## Important Notes", "", "- **Do NOT give up early**: Explore at least 3 grouping strategies before concluding \"cannot split\"", "- **Be specific**: If cycles exist, name the exact commits and edges causing them", "- **Consider partial wins**: Extracting even 20-30% of src_loc helps CV", "- **Document attempts**: Show what you tried, even if it failed"], "new": ["# Deep Dependency Analysis for Complex Milestone", "", "## Task", "", "Analyze milestone **{milestone_id}** for splitting feasibility. This milestone has **{num_commits} commits** and **{src_loc} src_loc**, making it a dominant contributor to CV imbalance.", "", "**Your goal**: Determine if and how this milestone can be split while maintaining DAG validity.", "", "## Input", "", "- **Milestone ID**: `{milestone_id}`", "- **Commits**: `{commits}` (semicolon-separated)", "- **Current src_loc**: `{src_loc}`", "- **Mean src_loc**: `{mean_src_loc}`", "- **Commit DAG path**: `{commit_dag_path}`", "- **Milestone CSV**: `{milestone_csv}`", "- **Dependencies CSV**: `{dependencies_csv}`", "", "### Workspace `{{workspace_id}}`", "", "This run covers a workspace of one or more repositories that are developed together:", "", "{{workspace_repos_table}}", "", "- Inspect code with `git -C repo_data/<repo> ...` (the `repo dir` column of the table; for a one-repo workspace that is `repo_data` itself). The MCP git tools route to the correct repository automatically.", "- Commit ids are bare 7-character SHAs, unique inside the workspace. A commit's repository is its `repo` field in the commit records or its entry in `commit_repos` (`commit_repos.json`). Never guess it from the SHA and never run `git` against the wrong repository.", "- With more than one repository, every file path in merged data is prefixed `<repo>/<path-in-repo>`; strip the prefix before passing a path to `git -C repo_data/<repo>`.", "- Edges in `commit_dag.json` come in two groups. `edges_dag` holds per-repository textual edges plus HARD cross-repo edges (`\"xrepo\": true`, `edge_types` such as `xrepo_contract`, `xrepo_pin`, `xrepo_pr_link`). `edges_soft` holds heuristic hints (for example time proximity): never enforced, and you may cut them.", "", "**Workspace rules**:", "- `src_loc` values are per-repository `src_loc` (that repository's source prefixes) summed over the milestone; give per-group `src_loc` the same way and judge the CV on the sum.", "- Group candidates must keep HARD cross-repo edges (`\"xrepo\": true`) inside one group; never split a contract change from its first consumer. Soft edges (`edges_soft`) are hints and may be cut.", "- A group or milestone that spans repositories must change at least 2 repositories, and no single repository's part alone may be a complete feature; report the `repos` of every proposed group.", "- Cycle checks use textual edges and hard xrepo edges only.", "", "---", "", "## Analysis Steps", "", "### Step 1: Build Internal Dependency Graph", "", "Use the commit DAG to map all dependencies WITHIN this milestone:", "", "```", "For each commit pair (A, B) in milestone:", "  - Check if A is ancestor of B in commit DAG", "  - Check if A and B modify overlapping files", "  - Record: A -> B if dependency exists", "```", "", "**Output**: Internal dependency edges list", "", "### Step 2: Classify Commits by Functional Theme", "", "For each commit, determine its primary function:", "", "1. Read commit message and changed files via `{get_commit_context}(sha, expand=['files', 'diff'])`", "2. Classify into themes based on:", "   - **Module/directory**: Which source directories are touched", "   - **Feature type**: Infrastructure, API, UI, tests, refactoring, bugfix", "   - **Semantic purpose**: What the commit accomplishes", "", "**Output**: `commit_classifications` mapping each commit to theme(s)", "", "### Step 3: Identify Candidate Groupings", "", "Based on classifications, propose 2-4 grouping strategies:", "", "**Strategy A**: Group by primary module/directory", "**Strategy B**: Group by feature theme (PREFERRED - produces semantically coherent sub-milestones with clear functional descriptions like \"Tags System Revamp\" rather than generic \"maint, fix, enh changes\")", "**Strategy C**: Group by code dependency relationships (topological ordering - commits that share imports, function calls, or data structures stay together)", "**Strategy D**: Extract independent commits, keep coupled core", "", "⚠️ **AVOID chronological grouping** (splitting by timestamp) unless all other strategies fail. Chronological splitting fragments semantically related commits across time slices, producing sub-milestones with vague descriptions.", "", "For each strategy, define:", "```json", "{", "  \"strategy\": \"A\",", "  \"groups\": [", "    {\"name\": \"group_1\", \"commits\": [\"sha1\", \"sha2\"], \"src_loc\": 5000, \"repos\": [\"contract\", \"sdk\"]},", "    {\"name\": \"group_2\", \"commits\": [\"sha3\", \"sha4\"], \"src_loc\": 4500, \"repos\": [\"sdk\"]}", "  ]", "}", "```", "", "### Step 4: Validate Each Grouping for DAG Cycles", "", "For each proposed grouping, simulate the split and check for cycles:", "", "1. **Internal cycles**: Would sub-milestones have circular dependencies?", "   - If group_1 commit depends on group_2 commit AND group_2 commit depends on group_1 commit → CYCLE", "", "2. **External cycles (enriched)**: Would sub-milestones create cycles with OTHER milestones?", "   - Use `{analyze_dag_conflicts}` with simulated milestone/dependency CSVs", "   - Check `enriched_cycles` in result", "", "**For each grouping**, record:", "```json", "{", "  \"strategy\": \"A\",", "  \"internal_cycles\": [],", "  \"external_cycles\": [\"M1_sub-01 -> M2 -> M1_sub-02 -> M1_sub-01\"],", "  \"blocking_commits\": [\"sha5 in group_1 depends on sha6 in group_2\"],", "  \"is_valid\": false", "}", "```", "", "### Step 5: Attempt Cycle Resolution", "", "If a promising grouping has cycles, try to resolve:", "", "1. **Identify boundary commits**: Commits that cause cross-group dependencies", "2. **Evaluate moving boundary commits**:", "   - What if commit X moves from group_1 to group_2?", "   - Would this break the cycle without creating new ones?", "3. **Consider merging small groups**: If two groups are tightly coupled, merge them", "", "**Key insight**: Often 1-3 commits are the \"linchpin\" causing cycles. Moving them can unlock the split.", "", "### Step 6: Generate Recommendation", "", "Based on analysis, output ONE of:", "", "**SPLIT_RECOMMENDED**:", "```json", "{", "  \"recommendation\": \"SPLIT_RECOMMENDED\",", "  \"strategy\": \"A (modified)\",", "  \"sub_milestones\": [", "    {\"id\": \"{milestone_id}_sub-01\", \"commits\": [...], \"src_loc\": 5000, \"theme\": \"...\"},", "    {\"id\": \"{milestone_id}_sub-02\", \"commits\": [...], \"src_loc\": 4500, \"theme\": \"...\"}", "  ],", "  \"internal_dependencies\": [\"{milestone_id}_sub-01 -> {milestone_id}_sub-02\"],", "  \"confidence\": 0.85,", "  \"notes\": \"Clean split by module boundaries\"", "}", "```", "", "**PARTIAL_SPLIT**:", "```json", "{", "  \"recommendation\": \"PARTIAL_SPLIT\",", "  \"extractable_group\": {\"commits\": [...], \"src_loc\": 3000, \"theme\": \"...\"},", "  \"remaining_core\": {\"commits\": [...], \"src_loc\": 12000},", "  \"reason\": \"Core commits too coupled, but infrastructure can be extracted\",", "  \"confidence\": 0.7", "}", "```", "", "**SPLIT_NOT_RECOMMENDED**:", "```json", "{", "  \"recommendation\": \"SPLIT_NOT_RECOMMENDED\",", "  \"reason\": \"All 122 commits form a single tightly-coupled development chain\",", "  \"blocking_analysis\": {", "    \"primary_coupling\": \"Commits modify same 5 core files throughout\",", "    \"cycle_sources\": [\"Every grouping creates enriched cycles via commit DAG\"],", "    \"attempted_resolutions\": [\"Tried moving boundary commits - creates new cycles\"]", "  },", "  \"alternative_suggestion\": \"Consider merging with related small milestones instead\"", "}", "```", "", "## Output Format", "", "Return a single JSON object with your complete analysis:", "", "```json", "{", "  \"milestone_id\": \"{milestone_id}\",", "  \"analysis_summary\": {", "    \"total_commits\": 122,", "    \"total_src_loc\": 17702,", "    \"internal_dependencies_count\": 45,", "    \"functional_themes_identified\": [\"core\", \"api\", \"utils\"]", "  },", "  \"grouping_evaluations\": [", "    {\"strategy\": \"A\", \"is_valid\": false, \"blocking_reason\": \"...\"},", "    {\"strategy\": \"B\", \"is_valid\": true, \"groups\": [...]}", "  ],", "  \"recommendation\": { ... },", "  \"confidence\": 0.85", "}", "```", "", "## Important Notes", "", "- **Do NOT give up early**: Explore at least 3 grouping strategies before concluding \"cannot split\"", "- **Be specific**: If cycles exist, name the exact commits and edges causing them", "- **Consider partial wins**: Extracting even 20-30% of src_loc helps CV", "- **Document attempts**: Show what you tried, even if it failed"], "ops": [["equal", 0, 17, 0, 17], ["insert", 17, 17, 17, 36], ["equal", 17, 61, 36, 80], ["replace", 61, 63, 80, 82], ["equal", 63, 173, 82, 192]], "add": 21, "del": 2}, {"what": ["Added the workspace table.", "Only the repo that holds the split commit is verified.", "If the milestone spans several repos, this check is skipped and reported as skipped."], "why": "Single-repo runs are just a workspace with one repo, so one multi-repo prompt is enough.", "rewritten": true, "id": "verify-split-compilation-md", "path": "deepcommit/pipeline/prompts/stage_breakdown_v1/verify_split_compilation.md", "name": "verify_split_compilation.md", "group": "Phase 2: milestone stages", "note": "Stage 4. Rewritten multi-repo only: workspace table, verify only the split commit's repo, skipped for milestones that span repos.", "status": "modified", "old": ["# Verify Commit-Split Compilation", "", "## Objective", "", "Verify that a commit-split (multiple subcommits) compiles successfully when patches are applied sequentially, and the final result matches the original commit.", "", "## Inputs", "", "- `{{base_image_name}}` - Docker image with compilation environment", "- `{{original_commit}}` - The commit being split (e.g., `00c83af`)", "- `{{repo_data_path}}` - Path to repository data on host (e.g., `/path/to/repo_data`)", "- `{{split_dir}}` - Path to split directory (e.g., `/path/to/split-00c83af`)", "", "## Environment Setup", "", "### 1. Start Container", "```bash", "docker run -d --name verify-split-{{original_commit}} {{base_image_name}} tail -f /dev/null", "```", "", "### 2. Copy Repository Data", "```bash", "docker exec verify-split-{{original_commit}} rm -rf /testbed", "docker cp {{repo_data_path}} verify-split-{{original_commit}}:/testbed", "```", "", "### 3. Configure Git", "```bash", "docker exec verify-split-{{original_commit}} git config --global --add safe.directory /testbed", "```", "", "### 4. Verify Parent Compiles (Environment Check)", "```bash", "docker exec verify-split-{{original_commit}} bash -c \"cd /testbed && \\", "  git checkout {{original_commit}}^ && \\", "  go build ./cmd/...\"", "```", "If this fails, fix environment issues before proceeding.", "", "## Verification Steps", "", "### 1. Create Test Branch from Parent", "```bash", "docker exec verify-split-{{original_commit}} bash -c \"cd /testbed && \\", "  git checkout {{original_commit}}^ && \\", "  git checkout -B verify-split\"", "```", "", "### 2. Copy Patches into Container", "```bash", "docker cp {{split_dir}}/patches verify-split-{{original_commit}}:/tmp/patches", "```", "", "### 3. Apply and Test Each Patch (in order)", "```bash", "docker exec verify-split-{{original_commit}} bash -c \"cd /testbed && \\", "  git apply /tmp/patches/<sha>.patch && \\", "  go build ./cmd/... && \\", "  git add -A && git commit -m 'Applied <sha>'\"", "```", "", "### 4. Verify Final Result", "```bash", "docker exec verify-split-{{original_commit}} bash -c \"cd /testbed && git diff {{original_commit}} .\"", "# Should produce empty output", "```", "", "### 5. Cleanup", "```bash", "docker stop verify-split-{{original_commit}} && docker rm verify-split-{{original_commit}}", "```", "", "## Handling Compilation Failures", "", "If a patch fails to compile, analyze the error and fix the split. You have full autonomy to:", "", "- **Re-partition code** between patches to resolve dependencies", "- **Merge patches** that have tightly coupled changes", "- **Reorder patches** to ensure definitions come before usages", "- **Regenerate patches** after restructuring commits", "", "The goal is to produce a valid split where every intermediate state compiles. Iterate until all patches pass, then verify the final result matches the original commit.", "", "## Success Criteria", "", "- Parent commit compiles (environment verified)", "- All patches apply cleanly", "- Build succeeds after each patch", "- Final diff against original is empty"], "new": ["# Verify Commit-Split Compilation", "", "## Objective", "", "Verify that a commit-split (multiple subcommits) compiles successfully when patches are applied sequentially, and the final result matches the original commit.", "", "## Inputs", "", "- `{{base_image_name}}` - Docker image with compilation environment", "- `{{original_commit}}` - The commit being split (e.g., `00c83af`)", "- `{{repo_data_path}}` - Path to repository data on host (e.g., `/path/to/repo_data`)", "- `{{split_dir}}` - Path to split directory (e.g., `/path/to/split-00c83af`)", "", "### Workspace `{{workspace_id}}`", "", "{{workspace_repos_table}}", "", "The commit being split belongs to exactly one repository, and `{{repo_data_path}}` must point to that repository's checkout (the `repo dir` column of the table); verify only that repository. Compilation is verified only for a one-repo workspace. If the split commit's milestone spans several repositories, skip this verification and report \"skipped (multi-repo milestone)\" instead of failing.", "", "## Environment Setup", "", "### 1. Start Container", "```bash", "docker run -d --name verify-split-{{original_commit}} {{base_image_name}} tail -f /dev/null", "```", "", "### 2. Copy Repository Data", "```bash", "docker exec verify-split-{{original_commit}} rm -rf /testbed", "docker cp {{repo_data_path}} verify-split-{{original_commit}}:/testbed", "```", "", "### 3. Configure Git", "```bash", "docker exec verify-split-{{original_commit}} git config --global --add safe.directory /testbed", "```", "", "### 4. Verify Parent Compiles (Environment Check)", "```bash", "docker exec verify-split-{{original_commit}} bash -c \"cd /testbed && \\", "  git checkout {{original_commit}}^ && \\", "  go build ./cmd/...\"", "```", "If this fails, fix environment issues before proceeding.", "", "## Verification Steps", "", "### 1. Create Test Branch from Parent", "```bash", "docker exec verify-split-{{original_commit}} bash -c \"cd /testbed && \\", "  git checkout {{original_commit}}^ && \\", "  git checkout -B verify-split\"", "```", "", "### 2. Copy Patches into Container", "```bash", "docker cp {{split_dir}}/patches verify-split-{{original_commit}}:/tmp/patches", "```", "", "### 3. Apply and Test Each Patch (in order)", "```bash", "docker exec verify-split-{{original_commit}} bash -c \"cd /testbed && \\", "  git apply /tmp/patches/<sha>.patch && \\", "  go build ./cmd/... && \\", "  git add -A && git commit -m 'Applied <sha>'\"", "```", "", "### 4. Verify Final Result", "```bash", "docker exec verify-split-{{original_commit}} bash -c \"cd /testbed && git diff {{original_commit}} .\"", "# Should produce empty output", "```", "", "### 5. Cleanup", "```bash", "docker stop verify-split-{{original_commit}} && docker rm verify-split-{{original_commit}}", "```", "", "## Handling Compilation Failures", "", "If a patch fails to compile, analyze the error and fix the split. You have full autonomy to:", "", "- **Re-partition code** between patches to resolve dependencies", "- **Merge patches** that have tightly coupled changes", "- **Reorder patches** to ensure definitions come before usages", "- **Regenerate patches** after restructuring commits", "", "The goal is to produce a valid split where every intermediate state compiles. Iterate until all patches pass, then verify the final result matches the original commit.", "", "## Success Criteria", "", "- Parent commit compiles (environment verified)", "- All patches apply cleanly", "- Build succeeds after each patch", "- Final diff against original is empty"], "ops": [["equal", 0, 12, 0, 12], ["insert", 12, 12, 12, 18], ["equal", 12, 89, 18, 95]], "add": 6, "del": 0}, {"what": ["Code, not a prompt. Adds the {{#if var}} ... {{/if}} syntax to the renderer.", "Kept for other templates. No Phase 2 prompt and not the SRS template uses it now."], "why": "Other templates may still want conditional blocks.", "rewritten": null, "id": "template-py", "path": "deepcommit/pipeline/utils/template.py", "name": "template.py", "group": "Renderer", "note": "Code, not a prompt. Renderer code, not a prompt. Keeps its conditional-block syntax for other templates; no Phase 2 prompt uses it.", "status": "modified", "old": ["\"\"\"Template rendering utilities for string and JSON template substitution.\"\"\"", "", "from __future__ import annotations", "", "import re", "from typing import Any, Dict", "", "", "def render_template_string(template: str, variables: Dict[str, str]) -> str:", "    \"\"\"Render a template string by replacing {{variable}} placeholders.", "", "    Args:", "        template: Template string with {{variable}} placeholders", "        variables: Dict mapping variable names to replacement values", "", "    Returns:", "        Rendered string with placeholders replaced", "", "    Example:", "        >>> render_template_string(\"Hello {{name}}!\", {\"name\": \"World\"})", "        'Hello World!'", "    \"\"\"", "", "    def replace_var(match):", "        var_name = match.group(1).strip()", "        return str(variables.get(var_name, match.group(0)))", "", "    # Replace {{variable}} with actual values", "    return re.sub(r\"\\{\\{\\s*([a-zA-Z0-9_]+)\\s*\\}\\}\", replace_var, template)", "", "", "def render_template_recursive(obj: Any, variables: Dict[str, str]) -> Any:", "    \"\"\"Recursively render templates in a nested data structure.", "", "    Walks through dicts, lists, and strings, replacing {{variable}} placeholders", "    in all string values.", "", "    Args:", "        obj: Data structure to render (can be dict, list, str, or primitive types)", "        variables: Dict mapping variable names to replacement values", "", "    Returns:", "        Rendered data structure with all placeholders replaced", "", "    Example:", "        >>> data = {", "        ...     \"path\": \"{{BASE}}/data\",", "        ...     \"config\": {", "        ...         \"name\": \"{{NAME}}\",", "        ...         \"items\": [\"{{ITEM1}}\", \"{{ITEM2}}\"]", "        ...     }", "        ... }", "        >>> vars = {\"BASE\": \"/root\", \"NAME\": \"test\", \"ITEM1\": \"a\", \"ITEM2\": \"b\"}", "        >>> render_template_recursive(data, vars)", "        {", "            'path': '/root/data',", "            'config': {", "                'name': 'test',", "                'items': ['a', 'b']", "            }", "        }", "    \"\"\"", "    if isinstance(obj, dict):", "        return {k: render_template_recursive(v, variables) for k, v in obj.items()}", "    elif isinstance(obj, list):", "        return [render_template_recursive(item, variables) for item in obj]", "    elif isinstance(obj, str):", "        return render_template_string(obj, variables)", "    else:", "        # Return primitives (int, float, bool, None) as-is", "        return obj"], "new": ["\"\"\"Template rendering utilities for string and JSON template substitution.\"\"\"", "", "from __future__ import annotations", "", "import re", "from typing import Any, Dict", "", "_FALSY = {\"\", \"0\", \"false\", \"no\", \"none\", \"null\"}", "", "# {{#if var}}...{{/if}}. Blocks do not nest. The newline right after the opening tag and right after the", "# closing tag is swallowed, so a block whose tags sit on their own lines renders to exactly nothing when false.", "_IF_BLOCK_RE = re.compile(r\"\\{\\{#if\\s+([a-zA-Z0-9_]+)\\s*\\}\\}\\n?(.*?)\\{\\{/if\\}\\}\\n?\", re.DOTALL)", "", "", "def _is_truthy(value: Any) -> bool:", "    if value is None:", "        return False", "    if isinstance(value, bool):", "        return value", "    return str(value).strip().lower() not in _FALSY", "", "", "def render_template_string(template: str, variables: Dict[str, str]) -> str:", "    \"\"\"Render a template string by replacing {{variable}} placeholders.", "", "    Optional conditional blocks ``{{#if name}}...{{/if}}`` are kept only when ``name`` is set and truthy", "    (not missing, empty, \"0\", \"false\", \"no\", \"none\"). Templates without the syntax render exactly as before.", "", "    Args:", "        template: Template string with {{variable}} placeholders", "        variables: Dict mapping variable names to replacement values", "", "    Returns:", "        Rendered string with placeholders replaced", "", "    Example:", "        >>> render_template_string(\"Hello {{name}}!\", {\"name\": \"World\"})", "        'Hello World!'", "    \"\"\"", "", "    def replace_var(match):", "        var_name = match.group(1).strip()", "        return str(variables.get(var_name, match.group(0)))", "", "    if \"{{#if\" in template:", "        template = _IF_BLOCK_RE.sub(lambda m: m.group(2) if _is_truthy(variables.get(m.group(1))) else \"\", template)", "", "    # Replace {{variable}} with actual values", "    return re.sub(r\"\\{\\{\\s*([a-zA-Z0-9_]+)\\s*\\}\\}\", replace_var, template)", "", "", "def render_template_recursive(obj: Any, variables: Dict[str, str]) -> Any:", "    \"\"\"Recursively render templates in a nested data structure.", "", "    Walks through dicts, lists, and strings, replacing {{variable}} placeholders", "    in all string values.", "", "    Args:", "        obj: Data structure to render (can be dict, list, str, or primitive types)", "        variables: Dict mapping variable names to replacement values", "", "    Returns:", "        Rendered data structure with all placeholders replaced", "", "    Example:", "        >>> data = {", "        ...     \"path\": \"{{BASE}}/data\",", "        ...     \"config\": {", "        ...         \"name\": \"{{NAME}}\",", "        ...         \"items\": [\"{{ITEM1}}\", \"{{ITEM2}}\"]", "        ...     }", "        ... }", "        >>> vars = {\"BASE\": \"/root\", \"NAME\": \"test\", \"ITEM1\": \"a\", \"ITEM2\": \"b\"}", "        >>> render_template_recursive(data, vars)", "        {", "            'path': '/root/data',", "            'config': {", "                'name': 'test',", "                'items': ['a', 'b']", "            }", "        }", "    \"\"\"", "    if isinstance(obj, dict):", "        return {k: render_template_recursive(v, variables) for k, v in obj.items()}", "    elif isinstance(obj, list):", "        return [render_template_recursive(item, variables) for item in obj]", "    elif isinstance(obj, str):", "        return render_template_string(obj, variables)", "    else:", "        # Return primitives (int, float, bool, None) as-is", "        return obj"], "ops": [["equal", 0, 7, 0, 7], ["insert", 7, 7, 7, 21], ["equal", 7, 10, 21, 24], ["insert", 10, 10, 24, 27], ["equal", 10, 26, 27, 43], ["insert", 26, 26, 43, 46], ["equal", 26, 71, 46, 91]], "add": 20, "del": 0}, {"what": ["Commit history is listed per repo with the repo's path in the container.", "New Interface contract section: names that cross a repo boundary must be written down.", "Boundary-name rule: boundary names are allowed, internal names are still forbidden.", "A one-repo workspace renders one repo and no boundary."], "why": "The spec writer must name the cross-repo surface, or the task is unsolvable for an engineer working in one repo.", "rewritten": true, "id": "srs-gen-v1-tmpl", "path": "deepcommit/harness/gen_srs/srs_gen_v1.tmpl", "name": "srs_gen_v1.tmpl", "group": "Phase 3 and 4: build and spec", "note": "SRS generation. Rewritten multi-repo only: per-repo commit lists and paths, interface-contract section and boundary-name rule are the only text (one-repo workspace renders one repo).", "status": "modified", "old": ["================================================================================", "MILESTONE: {{ milestone_id }} - {{ title }}", "================================================================================", "", "# TASK", "", "Your task is to generate a complete Software Requirements Specification (SRS) for this milestone based on the provided inputs. You will be given:", "1. A **mini SRS** (brief requirement description)", "2. **Code changes** (curated source-only modifications)", "3. **Full commit history** (complete development record with context)", "4. **Test list** (fail-to-pass test cases)", "", "Your goal is to **reverse-engineer** a comprehensive, production-quality SRS that:", "- Expands the mini SRS into detailed functional requirements", "- Analyzes code changes and commits to understand implementation", "- Uses fail-to-pass tests as acceptance criteria", "- Produces a realistic requirements document that could have guided the original development", "", "**Output Requirements**:", "- Save the generated SRS document to: `{{ output_file }}`", "- Use Markdown format (.md extension)", "- Ensure the document is complete and ready for engineering use", "", "================================================================================", "", "# AVAILABLE INPUTS", "", "## INPUT 1: Mini SRS", "", "{{ mini_srs }}", "", "", "## INPUT 2: Code Changes", "", "**Docker Container**: `{{ milestone_container }}`", "**Git range**: `{{ start_commit }}..{{ end_commit }}`", "", "**How to Access Code in Container:**", "", "The milestone container has the complete git repository (working directory: `/testbed`) already checked out to commit `{{ end_commit }}`.", "", "To view files in the container:", "```bash", "docker exec {{ milestone_container }} cat <file_path>", "```", "", "To run git commands:", "```bash", "docker exec {{ milestone_container }} git <git-command>", "```", "", "---", "", "This represents the **curated** implementation changes for this milestone:", "- Squashed source code modifications (project source code only)", "- Focused on requirement-related functional changes", "- Excludes test files, documentation, and auxiliary changes", "", "**Use this to**: Understand the core functional implementation relevant to requirements.", "", "**How to view**: Run `docker exec {{ milestone_container }} git diff {{ start_commit }}..{{ end_commit }}`", "", "", "## INPUT 3: Full Commit History ({{ commit_count }} commits)", "", "This is the **complete** development record for context:", "{%- for commit in commits %}", "- `{{ commit.sha }}` - {{ commit.subject }}", "{%- endfor %}", "", "Includes all original commits with:", "- Complete semantic information and commit messages", "- Test files and their evolution", "- Documentation and configuration changes", "", "**Use this to**: Gain full context on implementation rationale and test-requirement alignment.", "", "**How to access patches**: Read `{{ patches_dir }}/{sha}.patch` for detailed changes.", "", "", "## INPUT 4: Stable Fail-to-Pass Test List ({{ f2p_test_count }} tests)", "", "{%- if f2p_test_count > 0 %}", "**Source**: Stable classification from `test_results/{{ milestone_id }}/benchmark/{{ milestone_id }}_classification.json`", "**Full Test List**: `{{ f2p_tests_list_file }}`", "", "These are **verified stable** fail-to-pass tests (filtered from flaky tests through multiple test runs).", "", "{%- if show_all_tests %}", "**Complete list ({{ f2p_test_count }} tests)**:", "{%- for test in f2p_tests_preview %}", "- {{ test.test_id }}", "{%- endfor %}", "{%- else %}", "**Note**: {{ f2p_test_count }} tests total. See full list in `{{ f2p_tests_list_file }}`.", "{%- endif %}", "", "**How to access test code**:", "- Each test ID follows the format: `<file_path>::<ClassName>::<method_name>` or `<file_path>::<function_name>`", "- To view test implementation in the container (already at commit `{{ end_commit }}`):", "  ```bash", "  docker exec {{ milestone_container }} cat test/test_response.py", "  ```", "{%- else %}", "No acceptance tests found for this milestone.", "{%- endif %}", "", "================================================================================", "", "# SRS GENERATION GUIDELINES", "", "## Design Philosophy", "", "A good SRS should simulate real-world development scenarios where engineers receive requirements and must independently research, analyze code, and design solutions. The SRS must be **realistic**, **challenging**, and **well-defined**.", "", "### Core Principles", "", "1. **Realism**: Mimic actual issue statements and requirements from production environments", "   - Base problems on     var n = x.length, m = y.length, L = [], i, j;
    for (i = 0; i <= n; i++) { L.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    var common = 0, ho = '', hn = '', cur = { o: [], n: [] };
    function flush() {
      if (cur.o.length) ho += '<mark class="w">' + esc(cur.o.join('')) + '</mark>';
      if (cur.n.length) hn += '<mark class="w">' + esc(cur.n.join('')) + '</mark>';
      cur = { o: [], n: [] };
    }
    i = 0; j = 0;
    while (i < n && j < m) {
      if (x[i] === y[j]) { flush(); ho += esc(x[i]); hn += esc(y[j]); common += x[i].trim() ? 1 : 0; i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) { cur.o.push(x[i]); i++; }
      else { cur.n.push(y[j]); j++; }
    }
    while (i < n) { cur.o.push(x[i]); i++; }
    while (j < m) { cur.n.push(y[j]); j++; }
    flush();
    var words = Math.max(x.filter(function (s) { return s.trim(); }).length, y.filter(function (s) { return s.trim(); }).length);
    if (words === 0 || common / words < 0.35) return null;
    return [ho, hn];
  }

  function cell(no, html, cls, chg) {
    if (no === null) return '<div class="cell void"><span class="ln"></span><span class="tx"></span></div>';
    return '<div class="cell ' + cls + '"><span class="ln">' + (no + 1) + '</span><span class="tx">' + html + '</span></div>';
  }

  function diffRows(f, layout) {
    var out = [], idx = 0;
    nChanges = 0;
    f.ops.forEach(function (o) { if (o[0] !== 'equal') nChanges++; });
    f.ops.forEach(function (o) {
      var tag = o[0], i1 = o[1], i2 = o[2], j1 = o[3], j2 = o[4], k;
      if (tag === 'equal') {
        var rows = [];
        for (k = 0; k < i2 - i1; k++) {
          var ni = j1 + k;
          rows.push(layout === 'split'
            ? '<div class="row split">' + cell(i1 + k, esc(f.old[i1 + k]), 'ctx') + cell(ni, esc(f.new[ni]), 'ctx') + '</div>'
            : '<div class="row uni ctx"><span class="ln">' + (i1 + k + 1) + '</span><span class="ln">' + (ni + 1) + '</span><span class="sg"></span><span class="tx">' + esc(f.new[ni]) + '</span></div>');
        }
        if (rows.length >= FOLD_MIN) {
          var head = rows.slice(0, CTX), mid = rows.slice(CTX, rows.length - CTX), tail = rows.slice(rows.length - CTX);
          out.push(head.join('') + '<div class="fold"><button type="button" data-fold="1">Show ' + mid.length + ' unchanged lines</button><div hidden>' + mid.join('') + '</div></div>' + tail.join(''));
        } else out.push(rows.join(''));
        return;
      }
      var di = i2 - i1, dj = j2 - j1, oh = [], nh = [];
      for (k = 0; k < di; k++) oh.push(esc(f.old[i1 + k]));
      for (k = 0; k < dj; k++) nh.push(esc(f.new[j1 + k]));
      if (tag === 'replace') for (k = 0; k < Math.min(di, dj); k++) {
        var wd = wordDiff(f.old[i1 + k], f.new[j1 + k]);
        if (wd) { oh[k] = wd[0]; nh[k] = wd[1]; }
      }
      var id = 'chg-' + idx++, first = true, block = [];
      function mark() { var a = first ? ' id="' + id + '"' : ''; var c = first ? ' chg' : ''; first = false; return [a, c]; }
      if (layout === 'split') {
        var n = Math.max(di, dj);
        for (k = 0; k < n; k++) {
          var m = mark();
          block.push('<div class="row split' + m[1] + '"' + m[0] + '>' + (k < di ? cell(i1 + k, oh[k], 'del') : cell(null)) + (k < dj ? cell(j1 + k, nh[k], 'add') : cell(null)) + '</div>');
        }
      } else {
        for (k = 0; k < di; k++) { var m1 = mark(); block.push('<div class="row uni del' + m1[1] + '"' + m1[0] + '><span class="ln">' + (i1 + k + 1) + '</span><span class="ln"></span><span class="sg">-</span><span class="tx">' + oh[k] + '</span></div>'); }
        for (k = 0; k < dj; k++) { var m2 = mark(); block.push('<div class="row uni add' + m2[1] + '"' + m2[0] + '><span class="ln"></span><span class="ln">' + (j1 + k + 1) + '</span><span class="sg">+</span><span class="tx">' + nh[k] + '</span></div>'); }
      }
      out.push(block.join(''));
    });
    return out.join('');
  }

  function fullText(f, which) {
    var lines = f[which], added = which === 'new' ? addedSet(f) : {}, out = [];
    for (var i = 0; i < lines.length; i++) {
      out.push('<div class="row one ' + (added[i] ? 'add' : 'ctx') + '"><span class="ln">' + (i + 1) + '</span><span class="tx">' + esc(lines[i]) + '</span></div>');
    }
    return out.join('');
  }

  function renderNav() {
    var html = '<a class="ovl" href="#overview" data-id="overview"' + (state.id === 'overview' ? ' aria-current="true"' : '') + '><span class="nm">Overview</span></a>', group = '';
    files.forEach(function (f) {
      if (f.group !== group) { group = f.group; html += '<h2>' + esc(group) + '</h2>'; }
      html += '<a href="#' + f.id + '" data-id="' + f.id + '"' + (f.id === state.id ? ' aria-current="true"' : '') + '>' +
        '<span class="nm">' + esc(f.name) + '</span>' +
        '<span class="cn">' + (f.rewritten === false ? '<span class="tag-nr">not rewritten</span> ' : '') + (f.status === 'new' ? 'new ' : '') + '<span class="a">+' + f.add + '</span> <span class="d">&minus;' + f.del + '</span></span>' +
        '<span class="nt">' + esc(f.note) + '</span></a>';
    });
    document.getElementById('nav').innerHTML = html;
  }

  function renderOverview() {
    var h = '<div class="ov"><h2>Overview</h2>';
    OV.summary.forEach(function (s) { h += '<p>' + esc(s) + '</p>'; });
    h += '<h3>Key rules: before and now</h3><div class="tw"><table><thead><tr><th>Rule</th><th>Before (single repo)</th><th>Now (multi-repo)</th></tr></thead><tbody>';
    OV.rules.forEach(function (r) { h += '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; });
    h += '</tbody></table></div><h3>Glossary</h3><dl>';
    OV.glossary.forEach(function (g) { h += '<dt>' + esc(g[0]) + '</dt><dd>' + esc(g[1]) + '</dd>'; });
    h += '</dl><h3>Pipeline order and prompts</h3><ol>';
    OV.stages.forEach(function (s) { h += '<li><b>' + esc(s[0]) + '</b>: ' + esc(s[1]) + ' (<code>' + esc(s[2]) + '</code>)</li>'; });
    h += '</ol></div>';
    document.getElementById('view').innerHTML = h;
  }

  function renderView() {
    if (state.id === 'overview') { renderOverview(); return; }
    var f = byId(state.id), v = state.view, body, bar = '';
    var tabs = [['diff', 'Changes'], ['old', 'Old version'], ['new', 'New version']].map(function (t) {
      return '<button type="button" data-view="' + t[0] + '" aria-pressed="' + (v === t[0]) + '">' + t[1] + '</button>';
    }).join('');
    var right = '', diffHtml = '';
    if (v === 'old' && f.status === 'new') body = '<div class="empty">This file is new. It has no old version.</div>';
    else if (v === 'diff') {
      if (f.status === 'unchanged') body = '<div class="empty">No changes.</div>';
      else { diffHtml = diffRows(f, state.layout); body = '<div class="scroll code">' + diffHtml + '</div>'; }
    } else body = '<div class="scroll code">' + fullText(f, v) + '</div>';
    if (v === 'diff') {
      right = '<div class="seg" role="group" aria-label="Diff layout">' +
        '<button type="button" data-layout="split" aria-pressed="' + (state.layout === 'split') + '">Side by side</button>' +
        '<button type="button" data-layout="uni" aria-pressed="' + (state.layout === 'uni') + '">Unified</button></div>' +
        '<div class="nav2"><button type="button" data-step="-1" title="Previous change (k)">Previous change</button><span class="ct" id="ct">' + nChanges + ' changes</span><button type="button" data-step="1" title="Next change (j)">Next change</button></div>';
    }
    bar = '<div class="bar"><div class="seg" role="group" aria-label="View">' + tabs + '</div>' + right +
      '<div class="legend"><span><i class="la"></i>added</span><span><i class="ld"></i>removed</span></div></div>';
    var what = '<div class="what"><h3>What changed</h3><ul>' + f.what.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul><h3>Why</h3><p>' + esc(f.why) + '</p></div>';
    document.getElementById('view').innerHTML =
      '<div class="fh"><div class="path">' + esc(f.path) + '</div><h2>' + esc(f.name) + '<span class="pill ' + (f.rewritten ? 'rewritten' : f.status) + '">' + (f.rewritten ? 'rewritten' : 'not rewritten') + '</span></h2><p class="note">' + esc(f.note) + '</p></div>' +
      what + bar + body;
    state.cur = -1;
  }

  function step(d) {
    if (state.id === 'overview' || state.view !== 'diff' || !nChanges) return;


    state.cur = Math.min(nChanges - 1, Math.max(0, state.cur + d));
    document.querySelectorAll('.chg.cur').forEach(function (e) { e.classList.remove('cur'); });
    var el = document.getElementById('chg-' + state.cur);
    if (el) { el.classList.add('cur'); el.scrollIntoView({ block: 'center' }); }
    var ct = document.getElementById('ct'); if (ct) ct.textContent = 'change ' + (state.cur + 1) + ' of ' + nChanges;
  }

  function renderStats() {
    var add = 0, del = 0, rw = 0;
    files.forEach(function (f) { add += f.add; del += f.del; if (f.rewritten) rw++; });
    document.getElementById('stats').innerHTML =
      '<li><b>' + files.length + '</b> files</li><li><b>' + rw + '</b> rewritten</li><li><b>' + files.filter(function (f) { return f.rewritten === false; }).length + '</b> not rewritten</li>' +
      '<li class="a"><b>+' + add + '</b> lines</li><li class="d"><b>&minus;' + del + '</b> lines</li>';
  }

  function render() { renderNav(); renderView(); }
  function fromHash() {
    var id = decodeURIComponent(location.hash.replace(/^#/, ''));
    state.id = id === 'overview' || byId(id) ? (id || 'overview') : 'overview';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a[data-id]');
    if (!t) return;
    if (t.hasAttribute('data-fold')) { var body = t.nextElementSibling; body.hidden = !body.hidden; t.textContent = body.hidden ? 'Show ' + body.children.length + ' unchanged lines' : 'Hide ' + body.children.length + ' unchanged lines'; return; }
    if (t.hasAttribute('data-step')) { step(parseInt(t.getAttribute('data-step'), 10)); return; }
    if (t.hasAttribute('data-view')) { state.view = t.getAttribute('data-view'); renderView(); }
    else if (t.hasAttribute('data-layout')) { state.layout = t.getAttribute('data-layout'); renderView(); }
    else if (t.hasAttribute('data-id')) { e.preventDefault(); state.id = t.getAttribute('data-id'); history.replaceState(null, '', '#' + state.id); render(); window.scrollTo({ top: 0 }); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'j') step(1); else if (e.key === 'k') step(-1);
  });
  window.addEventListener('hashchange', function () { fromHash(); render(); });

  fromHash();
  renderStats();
  render();
})();
</script>
</body>
</html>
