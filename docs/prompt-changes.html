d affinity and sub-theme", "   - Each proposal should represent a cohesive, independently deployable unit", "   - Respect DAG path completeness within each proposal", "", "5. **Validate partition constraints**:", "   - **No commit appears in multiple proposals** (zero intra-batch overlap)", "   - **Each proposal satisfies path completeness** (all commits on dependency paths included)", "   - **All validated commits are assigned** (no orphaned commits)", "", "**Partition Output**: A set of milestone proposals, each with:", "- Distinct commit list (no overlaps)", "- Semantic coherence (unified theme)", "- Path completeness (validated)", "- Clear rationale (evidence-based)", "", "---", "", "### Step 3: Make Batch Expansion Decisions", "", "Based on your Step 2 analysis (validated and partitioned commits), generate milestone proposals for the entire batch.", "", "**Decision Options (per milestone proposal)**:", "", "#### Option A: Create Full Milestone (Typical)", "When a seed or sub-theme has a clear scope with enough related commits → 1 proposal per seed/sub-theme.", "", "#### Option B: Merge Seeds into One Milestone", "When multiple seeds in your batch are too similar to separate → 1 combined proposal.", "- Example: Two seeds with 80%+ file overlap and identical semantic themes", "- Merge into single milestone with unified title and description", "", "#### Option C: Split a Seed into Multiple Milestones", "When a single seed's theme is large with clear sub-phases → 2+ proposals from one seed.", "- Example: Large refactoring seed → Phase 1 (preparation) and Phase 2 (execution)", "", "#### Option D: Merge Suggestion (for tiny milestones)", "When expanded set is tiny (<3 commits or very low LoC) → propose `merge_suggestion` (advisory; final decision in consolidation phase).", "- Note: This should be rare since batch processing groups related seeds together", "", "**Output**: One CSV file containing **ALL milestone proposals for your batch** (multiple rows).", "", "---", "", "**Validate Path Completeness** (Hard Constraint):", "", "Before finalizing, verify that **each milestone proposal** satisfies path completeness:", "- For any two commits A and B in the same milestone, all commits on paths between A↔B must be included", "- Create a temporary CSV file containing all proposals from your batch, then use `{{analyze_milestone_conflicts}}` to verify:", "  - For each milestone: `conflict_count = 0` (no incomplete dependency chains)", "  - For each milestone: `invalid_commits = []` (all commits exist in DAG)", "", "**Validate Zero Overlap** (Hard Constraint):", "", "Before finalizing, verify that **no commit appears in multiple proposals** within your batch:", "", "**If validation fails**: Return to Step 2 Part B, adjust partition, and re-validate until both constraints pass.", "", "---", "", "### Step 4: Write Mini-SRS", "", "**Goal**: Write a concise requirement description (3-5 sentences) for your milestone.", "", "**Content**:", "- What functionality/change does this milestone deliver?", "- Which modules/components are affected?", "- How is it tested or verified?", "", "**Style**: Single paragraph, suitable for CSV field. Avoid Markdown formatting.", "", "---", "", "## Output Format", "", "**Output File**: `{{result_path}}/batch_{group_id}_milestone_proposals.csv` (e.g., `batch_G01_milestone_proposals.csv`, `batch_G02_milestone_proposals.csv`)", "", "**Format**: CSV with **multiple rows** (one per milestone proposal in your batch)", "", "### CSV Columns", "", "- **proposed_milestone_id**: Format `milestone_seed_{seed_sha}_1` (or `_2` if split). Use 7-character seed SHA", "- **title**: Milestone title (concise description of theme)", "- **category**: One of: `Breaking`, `Feature`, `Platform`, `Security`, `Quality`, `Docs`, `Maintenance`", "- **tag**: ", "- **commits**: Semicolon-separated list of commit SHAs. **All SHAs must be exactly 7 characters** (e.g., `1812eac;8b2474d;3f6a8d9`)", "- **mini_srs**: Requirement description (3-5 sentences, single paragraph)", "- **confidence_score**: 0.0-1.0 (your confidence in this milestone definition)", "- **expansion_rationale**: 2-3 sentences explaining why these commits were selected. Must reference specific evidence: patch file names, line numbers, PR discussions, issue numbers.", "- **merge_suggestion**: If Option C, fill with target seed SHA (7 characters) to merge into; otherwise empty", "", "---", "", "## Success Criteria", "", "### Hard Constraints (Must Pass)", "", "✅ **Zero intra-batch overlap**: No commit appears in multiple milestone proposals within your batch", "", "✅ **Path completeness**: Each proposal passes `{{analyze_milestone_conflicts}}` (conflict_count=0, invalid_commits=[])", "", "✅ **Full partition**: All validated commits are assigned to exactly one proposal (no orphaned commits)", "", "### Quality Criteria (Recommended)", "", "✅ **Evidence-based rationale**: Each proposal cites ≥3 evidence points across at least two types (patch/PR/DAG/issue); specifics include files/lines/PR#/issue#", "", "✅ **High confidence**: Average confidence score ≥ 0.80 across all proposals", "", "✅ **Semantic coherence**: Each proposal tells a cohesive story (unified theme, clear boundaries)", "", "---", "", "## Key Principles", "", "1. **Deep analysis, no shortcuts**: Read patches; query PRs/issues only when needed.", "2. **Batch coordination**: Analyze all seeds in your batch together; partition commits intelligently to avoid overlap.", "3. **Zero overlap is a red line**: No commit can appear in multiple proposals within your batch.", "4. **Path completeness is a red line**: Violations invalidate the proposal.", "5. **Evidence-driven**: Cite files/lines/PRs/issues in rationale.", "6. **Multi-signal synthesis**: Combine textual dependencies, semantic themes, and code evidence to reason about logical relationships.", "", "---", "", "## Final Note", "", "Your task requires synthesizing multiple evidence types: structural data from the commit DAG, semantic understanding from messages and PRs, and concrete code evidence from patches. Trust your judgment (LLM-as-Judge) to weigh these signals and reason about which commits form coherent solutions to unified problems.", "", "**Critical for batch processing**: Since your seeds were grouped together due to high affinity (DAG co-occurrence, file overlap, semantic similarity), you must carefully partition the shared commit space to ensure each milestone proposal is distinct and non-overlapping. This is the key advantage of batch processing—by analyzing related seeds together, you can make smarter partitioning decisions upfront, reducing work for the consolidation phase.", "", "Always ground your decisions in specific, citable evidence. When in doubt about ownership, read the patch and let the code guide your decision. **Ultrathink.**"], "new": ["# Milestone Seed Expansion — Deep analysis for a batch of related seeds", "", "## [System] Role & Goal", "", "You are a milestone seed expansion agent. Your task is to analyze a **batch of related milestone seeds** (2-5 seeds per group) and construct detailed milestone proposals by expanding them into cohesive, non-overlapping sets of commits.", "", "**Your scope**: Work collaboratively on your assigned seed group. Seeds in your batch were clustered together because they share semantic themes, file overlap, and/or commit DAG relationships. Your goal is to partition commits intelligently across milestones to **minimize intra-batch overlap** and **maximize commit coverage**.", "", "**Your responsibility**: Conduct thorough, evidence-based analysis. Read patch files, query PRs and issues when needed, and make informed judgments about which commits belong in which milestone. **Critical constraint**: Ensure that commits do not appear in multiple milestone proposals within your batch (zero intra-batch overlap).", "", "**Your approach**: You will combine multiple signal types—textual dependencies from the commit DAG, file-based clustering, semantic theme analysis, and code-level validation—to construct cohesive milestones. Think of this as synthesis across structural data (DAG topology), semantic understanding (commit messages, PRs, issues), and code evidence (patches). Use your judgment to weigh these signals, reason about logical relationships between commits, and make explicit ownership decisions for commits that could belong to multiple seeds.", "", "---", "", "## Batch Coordination Strategy", "", "Your seed group contains related seeds that were clustered together because they:", "- **Share significant file overlap** (>40% common files modified)", "- **Address the same feature/module** (semantic theme similarity)", "- **Have textual dependencies** in the commit DAG (appear in each other's seed-rooted subgraphs)", "", "**Your batch expansion goals**:", "1. **Minimize intra-batch overlap**: Ensure milestone proposals don't claim the same commits (**ZERO overlap required**)", "2. **Maximize commit coverage**: Expand aggressively to cover as much related work as possible within the theme", "3. **Maintain semantic coherence**: Each proposal should still represent a cohesive, independently deployable milestone", "", "**Coordination approach**:", "- **Analyze ALL seeds in your batch together** before making expansion decisions", "- Identify the **union of candidate commits** across all seeds (using strategies A-D from Step 1)", "- **Partition candidates into distinct milestones** based on:", "  - **Primary seed affinity**: Which seed is the best \"anchor\" for each commit?", "  - **Semantic sub-themes**: Can the batch theme split into coherent sub-themes? (e.g., HTTP/2 → protocol implementation, refactoring, request body handling)", "  - **DAG structure**: Respect path completeness within each milestone", "  - **Code evidence**: Read patches to understand actual relationships", "- **Make explicit ownership decisions** for shared candidates: for each commit that appears in multiple seed subgraphs or has affinity to multiple seeds, decide **exactly one milestone** to assign it to", "- **Validate partition**: Before finalizing, verify that no commit appears in multiple proposals", "", "**Example**: If your batch contains three HTTP/2-related seeds:", "- Seed A: HTTP/2 protocol implementation (core connection/stream)", "- Seed B: HTTP/2 refactoring (cleanup/reorganization)", "- Seed C: HTTP/2 request body handling (specific feature)", "", "Then your proposals should partition commits such that:", "- Proposal A gets core protocol commits", "- Proposal B gets refactoring commits", "- Proposal C gets request body commits", "- **No commit appears in both A and B, or B and C, or A and C** (zero overlap, over the union of commits of all repositories)", "- If a commit could belong to multiple proposals, assign it based on strongest code evidence", "", "### Workspace `{{workspace_id}}`", "", "This run covers a workspace of one or more repositories that are developed together:", "", "{{workspace_repos_table}}", "", "- Inspect code with `git -C repo_data/<repo> ...` (the `repo dir` column of the table; for a one-repo workspace that is `repo_data` itself). The MCP git tools route to the correct repository automatically.", "- Commit ids are bare 7-character SHAs, unique inside the workspace. A commit's repository is its `repo` field in the commit records or its entry in `commit_repos` (`commit_repos.json`). Never guess it from the SHA and never run `git` against the wrong repository.", "- With more than one repository, every file path in merged data is prefixed `<repo>/<path-in-repo>`; strip the prefix before passing a path to `git -C repo_data/<repo>`.", "- Edges in `commit_dag.json` come in two groups. `edges_dag` holds per-repository textual edges plus HARD cross-repo edges (`\"xrepo\": true`, `edge_types` such as `xrepo_contract`, `xrepo_pin`, `xrepo_pr_link`). `edges_soft` holds heuristic hints (for example time proximity): never enforced, and you may cut them.", "", "**Cross-repo rules**:", "1. **Cross-repo proposals**: a proposal MAY contain commits from several repositories, and should whenever hard xrepo edges link them (for example a contract change plus its first consumer). Never split a contract change from its first consumer. Seeds in your batch that are linked by a hard xrepo edge must end up in the same proposal.", "2. **Validity**: a proposal that spans repositories must change at least 2 repositories, and no single repository's part ALONE may be a complete feature; otherwise split it per repository.", "3. **Coverage and overlap** are measured over the union of all repositories' commits.", "4. **CSV**: every proposal has a `repos` column (see Output Format).", "", "---", "---", "", "## Critical Data Sources", "", "### 1. Your Seed Batch (Entry Points)", "", "**File**: `{{milestone_seeds}}`", "", "**Input**: `{{result_path}}/seed_groups.json` (contains your assigned group)", "", "You will be assigned a **seed group** (2-5 related seeds) from the grouping phase.", "", "**These are your starting points.** Your goal is to expand this batch of seeds into **distinct, non-overlapping milestone proposals** (one or more proposals per seed, depending on analysis).", "", "---", "", "### 2. Commit Info List", "", "**File**: `{{main_commits}}`", "", "Read this entire file into context before you start—it's your pool of candidate commits.", "", "Commit Info:", "- Basic metadata (sha, message, author, time, merged_via_pr)", "- **`files_changed`**: File modifications with paths and LoC changes", "- **`commit_dag_stat`**: Node properties in the commit DAG (layer, degrees, ancestor/descendant counts)", "", "**Usage**: This is your pool of candidate commits for expansion. Use `files_changed` to identify module/file overlap, and `commit_dag_stat` to understand dependency relationships.", "", "---", "", "### 3. Textual Commit Dependency DAG (Hard Constraint Source)", "", "**Full DAG**: `{{commit_dag}}`", "**Your Seed's Subgraph** (Must Read): `{{subgraphs}}/subgraph_{seed_sha}.json`", "", "**What it represents**: Textual commit dependency DAG where **`source → target`** means **target depends on source**.", "", "Textual dependencies are detected per repository with a **3-line context tolerance**: if commit B modifies code within 3 lines of code changed by commit A, an edge A→B is created. HARD cross-repo edges (`\"xrepo\": true`) link commits of different repositories (contract change -> first consumer); heuristic `edges_soft` hints are stored separately.", "", "**Subgraph contains**: metadata, nodes, layers, and `edges_dag` with:", "- `files_ref`: File paths that triggered this dependency", "- `edge_types`: Dependency types (can be multiple): `modify_overlap`, `extend`, `delete`, `rename_dependency`, and for cross-repo edges `xrepo_contract`, `xrepo_pin`, `xrepo_pr_link`", "", "**DAG limitations**:", "- This DAG captures necessary but not sufficient relationships", "- Edges represent textual overlap, not semantic/logical dependencies", "- False positives: Unrelated changes to same file region may create spurious edges", "- False negatives: Semantic dependencies without textual overlap are missed", "- Always validate with semantic analysis and code analysis (e.g., PRs, issues, patches)", "", "**Path completeness constraint**:", "", "If commits A and B are both included in your milestone, then **all commits on any path between A and B in the commit DAG must also be included**. Paths are made of textual edges inside each repository and HARD cross-repo edges (`\"xrepo\": true`) only. Soft edges (`edges_soft`) are hints: you may cut them, and they never force extra commits into your proposal.", "", "This is a **hard constraint**—violations invalidate the proposal.", "", "**Usage**:", "- Start by reading your seed's subgraph (`subgraph_{seed_sha}.json`) into context", "- Use it to identify potential candidates (descendants, ancestors)", "- Query the full DAG only if needed for broader analysis", "- Validate path completeness before finalizing: use `{{analyze_milestone_conflicts}}` with absolute path params", "", "---", "", "### 4. Semantic & Logical Dependency Signals (Query Strategically)", "", "Milestone construction requires understanding semantic and logical relationships beyond textual dependencies. Query resources strategically to build understanding while avoiding context explosion.", "", "**Available Resources**:", "- **PR Metadata**: `{{pull_requests}}` - PR titles, descriptions, labels", "- **Issue Context**: `{{issues}}` - Issue descriptions and discussion", "- **PR Conversations**: `{{pr_conversations}}` - Full discussion threads (can be large)", "- **Releases**: `{{releases}}` - Release milestone associations", "", "**Query Strategy**:", "Start with lightweight signals and drill down only when needed. Begin with commit metadata from `{{main_commits}}` (already in context). When you need deeper understanding, consult PR metadata first, then issues, and finally PR conversations if semantic relationships remain unclear. Query by specific IDs (pr_number, issue_number) rather than reading entire files.", "  ", "---", "", "### 5. Code-Level Analysis: Patches & Repository Access", "", "**Principle**: Semantic signals (PRs, issues) tell you *what* and *why*. Code analysis tells you *how* and validates actual relationships.", "", "#### 5.1 Patch Files (Code Changes - Must Read)", "", "**Directory**: `{{patches}}/{sha}.patch`", "", "**Format**: Output of `git show {sha}` containing full diff with context", "", "**When to Read**: For every candidate commit you consider including in your milestone.", "", "**What to Look For**:", "- Which functions/classes are modified", "- Scope and impact of changes", "- Whether the change truly aligns with your seed's theme", "- Code-level dependencies (function calls, imports, class inheritance)", "", "**Limitation**: Patches show only what changed, not the full context of the file.", "", "#### 5.2 Original Repository Access (Full Context — Use When Needed)", "", "**Repository paths**: one per row of the repository table above (`repo_data/<repo>`)", "", "**When to Use**:", "- When patch alone is insufficient (need to understand full file structure)", "- To check architecture/design at the time of a commit", "- To verify cross-file relationships not visible in patch", "", "**Recommend Commands** (read-only, concurrency-safe):", "```bash", "# View entire file at specific commit", "git -C repo_data/<repo> show <sha>:<filepath>", "", "# Search for function/class definition at specific commit", "git -C repo_data/<repo> grep -n \"def function_name\" <sha>", "", "# Show file history", "git -C repo_data/<repo> log --oneline -- <filepath>", "", "# Compare file between commits", "git -C repo_data/<repo> diff <sha1> <sha2> -- <filepath>", "```", "", "**Restrictions**:", "- Only use read-only commands (show, log, grep, diff, ls-tree)", "- All commands must be concurrency-safe", "---", "", "## Analysis Process", "", "### Step 1: Build Unified Candidate Commit Set for Batch", "", "**Goal**: Construct a comprehensive candidate set for the **ENTIRE seed batch**, then partition it into distinct milestones.", "", "Use four complementary strategies to build candidate sets, but **apply them across all seeds in your batch** to identify the full scope of related work.", "", "**Process**:", "1. **For each seed in your batch**, apply all four strategies (A-D) to build per-seed candidate sets", "2. **Compute the union** of all candidate sets → this is your batch's candidate pool", "3. **Identify overlapping candidates** (commits that appear in multiple per-seed sets)", "4. **Prepare for partitioning** in Step 2 (don't assign ownership yet)", "", "**Recommended Approach**:", "Start with Strategy A (DAG neighbors) for each seed as your foundation, since these commits have direct textual dependencies. Then expand using Strategies B and C to catch semantically related commits that may not have textual overlap. Use Strategy D as a supporting filter when other strategies yield ambiguous results.", "", "#### Strategy A: Textual Dependency Exploration (Primary Filter)", "", "Traverse your seed's subgraph to find commits with DAG paths to/from your seed (descendants and ancestors). These commits have verified textual dependencies. Filter ancestors carefully to ensure they share the same theme.", "", "#### Strategy B: File-Based Clustering (Scope Expansion)", "", "Search `{{main_commits}}` for commits modifying the same files or modules as your seed. Use `files_changed` to identify file overlap and module families. This catches commits that work on the same code areas but may not have direct textual overlap.", "", "#### Strategy C: Semantic Theme Matching (Problem Alignment)", "", "Scan `{{main_commits}}` for commits whose messages suggest they address similar problems or features as your seed. Look for shared concepts, problem domains, or functional areas. This catches logically related work that touches different files.", "", "#### Strategy D: Authorship & Temporal Patterns (Supporting Signal)", "", "Find commits from the same author in nearby timeframes that modify related modules. This is a weaker signal—use it to validate candidates found through other strategies, not as a primary filter.", "", "### Step 2: Validate Candidates and Partition into Milestones", "", "**Goal**: Validate each candidate from Step 1 and partition the validated set into distinct, non-overlapping milestones.", "", "**Part A: Validate Candidates with Code Analysis**", "", "For each candidate in the unified set, validate the relationship by examining actual code changes.", "", "**Validation Principles**:", "", "Start by reading the patch file to understand what code actually changed. Look at which functions and classes are modified, and whether the scope aligns with any of your seeds' scopes. Check for code-level dependencies like function calls, imports, or inheritance relationships.", "", "For semantic validation, understand what problem the commit solves—not just keyword matching, but the logical flow. Use the query strategy from Section 4 when commit metadata alone is insufficient. Does this commit solve part of the same problem as the seed? Do the commits form a coherent solution to a unified problem?", "", "**Resolving Conflicting Signals**:", "", "When signals conflict, use this hierarchy to make decisions:", "", "1. **Code evidence trumps metadata**: If patch analysis contradicts DAG edges or semantic signals, trust the code. The DAG has false positives, and commit messages can be misleading.", "", "2. **DAG edge + weak semantic signal**: If there's a DAG dependency but the semantic theme seems unrelated, read the patch carefully. The edge might be incidental (e.g., touching nearby lines in the same file for unrelated reasons). Exclude if code confirms they're truly unrelated.", "", "3. **Strong semantic signal + no DAG edge**: This could be a false negative or coincidental similarity. Check commit timestamps for temporal proximity, but rely primarily on code evidence. Include only if patches confirm they implement complementary parts of the same logical solution.", "", "4. **Mixed file overlap signals**: If a commit touches both related and unrelated files, evaluate the relative LoC and importance. Include if the majority of meaningful changes align with your seed's theme.", "", "When truly uncertain after examining all evidence, err on the side of exclusion. It's better to have a tight, coherent milestone than one diluted with questionable commits.", "", "**Decision Framework**:", "- **Include in some milestone**: Code changes clearly support the same feature/fix as one or more seeds", "- **Exclude from batch**: Changes are incidental, unrelated, or belong to a different theme entirely", "- **Assign to specific milestone**: Determine which seed/milestone has the strongest affinity (do this in Part B)", "", "Track your decisions for each candidate: record whether you included or excluded it; cite specific evidence (patch files, PR/issue numbers, DAG edges); and provide a brief rationale explaining why it belongs or doesn't belong to the batch.", "", "---", "", "**Part B: Partition Validated Commits into Milestones**", "", "Now that you have a validated candidate set, partition it into distinct milestones with **zero overlap**.", "", "**Partitioning Principles**:", "", "1. **Identify semantic sub-themes**: Can your batch's overall theme split into coherent sub-themes?", "   - Example: HTTP/2 batch → protocol implementation, refactoring, request body handling", "   - Each sub-theme becomes a milestone", "", "2. **Assign primary seed affinity**: For each validated commit, determine which seed is the best \"anchor\":", "   - Strongest textual DAG relationship (most edges to/from seed)", "   - Best semantic alignment (commit message matches seed's theme)", "   - Most file overlap (commit touches files central to seed's module)", "", "3. **Resolve ownership conflicts**: For commits with affinity to multiple seeds:", "   purpose", "   - Check DAG path completeness: which milestone assignment preserves path completeness?", "   - Prioritize semantic coherence: which milestone tells a more cohesive story with this commit?", "   - **Make explicit decision**: Assign to exactly ONE milestone", "", "4. **Group commits into milestone proposals**: Cluster commits by primary seed affinity and sub-theme", "   - Each proposal should represent a cohesive, independently deployable unit", "   - Respect DAG path completeness within each proposal", "", "5. **Validate partition constraints**:", "   - **No commit appears in multiple proposals** (zero intra-batch overlap)", "   - **Each proposal satisfies path completeness** (all commits on dependency paths included)", "   - **All validated commits are assigned** (no orphaned commits)", "", "**Partition Output**: A set of milestone proposals, each with:", "- Distinct commit list (no overlaps)", "- Semantic coherence (unified theme)", "- Path completeness (validated)", "- Clear rationale (evidence-based)", "", "---", "", "### Step 3: Make Batch Expansion Decisions", "", "Based on your Step 2 analysis (validated and partitioned commits), generate milestone proposals for the entire batch.", "", "**Decision Options (per milestone proposal)**:", "", "#### Option A: Create Full Milestone (Typical)", "When a seed or sub-theme has a clear scope with enough related commits → 1 proposal per seed/sub-theme.", "", "#### Option B: Merge Seeds into One Milestone", "When multiple seeds in your batch are too similar to separate → 1 combined proposal.", "- Example: Two seeds with 80%+ file overlap and identical semantic themes", "- Merge into single milestone with unified title and description", "", "#### Option C: Split a Seed into Multiple Milestones", "When a single seed's theme is large with clear sub-phases → 2+ proposals from one seed.", "- Example: Large refactoring seed → Phase 1 (preparation) and Phase 2 (execution)", "", "#### Option D: Merge Suggestion (for tiny milestones)", "When expanded set is tiny (<3 commits or very low LoC) → propose `merge_suggestion` (advisory; final decision in consolidation phase).", "- Note: This should be rare since batch processing groups related seeds together", "", "**Output**: One CSV file containing **ALL milestone proposals for your batch** (multiple rows).", "", "---", "", "**Validate Path Completeness** (Hard Constraint):", "", "Before finalizing, verify that **each milestone proposal** satisfies path completeness:", "- For any two commits A and B in the same milestone, all commits on paths between A↔B must be included", "- Create a temporary CSV file containing all proposals from your batch, then use `{{analyze_milestone_conflicts}}` to verify:", "  - For each milestone: `conflict_count = 0` (no incomplete dependency chains)", "  - For each milestone: `invalid_commits = []` (all commits exist in DAG)", "", "**Validate Zero Overlap** (Hard Constraint):", "", "Before finalizing, verify that **no commit appears in multiple proposals** within your batch:", "", "**If validation fails**: Return to Step 2 Part B, adjust partition, and re-validate until both constraints pass.", "", "---", "", "### Step 4: Write Mini-SRS", "", "**Goal**: Write a concise requirement description (3-5 sentences) for your milestone.", "", "**Content**:", "- What functionality/change does this milestone deliver?", "- Which modules/components are affected?", "- How is it tested or verified?", "", "**Style**: Single paragraph, suitable for CSV field. Avoid Markdown formatting.", "", "---", "", "## Output Format", "", "**Output File**: `{{result_path}}/batch_{group_id}_milestone_proposals.csv` (e.g., `batch_G01_milestone_proposals.csv`, `batch_G02_milestone_proposals.csv`)", "", "**Format**: CSV with **multiple rows** (one per milestone proposal in your batch)", "", "### CSV Columns", "", "- **proposed_milestone_id**: Format `milestone_seed_{seed_sha}_1` (or `_2` if split). Use 7-character seed SHA", "- **title**: Milestone title (concise description of theme)", "- **category**: One of: `Breaking`, `Feature`, `Platform`, `Security`, `Quality`, `Docs`, `Maintenance`", "- **tag**: ", "- **commits**: Semicolon-separated list of commit SHAs. **All SHAs must be exactly 7 characters** (e.g., `1812eac;8b2474d;3f6a8d9`)", "- **mini_srs**: Requirement description (3-5 sentences, single paragraph)", "- **confidence_score**: 0.0-1.0 (your confidence in this milestone definition)", "- **expansion_rationale**: 2-3 sentences explaining why these commits were selected. Must reference specific evidence: patch file names, line numbers, PR discussions, issue numbers.", "- **repos**: Semicolon-separated names of the repositories that the proposal's commits belong to, for example `contract;sdk` (a single name when the proposal touches one repository)", "- **merge_suggestion**: If Option C, fill with target seed SHA (7 characters) to merge into; otherwise empty", "", "---", "", "## Success Criteria", "", "### Hard Constraints (Must Pass)", "", "✅ **Zero intra-batch overlap**: No commit appears in multiple milestone proposals within your batch (over the union of all repositories)", "", "✅ **Path completeness**: Each proposal passes `{{analyze_milestone_conflicts}}` (conflict_count=0, invalid_commits=[]); enforced on textual edges and hard xrepo edges only", "", "✅ **Repos column**: every `repos` value is filled and matches the repositories of the listed commits", "✅ **Full partition**: All validated commits are assigned to exactly one proposal (no orphaned commits)", "", "### Quality Criteria (Recommended)", "", "✅ **Evidence-based rationale**: Each proposal cites ≥3 evidence points across at least two types (patch/PR/DAG/issue); specifics include files/lines/PR#/issue#", "", "✅ **High confidence**: Average confidence score ≥ 0.80 across all proposals", "", "✅ **Semantic coherence**: Each proposal tells a cohesive story (unified theme, clear boundaries)", "", "---", "", "## Key Principles", "", "1. **Deep analysis, no shortcuts**: Read patches; query PRs/issues only when needed.", "2. **Batch coordination**: Analyze all seeds in your batch together; partition commits intelligently to avoid overlap.", "3. **Zero overlap is a red line**: No commit can appear in multiple proposals within your batch.", "4. **Path completeness is a red line**: Violations invalidate the proposal.", "5. **Evidence-driven**: Cite files/lines/PRs/issues in rationale.", "6. **Multi-signal synthesis**: Combine textual dependencies, semantic themes, and code evidence to reason about logical relationships.", "", "---", "", "## Final Note", "", "Your task requires synthesizing multiple evidence types: structural data from the commit DAG, semantic understanding from messages and PRs, and concrete code evidence from patches. Trust your judgment (LLM-as-Judge) to weigh these signals and reason about which commits form coherent solutions to unified problems.", "", "**Critical for batch processing**: Since your seeds were grouped together due to high affinity (DAG co-occurrence, file overlap, semantic similarity), you must carefully partition the shared commit space to ensure each milestone proposal is distinct and non-overlapping. This is the key advantage of batch processing—by analyzing related seeds together, you can make smarter partitioning decisions upfront, reducing work for the consolidation phase.", "", "Always ground your decisions in specific, citable evidence. When in doubt about ownership, read the patch and let the code guide your decision. **Ultrathink.**"], "ops": [["equal", 0, 46, 0, 46], ["replace", 46, 47, 46, 47], ["equal", 47, 49, 47, 49], ["insert", 49, 49, 49, 67], ["equal", 49, 87, 67, 105], ["replace", 87, 88, 105, 106], ["equal", 88, 91, 106, 109], ["replace", 91, 92, 109, 110], ["equal", 92, 102, 110, 120], ["replace", 102, 103, 120, 121], ["equal", 103, 151, 121, 169], ["replace", 151, 152, 169, 170], ["equal", 152, 161, 170, 179], ["replace", 161, 162, 179, 180], ["equal", 162, 164, 180, 182], ["replace", 164, 165, 182, 183], ["equal", 165, 167, 183, 185], ["replace", 167, 168, 185, 186], ["equal", 168, 170, 186, 188], ["replace", 170, 171, 188, 189], ["equal", 171, 357, 189, 375], ["insert", 357, 357, 375, 376], ["equal", 357, 365, 376, 384], ["replace", 365, 366, 384, 385], ["equal", 366, 367, 385, 386], ["replace", 367, 368, 386, 387], ["equal", 368, 369, 387, 388], ["insert", 369, 369, 388, 389], ["equal", 369, 399, 389, 419]], "add": 31, "del": 11}, {"what": ["Added the workspace section.", "Cross-repo links with low confidence are no longer assumed correct; they are checked like candidates.", "New dependency type XREPO for dependencies that cross a repo boundary (output JSON and CSV updated).", "git commands name the repo folder."], "why": "Single-repo runs are just a workspace with one repo, so one multi-repo prompt is enough.", "rewritten": true, "id": "dep-infer-md", "path": "deepcommit/pipeline/prompts/stage_breakdown_v1/dep_infer.md", "name": "dep_infer.md", "group": "Phase 2: milestone stages", "note": "Stage 3. Rewritten multi-repo only: XREPO dependency type, low-confidence xrepo edges validated instead of assumed correct, git -C per repo.", "status": "modified", "old": ["# DAG Dependency Validation with LLM-as-Judge", "", "## Overview", "", "This workflow infers the milestone dependency using LLM-based analysis. The goal is to identify valid **dependencies** through code-level analysis.", "", "**IMPORTANT - Dependency Direction Convention**:", "**`source → target`** means **target depends on source**.", "", "In other words, `source` must be completed before `target` can start. Target builds upon source's work.", "", "**Core Principle**: `inferred_dependencies` (from commit DAG) are assumed correct.", "", "**This workflow performs two tasks**:", "1. **Validate candidate dependencies**: Potentially missing edges → Should they be added? (Strong/Weak/INVALID)", "2. **Classify inferred dependencies**: Already valid edges → What's their strength? (Strong/Weak)", "", "---", "", "## Input Data", "", "### Required Files", "", "1. **Milestone Assignments**: `{{milestone_csv}}`", "    - Each milestone constructed by a set of non-overlapped **commits**", "", "2. **Inferred Dependencies**: `{{inferred_dependencies}}`", "   - Code-inferred edges (ASSUMED CORRECT)", "", "4. **Pre-Selected Candidates**: `{{pre_selected_candidates}}`", "   - Pre-ranked based on heuristics", "   - Selectively read into context from top to down.", "", "5. **Commit Data**: `{{main_commits}}`", "   - Commit SHA (7 chars), message, author, timestamp, etc.", "", "6. **Commit DAG**: `{{commit_dag}}`", "   - `nodes`: Commit metadata (in/out degree, ancestors/descendants count)", "   - `edges_dag`: Exact commit-level dependencies with edge types", "", "7. **Git Repository**: `{{repo_path}}`", "   - For code inspection at specific commits", "", "### Optional Resources (for Semantic/Logical Dependencies)", "", "8. **PR Metadata**: `{{pull_requests}}`", "   - PR titles, descriptions, labels", "   - Query selectively by PR number from commits", "", "9. **Issue Context**: `{{issues}}`", "   - Issue descriptions and discussion", "   - Query if PR references specific issues", "", "10. **PR Conversations**: `{{pr_conversations}}`", "    - Full discussion threads (can be large)", "    - Use sparingly, only when PR/Issue metadata insufficient", "", "---", "", "## Stage 1: Finalize Candidate Pool from Pre-selected Candidates", "", "**Goal**: Select candidate edges for in-depth LLM validation.", "", "### Input", "", "**Pre-selected candidates**: `{{pre_selected_candidates}}`", "", "### Instruction", "", "- Recommend candidate pool size: 20", "- The input is a large file. First read `metadata`, then read top `candidates[:N]` into context", "- Perform a brief scan to finalize candidate pool ", "", "---", "", "## Stage 2: Edge Validation (Unified Subagents)", "", "**Goal**: Dispatch subagents to validate edges through code-level and logical analysis in parallel", "", "### Task Distribution", "", "**Two types of validation tasks**:", "", "1. **Candidate Edge Validation**: Validate if Strong/Weak/INVALID", "   - Create subagents to handle candidate edges", "   - Each subagent validates a subset of candidates", "", "2. **Inferred Edge Classification**: Classify strength as Strong/Weak", "   - Create separate subagents to handle inferred edges", "   - Each subagent classifies a subset of inferred dependencies", "   - Note: These edges are already valid (from commit DAG), only need strength classification", "", "**Execution**: Run both types of subagents in parallel", "", "**IMPORTANT - Parallel Execution**: You MUST launch all subagents in a single message with multiple Task tool calls to maximize performance. Do NOT launch subagents sequentially.", "", "### Subagent Instructions", "", "**CRITICAL**:", "- **DO NOT generate summary documents, markdown files, or comprehensive reports**", "- **DO NOT create additional documentation beyond the required JSON output**", "- **ONLY output the structured JSON validation result** (see Output Format below)", "- Focus solely on code analysis and decision-making", "", "**Dependency Direction** - `source → target`:", "- Means: **target depends on source** (target builds upon source's work)", "- **Commit-level rule**: If target's commit C2 depends on source's commit C1, then **C1 must execute before C2**", "- **Important**: Milestones can have time overlap, but commit dependencies must follow strict execution order", "", "**Edge Type Handling**:", "", "| Aspect | Candidate Edges | Inferred Edges |", "|--------|----------------|----------------|", "| **Validity** | Unknown (need to validate) | Already valid (from commit DAG) |", "| **Decision Options** | Strong / Weak / INVALID | Strong / Weak (no INVALID) |", "| **Step 3.5** | Optional (if code shows INVALID) | Optional (to determine strength) |", "| **Stage 3 Verification** | Required (if code-based) | Not required (already validated) |", "", "For each edge `source → target` conduct the following steps:", "", "#### Step 1: Load Commit Data", "", "Extract commits and patches for both source and target milestones from `{{milestone_csv}}` and `{{main_commits}}`", "", "#### Step 2: Analyze Code Dependencies", "", "**Analysis Method** (CODE ONLY):", "- ONLY analyze actual code changes (not commit DAG or semantic reasoning)", "- **Note**: Git ancestry ≠ code dependency", "", "**Access Commit Patches**:", "- **Option 1 (Recommended)**: Read preprocessed patches from `{{patches}}/<sha>.patch`", "- **Option 2**: Use git commands (see Step 3) for deeper inspection if needed", "", "**Two aspects to check**:", "", "1. **Code Modification**: Does target modify source's code?", "2. **Functional Usage** (recommended to check): Does target use source's functionality?", "   - Imports, API calls, class inheritance, etc.", "", "**Note**: Checking functional usage helps distinguish TEXT type (textual code only) from FUNC type (has functional coupling)", "", "#### Step 3: Git Repository Access (Optional - For Deeper Inspection)", "", "Use git commands when preprocessed patches are insufficient:", "", "```bash", "# View file at commit", "git -C {{repo_path}} show <sha>:<filepath>", "", "# Search for definitions", "git -C {{repo_path}} grep -n \"def function_name\" <sha>", "", "# Compare between commits", "git -C {{repo_path}} diff <sha1> <sha2> -- <filepath>", "```", "", "**Note**: Most analyses can be completed using preprocessed patches from Step 2.", "", "#### Step 3.5: Analyze Semantic & Logical Dependencies (Optional)", "", "**Goal**: Capture important logical relationships beyond pure code dependencies.", "", "**When to use**: After code analysis shows INVALID, but milestone categories (Breaking, Platform, Security) suggest potential logical relationships.", "", "**What to search**:", "1. **PR Metadata** (primary source)", "   - Extract PR numbers from milestone commits (via `{{main_commits}}`)", "   - Query `{{pull_requests}}` for PR titles, descriptions, labels", "   - Look for: \"depends on\", \"builds on\", \"requires\", version progression mentions", "", "2. **Issue Context** (if PR references issues)", "   - Query `{{issues}}` for issue descriptions and key discussion", "   - Focus on: architectural decisions, dependency mentions, deprecation plans", "", "3. **PR Conversations** (last resort)", "   - Query `{{pr_conversations}}` only when PR/Issue metadata insufficient", "   - Extract: design decisions explicitly mentioning dependencies", "", "**Constraints**:", "- **DO NOT read entire files** - use selective queries (jq/grep by PR/issue number)", "- **Query order**: commit → PR metadata → issue (optional) → conversation (rare)", "- **Time limit**: Max 2-3 minutes per edge for semantic analysis", "", "#### Step 4: Make Decision", "", "Classify the dependency based on **code evidence** and **optional semantic/logical evidence**:", "", "**Dependency Strength Categories**:", "- **Strong**: Upstream absence blocks downstream execution", "  - Code-level: Blocks build/test/pass, OR target must modify/extend source's code to implement its functionality", "  - Logic-level: Logically blocks execution (e.g., cannot drop Python 3.8 before establishing Python 3.8 as minimum)", "- **Weak**: Downstream can execute without upstream", "  - Code-level: Target incidentally modifies source's code but doesn't depend on it (e.g., code style cleanup, version bumps)", "  - Logic-level: Non-blocking logical relationships (e.g., quality improvements before features)", "- **INVALID**: No actual code or logical dependency (only for candidate edges)", "", "**Dependency Type Categories**:", "- **FUNC**: Functional dependency (target uses source's functionality via imports, API calls, inheritance, etc.)", "- **NFR**: Non-functional requirement dependency (version progression, security requirements, logical constraints)", "- **TEXT**: Textual-only dependency (target modifies source's code but does NOT use source's functionality)", "", "**Decision Logic**:", "1. Determine type based on Step 2 analysis:", "   - Has functional usage → **FUNC**", "   - Only logical constraints (Step 3.5) → **NFR**", "   - Only code modification, no functional usage → **TEXT**", "2. Determine strength based on blocking severity:", "   - Blocks execution → **Strong**", "   - Non-blocking → **Weak**", "3. **When uncertain, prefer INVALID** (safer to have fewer dependencies, only for candidates)", "", "#### Output Format （`{{result_path}}/validation_subagent_i.json` for i-th subagent）", "", "**IMPORTANT**: Return ONLY this JSON structure. Do NOT create markdown files, summary documents, or any additional outputs.", "", "```json", "{", "  \"subagent_id\": \"validation_subagent_1\",", "  \"edge_type\": \"candidate\" | \"inferred\",", "  \"validated_edges\": [", "    {", "      \"source\": \"M006\",", "      \"target\": \"M010\",", "      \"decision\": \"Strong\" | \"Weak\" | \"INVALID\",", "      \"dependency_type\": \"FUNC\" | \"NFR\" | \"TEXT\",", "      \"confidence\": 0.95,", "      \"evidence\": {", "        \"code_modification\": [", "          \"Commit bd71bcb modifies util/ssl_.py from source ae06688\"", "        ],", "        \"functional_usage\": [", "          \"Target imports typing.Literal from source (Python 3.8+)\",", "          \"Target uses HTTPConnection.read1() API from source\"", "        ],", "        \"logical_reasoning\": [", "          \"PR #3143: Establishes Python 3.8 as minimum version\",", "          \"PR #3492: Requires 3.8 as minimum before dropping it\"", "        ]", "      },", "      \"reasoning\": \"Strong FUNC: Target uses source's APIs. Blocks build without source.\",", "      \"pr_references\": [3143, 3492]", "    }", "  ]", "}", "```", "", "**Remember**: Keep `reasoning` concise (1-2 sentences). Focus on facts, not verbose explanations.", "", "#### Example Classifications", "", "**Example 1: FUNC type (has functional usage)**", "```", "Source: HTTP/2 Foundation", "Target: HTTP/2 Production", "", "Analysis:", "- Code modification: None", "- Functional usage: Target imports HTTP2Connection API from source", "", "Decision: Strong FUNC", "→ Target uses source's APIs without modifying source code", "```", "", "**Example 2: TEXT type - Weak (incidental code modification)**", "```", "Source: Add HTTPResponse.read1() API", "Target: Upgrade pre-commit tools (linting/formatting)", "", "Analysis:", "- Code modification: Target's tool upgrade reformats source's code (spacing, imports order)", "- Functional usage: None (linting tools don't call read1() API)", "", "Decision: Weak TEXT", "→ Code style changes only, target doesn't depend on source's functionality", "```", "", "---", "", "## Stage 3: Verification of Valid Dependencies (Main Agent)", "", "**Goal**: Verify that code-based Strong/Weak dependencies identified by subagents are truly cross-milestone dependencies.", "", "**Critical Check**: Prevent false positives where milestone-internal bug fixes are mistaken for cross-milestone dependencies.", "", "**Note**: Only code-based dependencies (with code_examples) require verification. Logic-based dependencies (with logical_evidence only) do not need commit verification, regardless of Strong or Weak classification.", "", "### Verification Steps", "", "For **each Strong or Weak edge** (`source → target`) from Stage 2:", "", "#### 1. Verify Evidence Commits", "", "Check **all commits mentioned in `evidence.code_examples`**:", "", "- **VALID**: Evidence commits belong to their claimed milestones", "  - If citing source's commit → must be in `source_commits`", "  - If citing target's commit → must be in `target_commits`", "", "- **INVALID**: Evidence commits don't belong to claimed milestone", "  - Example: \"M013's commit d7bb83b fixes M006's bug\" but d7bb83b ∈ M006", "  - This indicates milestone-internal dependency, not cross-milestone", "", "#### 2. Decision", "", "- **Keep as Strong/Weak**: All evidence commits verified correctly", "- **Reclassify as INVALID**: Any evidence commit belongs to wrong milestone", "", "**Note**: Verification results will be integrated into Stage 4 final report. No separate output file needed.", "", "---", "", "## Stage 4: Final Report Generation", "", "**Your Task**: Aggregate all validation and verification results into a final summary report.", "", "### Collect Results", "", "1. Combine all validated edges from Stage 2", "2. Apply verification results from Stage 3 (reclassify edges if needed)", "3. Summarize final decisions", "", "### Output Format", "", "#### 1. JSON Report (`{{result_path}}/validation_report.json`)", "", "```json", "{", "  \"metadata\": {", "    \"analysis_time\": \"2025-11-02T00:00:00\",", "    \"repo\": \"urllib3/urllib3\",", "    \"total_candidates_analyzed\": 20,", "    \"total_inferred_classified\": 10,", "    \"total_dependencies\": 11,", "    \"candidate_strong\": 1,", "    \"inferred_strong\": 10,", "    \"add_to_dag\": [\"M006→M010\"]", "  },", "  \"candidate_dependencies\": {", "    \"strong\": [", "      {", "        \"edge\": \"M006→M010\",", "        \"type\": \"NFR\",", "        \"basis\": \"logical\",", "        \"confidence\": 0.95,", "        \"rationale\": \"Python version progression: 3.7→3.8 must precede 3.8→3.9\"", "      }", "    ],", "    \"weak\": []", "  },", "  \"inferred_dependencies\": {", "    \"strong\": [", "      {", "        \"edge\": \"M004→M001\",", "        \"type\": \"FUNC\",", "        \"confidence\": 0.90,", "        \"rationale\": \"HTTP/2 implementation provides foundation for HTTP/2 support\"", "      }", "    ],", "    \"weak\": []", "  },", "  \"verification_notes\": {", "    \"code_based_verified\": [],", "    \"reclassified_to_invalid\": []", "  }", "}", "```", "", "#### 2. CSV Export (`{{dependencies_csv}}`)", "", "**Columns**: `prerequisite_id`, `dependant_id`, `type` (FUNC/NFR/TEXT), `strength` (Strong/Weak), `rationale`, `confidence_score`", "", "**Include**: All validated Strong/Weak dependencies (both candidate and inferred)", "", "### Final DAG Validation", "", "After generating `{{dependencies_csv}}`, run final validation to ensure the dependency graph is complete and correct:", "", "**CRITICAL - Tool Usage**: You MUST use the MCP tool below. DO NOT write custom Python scripts as replacement.", "", "**Tool**: `{{analyze_dag_conflicts}}(milestone_csv_path={{milestone_csv}}, dependencies_csv_path={{dependencies_csv}})` (switch params to absolute paths)", "", "**Required Results & Fixes**:", "", "| Check | Required Result | If Fails, Fix By |", "|-------|----------------|------------------|", "| **Missing dependencies** | `missing_dependencies = []` (all inferred dependencies included) | Add missing inferred edges to `{{dependencies_csv}}` with appropriate type/strength classification |", "| **Cycles** | `enriched_cycles = []`, `existing_cycles = []` (DAG is acyclic) | Review cycle details, remove edges causing cycles |", "| **Redundant edges** | `redundant_dependencies = []` (transitive reduction done) | Remove transitive dependencies already covered by existing paths |", "", "---", "", "## Key Principles", "", "### 1. Code-First Analysis", "- All decisions must be based on **actual code inspection** first", "- Provide concrete code examples as evidence for code-based dependencies", "- Logical evidence can elevate INVALID to Strong or Weak, depending on blocking severity", "", "### 2. Conservative Validation", "- When uncertain, prefer **INVALID** over Strong/Weak", "- Strong dependencies require high confidence (>0.8) with clear blocking evidence:", "  - Code-level: Blocks build/test/pass, OR", "  - Logic-level: Logically blocks execution (e.g., version progression)", "- Weak dependencies require either:", "  - Moderate confidence (>0.6) with code degradation evidence, OR", "  - Clear PR/Issue evidence of non-blocking logical relationships", "", "### 3. Direct Dependencies Only", "- Focus on **direct** dependencies", "- Avoid adding transitive dependencies", "- Check if dependency is already covered by existing paths", "", "### 4. Concurrency Safety", "- All git commands are read-only (safe for parallel execution)", "- 5-10 subagents can run in parallel safely", "", "---", "", "## Success Criteria", "", "Your validation is successful if:", "1. All finalized candidates have clear Strong/Weak/INVALID decisions", "2. Each Strong decision is supported by:", "   - Code examples showing blocking dependencies, OR", "   - PR/Issue evidence showing logically blocking relationships (e.g., version progression)", "3. Each Weak decision is supported by:", "   - Code examples showing degradation, OR", "   - PR/Issue evidence showing non-blocking logical relationships", "4. **All validated Strong/Weak edges are from the provided pre-selected candidate set**", "5. **Stage 3 verification completed: All code-based Strong/Weak edges confirmed as cross-milestone dependencies** (not milestone-internal)", "6. **Final DAG validation passed**: All inferred dependencies included, no cycles, no redundant edges (using `{{analyze_dag_conflicts}}`)"], "new": ["# DAG Dependency Validation with LLM-as-Judge", "", "## Overview", "", "This workflow infers the milestone dependency using LLM-based analysis. The goal is to identify valid **dependencies** through code-level analysis.", "", "**IMPORTANT - Dependency Direction Convention**:", "**`source → target`** means **target depends on source**.", "", "In other words, `source` must be completed before `target` can start. Target builds upon source's work.", "", "**Core Principle**: `inferred_dependencies` (from commit DAG) are assumed correct, except low-confidence cross-repo (xrepo) edges, which are validated like candidates (see the workspace rules below).", "", "**This workflow performs two tasks**:", "1. **Validate candidate dependencies**: Potentially missing edges → Should they be added? (Strong/Weak/INVALID)", "2. **Classify inferred dependencies**: Already valid edges → What's their strength? (Strong/Weak)", "", "### Workspace `{{workspace_id}}`", "", "This run covers a workspace of one or more repositories that are developed together:", "", "{{workspace_repos_table}}", "", "- Inspect code with `git -C repo_data/<repo> ...` (the `repo dir` column of the table; for a one-repo workspace that is `repo_data` itself). The MCP git tools route to the correct repository automatically.", "- Commit ids are bare 7-character SHAs, unique inside the workspace. A commit's repository is its `repo` field in the commit records or its entry in `commit_repos` (`commit_repos.json`). Never guess it from the SHA and never run `git` against the wrong repository.", "- With more than one repository, every file path in merged data is prefixed `<repo>/<path-in-repo>`; strip the prefix before passing a path to `git -C repo_data/<repo>`.", "- Edges in `commit_dag.json` come in two groups. `edges_dag` holds per-repository textual edges plus HARD cross-repo edges (`\"xrepo\": true`, `edge_types` such as `xrepo_contract`, `xrepo_pin`, `xrepo_pr_link`). `edges_soft` holds heuristic hints (for example time proximity): never enforced, and you may cut them.", "", "**Cross-repo rules**:", "- Edges between commits of different repositories are HARD xrepo edges in `edges_dag` (`\"xrepo\": true`, with a confidence score) or soft hints in `edges_soft`. Inferred xrepo edges with LOW confidence are NOT assumed correct: validate them with code evidence like any candidate edge, and prefer INVALID when uncertain. Soft edges are never assumed correct.", "- Dependency type **XREPO**: the source and target milestones are connected through a cross-repo edge (a contract change used by a consumer in another repository, a dependency pin bump across an interface change, or an explicit cross-repo PR link). Use XREPO instead of FUNC when the dependency crosses a repository boundary.", "---", "", "## Input Data", "", "### Required Files", "", "1. **Milestone Assignments**: `{{milestone_csv}}`", "    - Each milestone constructed by a set of non-overlapped **commits**", "", "2. **Inferred Dependencies**: `{{inferred_dependencies}}`", "   - Code-inferred edges (ASSUMED CORRECT)", "", "4. **Pre-Selected Candidates**: `{{pre_selected_candidates}}`", "   - Pre-ranked based on heuristics", "   - Selectively read into context from top to down.", "", "5. **Commit Data**: `{{main_commits}}`", "   - Commit SHA (7 chars), message, author, timestamp, etc.", "", "6. **Commit DAG**: `{{commit_dag}}`", "   - `nodes`: Commit metadata (in/out degree, ancestors/descendants count)", "   - `edges_dag`: Exact commit-level dependencies with edge types", "", "7. **Git Repositories**: one checkout per row of the repository table above (`repo_data/<repo>`)", "   - For code inspection at specific commits", "", "### Optional Resources (for Semantic/Logical Dependencies)", "", "8. **PR Metadata**: `{{pull_requests}}`", "   - PR titles, descriptions, labels", "   - Query selectively by PR number from commits", "", "9. **Issue Context**: `{{issues}}`", "   - Issue descriptions and discussion", "   - Query if PR references specific issues", "", "10. **PR Conversations**: `{{pr_conversations}}`", "    - Full discussion threads (can be large)", "    - Use sparingly, only when PR/Issue metadata insufficient", "", "---", "", "## Stage 1: Finalize Candidate Pool from Pre-selected Candidates", "", "**Goal**: Select candidate edges for in-depth LLM validation.", "", "### Input", "", "**Pre-selected candidates**: `{{pre_selected_candidates}}`", "", "### Instruction", "", "- Recommend candidate pool size: 20", "- The input is a large file. First read `metadata`, then read top `candidates[:N]` into context", "- Perform a brief scan to finalize candidate pool ", "", "---", "", "## Stage 2: Edge Validation (Unified Subagents)", "", "**Goal**: Dispatch subagents to validate edges through code-level and logical analysis in parallel", "", "### Task Distribution", "", "**Two types of validation tasks**:", "", "1. **Candidate Edge Validation**: Validate if Strong/Weak/INVALID", "   - Create subagents to handle candidate edges", "   - Each subagent validates a subset of candidates", "", "2. **Inferred Edge Classification**: Classify strength as Strong/Weak", "   - Create separate subagents to handle inferred edges", "   - Each subagent classifies a subset of inferred dependencies", "   - Note: These edges are already valid (from commit DAG), only need strength classification", "", "**Execution**: Run both types of subagents in parallel", "", "**IMPORTANT - Parallel Execution**: You MUST launch all subagents in a single message with multiple Task tool calls to maximize performance. Do NOT launch subagents sequentially.", "", "### Subagent Instructions", "", "**CRITICAL**:", "- **DO NOT generate summary documents, markdown files, or comprehensive reports**", "- **DO NOT create additional documentation beyond the required JSON output**", "- **ONLY output the structured JSON validation result** (see Output Format below)", "- Focus solely on code analysis and decision-making", "", "**Dependency Direction** - `source → target`:", "- Means: **target depends on source** (target builds upon source's work)", "- **Commit-level rule**: If target's commit C2 depends on source's commit C1, then **C1 must execute before C2**", "- **Important**: Milestones can have time overlap, but commit dependencies must follow strict execution order", "", "**Edge Type Handling**:", "", "| Aspect | Candidate Edges | Inferred Edges |", "|--------|----------------|----------------|", "| **Validity** | Unknown (need to validate) | Already valid (from commit DAG) |", "| **Decision Options** | Strong / Weak / INVALID | Strong / Weak (no INVALID) |", "| **Step 3.5** | Optional (if code shows INVALID) | Optional (to determine strength) |", "| **Stage 3 Verification** | Required (if code-based) | Not required (already validated) |", "", "For each edge `source → target` conduct the following steps:", "", "#### Step 1: Load Commit Data", "", "Extract commits and patches for both source and target milestones from `{{milestone_csv}}` and `{{main_commits}}`", "", "#### Step 2: Analyze Code Dependencies", "", "**Analysis Method** (CODE ONLY):", "- ONLY analyze actual code changes (not commit DAG or semantic reasoning)", "- **Note**: Git ancestry ≠ code dependency", "", "**Access Commit Patches**:", "- **Option 1 (Recommended)**: Read preprocessed patches from `{{patches}}/<sha>.patch`", "- **Option 2**: Use git commands (see Step 3) for deeper inspection if needed", "", "**Two aspects to check**:", "", "1. **Code Modification**: Does target modify source's code?", "2. **Functional Usage** (recommended to check): Does target use source's functionality?", "   - Imports, API calls, class inheritance, etc.", "", "**Note**: Checking functional usage helps distinguish TEXT type (textual code only) from FUNC type (has functional coupling)", "", "#### Step 3: Git Repository Access (Optional - For Deeper Inspection)", "", "Use git commands when preprocessed patches are insufficient:", "", "```bash", "# View file at commit", "git -C repo_data/<repo> show <sha>:<filepath>", "", "# Search for definitions", "git -C repo_data/<repo> grep -n \"def function_name\" <sha>", "", "# Compare between commits", "git -C repo_data/<repo> diff <sha1> <sha2> -- <filepath>", "```", "", "**Note**: Most analyses can be completed using preprocessed patches from Step 2.", "", "#### Step 3.5: Analyze Semantic & Logical Dependencies (Optional)", "", "**Goal**: Capture important logical relationships beyond pure code dependencies.", "", "**When to use**: After code analysis shows INVALID, but milestone categories (Breaking, Platform, Security) suggest potential logical relationships.", "", "**What to search**:", "1. **PR Metadata** (primary source)", "   - Extract PR numbers from milestone commits (via `{{main_commits}}`)", "   - Query `{{pull_requests}}` for PR titles, descriptions, labels", "   - Look for: \"depends on\", \"builds on\", \"requires\", version progression mentions", "", "2. **Issue Context** (if PR references issues)", "   - Query `{{issues}}` for issue descriptions and key discussion", "   - Focus on: architectural decisions, dependency mentions, deprecation plans", "", "3. **PR Conversations** (last resort)", "   - Query `{{pr_conversations}}` only when PR/Issue metadata insufficient", "   - Extract: design decisions explicitly mentioning dependencies", "", "**Constraints**:", "- **DO NOT read entire files** - use selective queries (jq/grep by PR/issue number)", "- **Query order**: commit → PR metadata → issue (optional) → conversation (rare)", "- **Time limit**: Max 2-3 minutes per edge for semantic analysis", "", "#### Step 4: Make Decision", "", "Classify the dependency based on **code evidence** and **optional semantic/logical evidence**:", "", "**Dependency Strength Categories**:", "- **Strong**: Upstream absence blocks downstream execution", "  - Code-level: Blocks build/test/pass, OR target must modify/extend source's code to implement its functionality", "  - Logic-level: Logically blocks execution (e.g., cannot drop Python 3.8 before establishing Python 3.8 as minimum)", "- **Weak**: Downstream can execute without upstream", "  - Code-level: Target incidentally modifies source's code but doesn't depend on it (e.g., code style cleanup, version bumps)", "  - Logic-level: Non-blocking logical relationships (e.g., quality improvements before features)", "- **INVALID**: No actual code or logical dependency (only for candidate edges)", "", "**Dependency Type Categories**:", "- **FUNC**: Functional dependency (target uses source's functionality via imports, API calls, inheritance, etc.)", "- **NFR**: Non-functional requirement dependency (version progression, security requirements, logical constraints)", "- **TEXT**: Textual-only dependency (target modifies source's code but does NOT use source's functionality)", "- **XREPO**: Cross-repository dependency (see the workspace rules above); takes precedence over FUNC when the source and target are in different repositories", "", "**Decision Logic**:", "1. Determine type based on Step 2 analysis:", "   - Has functional usage → **FUNC**", "   - Only logical constraints (Step 3.5) → **NFR**", "   - Only code modification, no functional usage → **TEXT**", "2. Determine strength based on blocking severity:", "   - Blocks execution → **Strong**", "   - Non-blocking → **Weak**", "3. **When uncertain, prefer INVALID** (safer to have fewer dependencies, only for candidates)", "", "#### Output Format （`{{result_path}}/validation_subagent_i.json` for i-th subagent）", "", "**IMPORTANT**: Return ONLY this JSON structure. Do NOT create markdown files, summary documents, or any additional outputs.", "", "```json", "{", "  \"subagent_id\": \"validation_subagent_1\",", "  \"edge_type\": \"candidate\" | \"inferred\",", "  \"validated_edges\": [", "    {", "      \"source\": \"M006\",", "      \"target\": \"M010\",", "      \"decision\": \"Strong\" | \"Weak\" | \"INVALID\",", "      \"dependency_type\": \"FUNC\" | \"NFR\" | \"TEXT\" | \"XREPO\",", "      \"confidence\": 0.95,", "      \"evidence\": {", "        \"code_modification\": [", "          \"Commit bd71bcb modifies util/ssl_.py from source ae06688\"", "        ],", "        \"functional_usage\": [", "          \"Target imports typing.Literal from source (Python 3.8+)\",", "          \"Target uses HTTPConnection.read1() API from source\"", "        ],", "        \"logical_reasoning\": [", "          \"PR #3143: Establishes Python 3.8 as minimum version\",", "          \"PR #3492: Requires 3.8 as minimum before dropping it\"", "        ]", "      },", "      \"reasoning\": \"Strong FUNC: Target uses source's APIs. Blocks build without source.\",", "      \"pr_references\": [3143, 3492]", "    }", "  ]", "}", "```", "", "**Remember**: Keep `reasoning` concise (1-2 sentences). Focus on facts, not verbose explanations.", "", "#### Example Classifications", "", "**Example 1: FUNC type (has functional usage)**", "```", "Source: HTTP/2 Foundation", "Target: HTTP/2 Production", "", "Analysis:", "- Code modification: None", "- Functional usage: Target imports HTTP2Connection API from source", "", "Decision: Strong FUNC", "→ Target uses source's APIs without modifying source code", "```", "", "**Example 2: TEXT type - Weak (incidental code modification)**", "```", "Source: Add HTTPResponse.read1() API", "Target: Upgrade pre-commit tools (linting/formatting)", "", "Analysis:", "- Code modification: Target's tool upgrade reformats source's code (spacing, imports order)", "- Functional usage: None (linting tools don't call read1() API)", "", "Decision: Weak TEXT", "→ Code style changes only, target doesn't depend on source's functionality", "```", "", "---", "", "## Stage 3: Verification of Valid Dependencies (Main Agent)", "", "**Goal**: Verify that code-based Strong/Weak dependencies identified by subagents are truly cross-milestone dependencies.", "", "**Critical Check**: Prevent false positives where milestone-internal bug fixes are mistaken for cross-milestone dependencies.", "", "**Note**: Only code-based dependencies (with code_examples) require verification. Logic-based dependencies (with logical_evidence only) do not need commit verification, regardless of Strong or Weak classification.", "", "### Verification Steps", "", "For **each Strong or Weak edge** (`source → target`) from Stage 2:", "", "#### 1. Verify Evidence Commits", "", "Check **all commits mentioned in `evidence.code_examples`**:", "", "- **VALID**: Evidence commits belong to their claimed milestones", "  - If citing source's commit → must be in `source_commits`", "  - If citing target's commit → must be in `target_commits`", "", "- **INVALID**: Evidence commits don't belong to claimed milestone", "  - Example: \"M013's commit d7bb83b fixes M006's bug\" but d7bb83b ∈ M006", "  - This indicates milestone-internal dependency, not cross-milestone", "", "#### 2. Decision", "", "- **Keep as Strong/Weak**: All evidence commits verified correctly", "- **Reclassify as INVALID**: Any evidence commit belongs to wrong milestone", "", "**Note**: Verification results will be integrated into Stage 4 final report. No separate output file needed.", "", "---", "", "## Stage 4: Final Report Generation", "", "**Your Task**: Aggregate all validation and verification results into a final summary report.", "", "### Collect Results", "", "1. Combine all validated edges from Stage 2", "2. Apply verification results from Stage 3 (reclassify edges if needed)", "3. Summarize final decisions", "", "### Output Format", "", "#### 1. JSON Report (`{{result_path}}/validation_report.json`)", "", "```json", "{", "  \"metadata\": {", "    \"analysis_time\": \"2025-11-02T00:00:00\",", "    \"repo\": \"urllib3/urllib3\",", "    \"total_candidates_analyzed\": 20,", "    \"total_inferred_classified\": 10,", "    \"total_dependencies\": 11,", "    \"candidate_strong\": 1,", "    \"inferred_strong\": 10,", "    \"add_to_dag\": [\"M006→M010\"]", "  },", "  \"candidate_dependencies\": {", "    \"strong\": [", "      {", "        \"edge\": \"M006→M010\",", "        \"type\": \"NFR\",", "        \"basis\": \"logical\",", "        \"confidence\": 0.95,", "        \"rationale\": \"Python version progression: 3.7→3.8 must precede 3.8→3.9\"", "      }", "    ],", "    \"weak\": []", "  },", "  \"inferred_dependencies\": {", "    \"strong\": [", "      {", "        \"edge\": \"M004→M001\",", "        \"type\": \"FUNC\",", "        \"confidence\": 0.90,", "        \"rationale\": \"HTTP/2 implementation provides foundation for HTTP/2 support\"", "      }", "    ],", "    \"weak\": []", "  },", "  \"verification_notes\": {", "    \"code_based_verified\": [],", "    \"reclassified_to_invalid\": []", "  }", "}", "```", "", "#### 2. CSV Export (`{{dependencies_csv}}`)", "", "**Columns**: `prerequisite_id`, `dependant_id`, `type` (FUNC/NFR/TEXT/XREPO), `strength` (Strong/Weak), `rationale`, `confidence_score`", "", "**Include**: All validated Strong/Weak dependencies (both candidate and inferred)", "", "### Final DAG Validation", "", "After generating `{{dependencies_csv}}`, run final validation to ensure the dependency graph is complete and correct:", "", "**CRITICAL - Tool Usage**: You MUST use the MCP tool below. DO NOT write custom Python scripts as replacement.", "", "**Tool**: `{{analyze_dag_conflicts}}(milestone_csv_path={{milestone_csv}}, dependencies_csv_path={{dependencies_csv}})` (switch params to absolute paths)", "", "**Required Results & Fixes**:", "", "| Check | Required Result | If Fails, Fix By |", "|-------|----------------|------------------|", "| **Missing dependencies** | `missing_dependencies = []` (all inferred dependencies included) | Add missing inferred edges to `{{dependencies_csv}}` with appropriate type/strength classification |", "| **Cycles** | `enriched_cycles = []`, `existing_cycles = []` (DAG is acyclic) | Review cycle details, remove edges causing cycles |", "| **Redundant edges** | `redundant_dependencies = []` (transitive reduction done) | Remove transitive dependencies already covered by existing paths |", "", "---", "", "## Key Principles", "", "### 1. Code-First Analysis", "- All decisions must be based on **actual code inspection** first", "- Provide concrete code examples as evidence for code-based dependencies", "- Logical evidence can elevate INVALID to Strong or Weak, depending on blocking severity", "", "### 2. Conservative Validation", "- When uncertain, prefer **INVALID** over Strong/Weak", "- Strong dependencies require high confidence (>0.8) with clear blocking evidence:", "  - Code-level: Blocks build/test/pass, OR", "  - Logic-level: Logically blocks execution (e.g., version progression)", "- Weak dependencies require either:", "  - Moderate confidence (>0.6) with code degradation evidence, OR", "  - Clear PR/Issue evidence of non-blocking logical relationships", "", "### 3. Direct Dependencies Only", "- Focus on **direct** dependencies", "- Avoid adding transitive dependencies", "- Check if dependency is already covered by existing paths", "", "### 4. Concurrency Safety", "- All git commands are read-only (safe for parallel execution)", "- 5-10 subagents can run in parallel safely", "", "---", "", "## Success Criteria", "", "Your validation is successful if:", "1. All finalized candidates have clear Strong/Weak/INVALID decisions", "2. Each Strong decision is supported by:", "   - Code examples showing blocking dependencies, OR", "   - PR/Issue evidence showing logically blocking relationships (e.g., version progression)", "3. Each Weak decision is supported by:", "   - Code examples showing degradation, OR", "   - PR/Issue evidence showing non-blocking logical relationships", "4. **All validated Strong/Weak edges are from the provided pre-selected candidate set**", "5. **Stage 3 verification completed: All code-based Strong/Weak edges confirmed as cross-milestone dependencies** (not milestone-internal)", "6. **Final DAG validation passed**: All inferred dependencies included, no cycles, no redundant edges (using `{{analyze_dag_conflicts}}`)"], "ops": [["equal", 0, 11, 0, 11], ["replace", 11, 12, 11, 12], ["equal", 12, 17, 12, 17], ["insert", 17, 17, 17, 31], ["equal", 17, 40, 31, 54], ["replace", 40, 41, 54, 55], ["equal", 41, 148, 55, 162], ["replace", 148, 149, 162, 163], ["equal", 149, 151, 163, 165], ["replace", 151, 152, 165, 166], ["equal", 152, 154, 166, 168], ["replace", 154, 155, 168, 169], ["equal", 155, 201, 169, 215], ["insert", 201, 201, 215, 216], ["equal", 201, 225, 216, 240], ["replace", 225, 226, 240, 241], ["equal", 226, 370, 241, 385], ["replace", 370, 371, 385, 386], ["equal", 371, 432, 386, 447]], "add": 22, "del": 7}, {"what": ["Added the workspace section.", "src_loc is counted per repo and summed; the size balance (CV) is computed on the sum.", "Size thresholds are measured against workspace totals.", "Never split a contract change from its first consumer. A split milestone must still touch at least 2 repos.", "integration_test_commit: one per repo. The repos column is recomputed for new sub-milestones."], "why": "Single-repo runs are just a workspace with one repo, so one multi-repo prompt is enough.", "rewritten": true, "id": "milestone-decompose-md", "path": "deepcommit/pipeline/prompts/stage_breakdown_v1/milestone_decompose.md", "name": "milestone_decompose.md", "group": "Phase 2: milestone stages", "note": "Stage 4. Rewritten multi-repo only: src_loc per repo summed and CV on the sum, workspace-level thresholds, one integration_test_commit per repo, repos column recomputed.", "status": "modified", "old": ["# Milestone DAG Balancing", "", "## Task Overview", "", "Your task is to optimize the global milestone DAG by balancing milestone sizes through an iterative three-stage process. The goal is to achieve a coefficient of variation (CV) of src_loc across all milestones below 1.0.", "", "**Core Strategy: Three-Stage Iterative Optimization**", "", "- **Stage 1**: Global analysis and targeting (Main Agent)", "- **Stage 2**: Parallel commit splitting (Subagents)", "- **Stage 3**: Global reorganization and balancing (Main Agent)", "", "**Target**: Reduce milestone `src_loc` CV; report **SUCCESS** if CV < 1.0, otherwise **WARNING** (but do not regress CV vs the input).", "", "**Key Principles**:", "- Global optimization over local perfection", "- Iterative refinement with CV-guided convergence", "- Intelligent LLM-based decisions (treat script thresholds as signals, not rules)", "- Parallel processing where possible (Stage 2)", "- Skip documentary milestones that do not contain any source code changes.", "", "---", "", "## Input Data", "", "### 1. Milestones Collection", "", "**File path**: `{{milestone_csv}}`", "", "**CSV format**: Preserve the existing header and any extra columns. At minimum, ensure these columns exist and are populated:", "- `id`, `title`, `category`, `commits`, `mini_srs`, `confidence_score`", "- `src_loc` (computed and added by this stage via the analysis script; used for balancing)", "", "**Key fields**:", "- **id**: Milestone identifier (parent like `M003`, sub-milestone like `M003_sub-01`)", "- **commits**: Semicolon-separated commit SHAs (short or full; keep the input style consistent)", "- **mini_srs**: Short functional description (keep the input style consistent)", "- **src_loc** (used for balancing): Total additions + deletions for files under `REPO_SRC_DIRS` only (respecting `exclude_patterns`)", "- **integration_test_commit** (optional, if present): Must be empty or a single SHA; never more than one per milestone", "", "### 2. Dependencies", "", "**File path**: `{{dependencies_csv}}`", "", "**CSV format**:", "```csv", "prerequisite_id,dependant_id,type,strength,rationale,confidence_score", "M2,M1,FUNC,Strong,\"M1 depends on M2's infrastructure\",0.9", "```", "", "**Semantics**: ", "- Direction: Edge `[prerequisite_id, dependant_id]` means `dependant_id` **depends on** `prerequisite_id`", "- Execution order: source should complete before target starts (Weak = recommended, Strong = required)", "", "**Dependency fields**:", "- **type** (MUST be one of):", "  - `FUNC`: Functional dependency - code/API dependency between milestones", "  - `NFR`: Non-functional requirement - performance, security, reliability dependency", "  - `TEXT`: Textual/documentation dependency", "- **strength** (MUST be exactly `Strong` or `Weak` - NO other values allowed):", "  - `Weak`: Downstream milestone can still build/test without upstream, but with degraded accuracy/robustness/experience or higher failure rate", "  - `Strong`: Upstream absence blocks build/test/pass entirely", "", "**⚠️ IMPORTANT**: The `strength` field accepts ONLY two values: `Strong` or `Weak`.", "", "### 3. Original Repository", "", "**Repository path**: `{{repo_path}}`", "", "The original Git repository containing all commits and source code for analysis and commit splitting operations.", "", "### 4. Main Branch Commits Metadata", "", "**File path**: `{{main_commits}}`", "", "JSONL file containing metadata for all commits on the main branch, including:", "- Commit SHA, message, author, timestamp", "- File changes and statistics", "- Source code modifications", "", "Used for commit analysis and understanding development history.", "", "### 5. Available Tools", "", "**Statistical analysis script**:", "```bash", "python {{identify_imbalances}} \\", "  --repo-path {{repo_path}} \\", "  --milestone-dir {{result_path}} \\", "  --repo-src-dirs {{repo_src_dirs}} \\", "  --exclude-patterns \"{{exclude_patterns}}\" \\", "  [--small]  # For undersized milestones", "  [--k-value K]  # Std deviation multiplier", "  [--output-json PATH]  # Optional JSON output for machine parsing", "```", "", "**Output**:", "- Updates `src_loc` in the active `milestones.csv` (in-place)", "- Prints global stats and candidates to stdout", "- If `--output-json` is provided, writes `{\"statistics\": ..., \"extreme_milestones\": [...]}` for machine parsing", "", "**MCP tools**:", "- `{{get_commit_context}}(sha, expand=['files', 'stats', 'diff'])` - Get commit details", "- `{{calculate_commits_src_loc_tool}}(commits)` - Calculate src_loc for commits (additions + deletions in REPO_SRC_DIRS path only)", "- `{{validate_milestone_partitioning}}(milestone_csv, split_metadata_dir=None)` - Check milestone-level cycles; pass `split_metadata_dir` to include split commit dependencies", "- `{{analyze_dag_conflicts}}(milestone_csv_path, dependencies_csv_path, split_metadata_dir=None)` - Check DAG validity; pass `split_metadata_dir` to include split commit dependencies", "", "**Configuration**:", "- `REPO_SRC_DIRS`: Source directory prefix (e.g., \"src/\") for src_loc calculation", "- `MAX_ITERATIONS`: Maximum iteration cycles (default: 5)", "", "---", "", "## Stage 1: Global Analysis and Targeting", "", "**Objective**: Identify which milestones and commits need splitting to improve global CV", "", "### 1.1 Identify Oversized Milestones and Large Commits", "", "**Call the statistical analysis script** `{{identify_imbalances}}` to obtain candidate oversized milestones and commits:", "", "**Script output** (from stdout or `--output-json`):", "- **Global statistics**: mean/std and milestone-level CV (`statistics.cv_milestones`)", "- **Candidate milestones**: `extreme_milestones` (oversized if `--small` not set; undersized if `--small` set)", "- **Commit-level details**: For each milestone, `commit_src_locs` mapping commit SHA → `src_loc`", "", "**Check termination**:", "- If CV < 1.0: Output \"Already balanced\" and exit", "- If CV >= 1.0: Continue to intelligent filtering", "", "**Step 1: LLM filter oversized milestones**", "", "Review script output and select milestones to split:", "", "**Selection criteria**:", "-
