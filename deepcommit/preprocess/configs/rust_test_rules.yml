# Rust Test Detection Rules for ast-grep
# Uses 'follows' relation to match functions preceded by test attributes
# Multiple rules separated by ---

id: test_fn
language: rust
rule:
  pattern: fn $NAME($$$ARGS) { $$$ }
  follows:
    pattern: '#[test]'
---
id: test_fn_pub
language: rust
rule:
  pattern: pub fn $NAME($$$ARGS) { $$$ }
  follows:
    pattern: '#[test]'
---
