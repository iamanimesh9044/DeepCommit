repo_src_dirs:
- core
- gateway
- internal
- mcp
- rest
- zrpc
test_dirs:
- '**/*_test.go'
- '**/testdata/**'
exclude:
- internal/mock/**
- '**/example/**'
- '**/examples/**'
main_branch: master

# Test framework configuration for test ID normalization
# go_test: Enables normalization of random subtest IDs (e.g., stringx.Rand(), stringx.RandId())
test_framework: go_test
